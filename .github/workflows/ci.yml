name: CI/CD Pipeline

on:
  push:
    branches: [ main, test, develop ]
  pull_request:
    branches: [ main, test, develop ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      interface: ${{ steps.detect.outputs.interface }}
      user: ${{ steps.detect.outputs.user }}
      job: ${{ steps.detect.outputs.job }}
      task: ${{ steps.detect.outputs.task }}
    steps:
    - uses: actions/checkout@v4

    - name: Detect changes
      id: detect
      run: |
        # Check if any files changed in each service directory
        echo "interface=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E 'app/cin/interface|api/cin/interface' | wc -l | xargs test 0 -ne && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
        echo "user=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E 'app/service/user|api/service/user' | wc -l | xargs test 0 -ne && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
        echo "job=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E 'app/job|api/job' | wc -l | xargs test 0 -ne && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
        echo "task=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E 'app/task|api/task' | wc -l | xargs test 0 -ne && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.0'

    - name: Install dependencies
      run: go mod tidy

    - name: Run tests
      run: go test ./...

    - name: Build applications
      run: |
        # Use Makefile to build all services
        make build

  docker-build:
    needs: [build, detect-changes]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test' || github.ref == 'refs/heads/develop')
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push interface service
      if: needs.detect-changes.outputs.interface == 'true'
      run: |
        cd app/cin/interface
        make docker

    - name: Build and push user service
      if: needs.detect-changes.outputs.user == 'true'
      run: |
        cd app/service/user
        make docker

    - name: Build and push job service
      if: needs.detect-changes.outputs.job == 'true'
      run: |
        cd app/job
        make docker

    - name: Build and push task service
      if: needs.detect-changes.outputs.task == 'true'
      run: |
        cd app/task
        make docker

  deploy:
    needs: [docker-build, detect-changes]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test' || github.ref == 'refs/heads/develop')
    steps:
    - uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'latest'

    - name: Configure kubectl
      run: |
        mkdir -p ~/.kube
        # Check if KUBE_CONFIG is set
        if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
          echo "Error: KUBE_CONFIG secret is not set"
          echo "Please follow these steps to set up KUBE_CONFIG:"
          echo "1. Install k3s on your server: curl -sfL https://get.k3s.io | sh -"
          echo "2. Get kubeconfig: cat /etc/rancher/k3s/k3s.yaml"
          echo "3. Encode to base64: cat /etc/rancher/k3s/k3s.yaml | base64 -w 0"
          echo "4. Add as GitHub Secret: KUBE_CONFIG"
          exit 1
        fi
        
        # Validate base64 content
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config 2>&1
        if [ $? -ne 0 ]; then
          echo "Error: Invalid base64 encoding in KUBE_CONFIG"
          echo "Please ensure you copied the complete base64 string without any spaces or newlines"
          exit 1
        fi
        
        if [ ! -s ~/.kube/config ]; then
          echo "Error: Decoded KUBE_CONFIG is empty"
          exit 1
        fi
        
        echo "Kubeconfig configured successfully"
        ls -la ~/.kube/config
        
        # Show kubeconfig content (masking sensitive information)
        echo "Kubeconfig server address:"
        grep -E 'server:' ~/.kube/config

    - name: Test kubectl connection
      run: |
        echo "Testing kubectl connection..."
        kubectl cluster-info --insecure-skip-tls-verify
        kubectl get nodes --insecure-skip-tls-verify
        kubectl get pods --all-namespaces --insecure-skip-tls-verify

    - name: Update Kubernetes deployments
      run: |
        # Update interface deployment
        if [ "${{ needs.detect-changes.outputs.interface }}" == "true" ]; then
          sed -i 's|go-kratos/cin-interface:0.1.0|${{ secrets.DOCKER_USERNAME }}/cyi-interface:${{ github.sha }}|g' deploy/k8s/microservices/interface/deployment.yaml
        fi
        
        # Update user deployment
        if [ "${{ needs.detect-changes.outputs.user }}" == "true" ]; then
          sed -i 's|go-kratos/service-user:0.1.0|${{ secrets.DOCKER_USERNAME }}/cyi-user:${{ github.sha }}|g' deploy/k8s/microservices/user/deployment.yaml
        fi
        
        # Update job deployment
        if [ "${{ needs.detect-changes.outputs.job }}" == "true" ]; then
          sed -i 's|go-kratos/job:0.1.0|${{ secrets.DOCKER_USERNAME }}/cyi-job:${{ github.sha }}|g' deploy/k8s/microservices/job/deployment.yaml
        fi
        
        # Update task deployment
        if [ "${{ needs.detect-changes.outputs.task }}" == "true" ]; then
          sed -i 's|go-kratos/task:0.1.0|${{ secrets.DOCKER_USERNAME }}/cyi-task:${{ github.sha }}|g' deploy/k8s/microservices/task/deployment.yaml
        fi
        
        # Apply changes - only deploy microservices and monitoring
        # Infrastructure services (consul, mysql, redis) should be deployed manually once
        kubectl apply --insecure-skip-tls-verify --validate=false -f deploy/k8s/microservices/interface/
        kubectl apply --insecure-skip-tls-verify --validate=false -f deploy/k8s/microservices/user/
        kubectl apply --insecure-skip-tls-verify --validate=false -f deploy/k8s/microservices/job/
        kubectl apply --insecure-skip-tls-verify --validate=false -f deploy/k8s/microservices/task/
        kubectl apply --insecure-skip-tls-verify --validate=false -f deploy/k8s/monitoring/grafana/
        kubectl apply --insecure-skip-tls-verify --validate=false -f deploy/k8s/monitoring/prometheus/
