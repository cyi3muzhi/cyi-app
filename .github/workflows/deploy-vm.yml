name: Deploy to Local VM

on:
  push:
    branches: [ main, test, develop ]
    paths:
      - 'app/**'
      - 'api/**'
      - 'web/admin/**'
      - 'deploy/docker-compose/**'
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
    inputs:
      service:
        description: '要部署的服务 (all / admin / user / frontend)'
        required: true
        default: 'all'

jobs:
  # ======================== 构建 ========================
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Go dependencies
        run: go mod tidy

      - name: Build services
        run: make build

      # - name: Run tests
      #   run: go test ./app/...

      - name: Build frontend
        run: |
          cd web/admin
          npm install
          npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            bin/
            web/admin/dist/

  # ======================== 构建 Docker 镜像 ========================
  docker-build:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build user service image
        run: |
          docker build -f deploy/build/Dockerfile \
            --build-arg APP_RELATIVE_PATH=service/user \
            --build-arg APP_NAME=user \
            -t cyi3muz/service-user:latest .

      - name: Build admin BFF image
        run: |
          docker build -f deploy/build/Dockerfile \
            --build-arg APP_RELATIVE_PATH=cin/admin \
            --build-arg APP_NAME=admin \
            -t cyi3muz/cin-admin:latest .

      - name: Save Docker images
        run: |
          docker save cyi3muz/service-user:latest cyi3muz/cin-admin:latest -o images.tar

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: images.tar

  # ======================== 部署到 VM ========================
  deploy:
    needs: [docker-build]
    runs-on: [self-hosted, linux, vm]  # 需要在 VM 上注册 Runner 并打上 vm 标签
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp/deploy

      - name: Load and restart services
        run: |
          cd /tmp/deploy

          # 加载镜像
          docker load -i images.tar

          # 进入部署目录
          cd ~/cyi-app/deploy/docker-compose

          # 重启 user 服务
          docker compose -f docker-compose.app.yml -p cyi-app up -d --no-deps service-user

          # 重启 admin 服务
          docker compose -f docker-compose.app.yml -p cyi-app up -d --no-deps service-admin

      - name: Deploy frontend
        run: |
          # 下载前端构建产物
          cd /tmp/deploy

          # 复制到 Nginx 目录
          sudo cp -r dist/* /var/www/admin/
          sudo chown -R www-data:www-data /var/www/admin/
          sudo nginx -s reload
