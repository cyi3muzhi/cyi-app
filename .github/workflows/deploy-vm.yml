name: Deploy to VM

# ====================================================================
# CI/CD 方案：云端构建 + Artifact 传输 + VM Self-hosted 部署
#
# 流程：
#   1. 云端 ubuntu-latest 构建 Docker 镜像 + 前端 dist → 打成 artifact 上传
#   2. VM self-hosted runner 下载 artifact → docker load → 重启服务
#
# 注意：Artifact 下载受网络影响，可能需要 5-10 分钟
# ====================================================================

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      service:
        description: '要部署的服务（auto=自动检测变更，其他=强制部署指定服务）'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - all
          - infra
          - blades
          - admin
          - interface
          - user
          - order
          - product
          - marketing
          - nats
          - job
          - task
          - frontend

concurrency:
  group: deploy-vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ======================== 检测变更 ========================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      blades: ${{ steps.detect.outputs.blades }}
      admin: ${{ steps.detect.outputs.admin }}
      interface: ${{ steps.detect.outputs.interface }}
      user: ${{ steps.detect.outputs.user }}
      order: ${{ steps.detect.outputs.order }}
      product: ${{ steps.detect.outputs.product }}
      marketing: ${{ steps.detect.outputs.marketing }}
      nats_consumer: ${{ steps.detect.outputs.nats_consumer }}
      job: ${{ steps.detect.outputs.job }}
      task: ${{ steps.detect.outputs.task }}
      frontend_admin: ${{ steps.detect.outputs.frontend_admin }}
      frontend_mall: ${{ steps.detect.outputs.frontend_mall }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      force_all: ${{ steps.detect.outputs.force_all }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: detect
        run: |
          SVC=""
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SVC="${{ github.event.inputs.service }}"
          fi
          echo "触发方式: ${{ github.event_name }}, 指定服务: '$SVC'"

          # auto 或空：走自动检测
          if [ -z "$SVC" ] || [ "$SVC" == "auto" ]; then
            SVC=""
          fi

          # 手动触发指定服务
          if [ -n "$SVC" ]; then
            echo "手动部署: $SVC"
            if [ "$SVC" == "all" ]; then
              echo "force_all=true" >> $GITHUB_OUTPUT
              for svc in blades admin interface user order product marketing nats_consumer job task frontend_admin frontend_mall; do
                echo "$svc=true" >> $GITHUB_OUTPUT
              done
              echo "has_changes=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            case "$SVC" in
              blades) echo "blades=true" >> $GITHUB_OUTPUT ;;
              admin) echo "admin=true" >> $GITHUB_OUTPUT ;;
              interface) echo "interface=true" >> $GITHUB_OUTPUT ;;
              user) echo "user=true" >> $GITHUB_OUTPUT ;;
              order) echo "order=true" >> $GITHUB_OUTPUT ;;
              product) echo "product=true" >> $GITHUB_OUTPUT ;;
              marketing) echo "marketing=true" >> $GITHUB_OUTPUT ;;
              nats) echo "nats_consumer=true" >> $GITHUB_OUTPUT ;;
              job) echo "job=true" >> $GITHUB_OUTPUT ;;
              task) echo "task=true" >> $GITHUB_OUTPUT ;;
              frontend)
                echo "frontend_admin=true" >> $GITHUB_OUTPUT
                echo "frontend_mall=true" >> $GITHUB_OUTPUT ;;
            esac
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 自动检测变更（push 触发）
          echo "自动检测模式：对比最近两次提交"
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          if [ -z "$CHANGED_FILES" ]; then
            echo "无法获取变更文件，强制全量部署"
            echo "force_all=true" >> $GITHUB_OUTPUT
            for svc in blades admin interface user order product marketing nats_consumer job task frontend_admin frontend_mall; do
              echo "$svc=true" >> $GITHUB_OUTPUT
            done
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "变更文件列表:"
          echo "$CHANGED_FILES"

          check_change() {
            local pattern="$1"
            local var_name="$2"
            if echo "$CHANGED_FILES" | grep -qE "$pattern"; then
              echo "$var_name=true" >> $GITHUB_OUTPUT
              echo "  ✅ $var_name 有变更"
            else
              echo "$var_name=false" >> $GITHUB_OUTPUT
            fi
          }

          check_change 'app/blades/|api/blades/'              blades
          check_change 'app/cin/admin/|api/cin/admin/'        admin
          check_change 'app/cin/interface/|api/cin/interface/' interface
          check_change 'app/service/user/|api/service/user/'  user
          check_change 'app/service/order/|api/service/order/' order
          check_change 'app/service/product/|api/service/product/' product
          check_change 'app/service/marketing/|api/service/marketing/' marketing
          check_change 'app/nats/'                              nats_consumer
          check_change 'app/job/|api/job/'                    job
          check_change 'app/task/|api/task/'                  task
          check_change 'web/admin/'                           frontend_admin
          check_change 'web/cyi-mall/'                        frontend_mall

          if echo "$CHANGED_FILES" | grep -qE 'app/|api/|pkg/|web/|deploy/|go\.mod|go\.sum'; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  # ======================== 云端构建（Docker 镜像 + 前端）========================
  build:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 安装依赖 ----------
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---------- 构建后端 Docker 镜像 ----------
      - name: Build and save blades
        if: needs.detect-changes.outputs.blades == 'true'
        run: |
          cd app/blades && make docker
          docker save cyi3muz/blades:0.1.0 | gzip > /tmp/blades.tar.gz
          echo "✅ blades 构建完成"

      - name: Build and save admin
        if: needs.detect-changes.outputs.admin == 'true'
        run: |
          cd app/cin/admin && make docker
          docker save cyi3muz/cin-admin:0.1.0 | gzip > /tmp/admin.tar.gz
          echo "✅ admin 构建完成"

      - name: Build and save interface
        if: needs.detect-changes.outputs.interface == 'true'
        run: |
          cd app/cin/interface && make docker
          docker save cyi3muz/cin-interface:0.1.0 | gzip > /tmp/interface.tar.gz
          echo "✅ interface 构建完成"

      - name: Build and save user
        if: needs.detect-changes.outputs.user == 'true'
        run: |
          cd app/service/user && make docker
          docker save cyi3muz/service-user:0.1.0 | gzip > /tmp/user.tar.gz
          echo "✅ user 构建完成"

      - name: Build and save order
        if: needs.detect-changes.outputs.order == 'true'
        run: |
          cd app/service/order && make docker
          docker save cyi3muz/service-order:0.1.0 | gzip > /tmp/order.tar.gz
          echo "✅ order 构建完成"

      - name: Build and save product
        if: needs.detect-changes.outputs.product == 'true'
        run: |
          cd app/service/product && make docker
          docker save cyi3muz/service-product:0.1.0 | gzip > /tmp/product.tar.gz
          echo "✅ product 构建完成"

      - name: Build and save marketing
        if: needs.detect-changes.outputs.marketing == 'true'
        run: |
          cd app/service/marketing && make docker
          docker save cyi3muz/service-marketing:0.1.0 | gzip > /tmp/marketing.tar.gz
          echo "✅ marketing 构建完成"

      - name: Build and save nats-consumer
        if: needs.detect-changes.outputs.nats_consumer == 'true'
        run: |
          cd app/nats && DOCKER_IMAGE_NAME=nats-consumer make docker
          docker save cyi3muz/nats-consumer:0.1.0 | gzip > /tmp/nats-consumer.tar.gz
          echo "✅ nats-consumer 构建完成"

      - name: Build and save job
        if: needs.detect-changes.outputs.job == 'true'
        run: |
          cd app/job && make docker
          docker save cyi3muz/job:0.1.0 | gzip > /tmp/job.tar.gz
          echo "✅ job 构建完成"

      - name: Build and save task
        if: needs.detect-changes.outputs.task == 'true'
        run: |
          cd app/task && make docker
          docker save cyi3muz/task:0.1.0 | gzip > /tmp/task.tar.gz
          echo "✅ task 构建完成"

      # ---------- 验证所有镜像 ----------
      - name: Verify Docker images
        run: |
          echo "===== 已构建的 Docker 镜像 ====="
          docker images | grep cyi3muz || echo "无 cyi3muz 镜像"
          echo ""
          echo "===== 验证需要的镜像 ====="
          for img in cyi3muz/blades:0.1.0 cyi3muz/cin-admin:0.1.0 \
                     cyi3muz/cin-interface:0.1.0 cyi3muz/service-user:0.1.0 \
                     cyi3muz/service-order:0.1.0 cyi3muz/service-product:0.1.0 \
                     cyi3muz/service-marketing:0.1.0 cyi3muz/nats-consumer:0.1.0 \
                     cyi3muz/job:0.1.0 cyi3muz/task:0.1.0; do
            if docker image inspect "$img" > /dev/null 2>&1; then
              echo "✅ $img"
            else
              echo "❌ $img 不存在！"
            fi
          done

      # ---------- 构建前端 ----------
      - name: Build admin frontend
        if: needs.detect-changes.outputs.frontend_admin == 'true'
        run: |
          cd web/admin
          npm ci
          npm run build
          # 确保 dist 目录不为空
          if [ ! -d dist ] || [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "❌ admin dist 目录为空，构建可能失败"
            exit 1
          fi
          tar czf /tmp/frontend-admin.tar.gz -C dist .
          # 验证生成的文件有效
          gzip -t /tmp/frontend-admin.tar.gz
          SIZE=$(stat -c%s /tmp/frontend-admin.tar.gz 2>/dev/null || stat -f%z /tmp/frontend-admin.tar.gz 2>/dev/null)
          echo "✅ admin 前端构建完成 (大小: ${SIZE} bytes)"

      - name: Build mall frontend
        if: needs.detect-changes.outputs.frontend_mall == 'true'
        run: |
          cd web/cyi-mall
          npm ci
          npm run build
          # 确保 dist 目录不为空
          if [ ! -d dist ] || [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "❌ mall dist 目录为空，构建可能失败"
            exit 1
          fi
          tar czf /tmp/frontend-mall.tar.gz -C dist .
          # 验证生成的文件有效
          gzip -t /tmp/frontend-mall.tar.gz
          SIZE=$(stat -c%s /tmp/frontend-mall.tar.gz 2>/dev/null || stat -f%z /tmp/frontend-mall.tar.gz 2>/dev/null)
          echo "✅ mall 前端构建完成 (大小: ${SIZE} bytes)"

      # ---------- 合并所有产物 ----------
      - name: Package all artifacts
        run: |
          mkdir -p /tmp/deploy-artifacts
          found=0
          for f in /tmp/*.tar.gz; do
            if [ -f "$f" ]; then
              cp "$f" /tmp/deploy-artifacts/
              found=1
            fi
          done
          # 如果没有任何 tar.gz（比如只改了 nginx 配置，没有构建任何服务）
          # 放一个占位文件，保证 artifact 至少有一个文件（否则 upload-artifact@v4 会报错：artifact not found）
          if [ "$found" -eq 0 ]; then
            echo "⚠️  没有检测到需要构建的服务，只修改了配置文件"
            echo "placeholder" > /tmp/deploy-artifacts/.placeholder
            echo "deploy_mode=config-only" > /tmp/deploy-artifacts/.deploy_mode
          fi
          echo "产物清单:"
          ls -lh /tmp/deploy-artifacts/
          echo ""
          du -sh /tmp/deploy-artifacts/

      # ---------- 上传 artifact ----------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifacts
          path: /tmp/deploy-artifacts/
          retention-days: 1
          compression-level: 6

  # ======================== VM 部署（self-hosted runner）========================
  deploy:
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: [self-hosted, linux, vm]
    steps:
      # ---------- 下载 artifact ----------
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: deploy-artifacts
          path: /tmp/deploy-artifacts

      - name: Show downloaded artifacts
        run: |
          echo "下载的产物:"
          ls -lh /tmp/deploy-artifacts/
          du -sh /tmp/deploy-artifacts/

      # ---------- 检查/初始化部署目录（配置已在虚拟机上，artifact 不传配置）----------
      - name: Ensure deploy directories
        run: |
          DEPLOY_DIR="$HOME/cyi-app/deploy"
          mkdir -p "$DEPLOY_DIR/docker-compose" "$DEPLOY_DIR/nginx"
          
          # 如果 .env 不存在，创建默认配置
          if [ ! -f "$DEPLOY_DIR/docker-compose/.env" ]; then
            echo "创建默认 .env..."
            printf 'INTERFACE_HTTP_PORT=8010\nINTERFACE_GRPC_PORT=9010\nTASK_PORT=10100\nJOB_PORT=10200\nUSER_GRPC_PORT=9100\nORDER_GRPC_PORT=9101\nPRODUCT_GRPC_PORT=9102\nMARKETING_GRPC_PORT=9103\nBLADES_HTTP_PORT=30800\nBLADES_GRPC_PORT=30900\nADMIN_HTTP_PORT=8080\nADMIN_GRPC_PORT=9091\nNGINX_HTTP_PORT=80\nCONSUL_PORT=8500\nREDIS_PORT=6379\nMYSQL_PORT=3306\nJAEGER_UI_PORT=16686\nJAEGER_HTTP_PORT=14268\nJAEGER_GRPC_PORT=14250\nJAEGER_THRIFT_BINARY_PORT=6831\nJAEGER_THRIFT_COMPACT_PORT=6832\nJAEGER_OTLP_GRPC_PORT=4318\nJAEGER_OTLP_HTTP_PORT=4317\nRUSTFS_WEB_PORT=9000\nRUSTFS_API_PORT=9001\nELASTICSEARCH_PORT=9200\nELASTICSEARCH_TRANSPORT_PORT=9300\nLOGSTASH_BEATS_PORT=5044\nLOGSTASH_API_PORT=9600\nKIBANA_PORT=5601\nPROMETHEUS_PORT=9090\nGRAFANA_PORT=3000\nNATS_PORT=4222\nNATS_HTTP_PORT=8222\n' > "$DEPLOY_DIR/docker-compose/.env"
          fi
          
          echo "部署目录就绪: $DEPLOY_DIR"
          ls -la "$DEPLOY_DIR/docker-compose/"

      # ---------- 加载 Docker 镜像 ----------
      - name: Load Docker images
        run: |
          for img in /tmp/deploy-artifacts/blades.tar.gz /tmp/deploy-artifacts/admin.tar.gz \
                     /tmp/deploy-artifacts/interface.tar.gz /tmp/deploy-artifacts/user.tar.gz \
                     /tmp/deploy-artifacts/order.tar.gz /tmp/deploy-artifacts/product.tar.gz \
                     /tmp/deploy-artifacts/marketing.tar.gz /tmp/deploy-artifacts/nats-consumer.tar.gz \
                     /tmp/deploy-artifacts/job.tar.gz /tmp/deploy-artifacts/task.tar.gz; do
            if [ -f "$img" ] && [ -s "$img" ] && gzip -t "$img" 2>/dev/null; then
              echo "加载 $(basename $img .tar.gz) ..."
              gunzip -c "$img" | docker load
            else
              echo "跳过 $(basename $img)（不存在/为空/无效）"
            fi
          done
          echo "✅ 镜像加载完成"

      # ---------- 部署前端 ----------
      - name: Deploy frontend admin
        if: needs.detect-changes.outputs.frontend_admin == 'true'
        run: |
          SRC="/tmp/deploy-artifacts/frontend-admin.tar.gz"
          DEST="$HOME/cyi-app/web/admin/dist"
          if [ -f "$SRC" ] && [ -s "$SRC" ] && gzip -t "$SRC" 2>/dev/null; then
            rm -rf "$DEST"
            mkdir -p "$DEST"
            tar -xzf "$SRC" -C "$DEST"
            echo "✅ admin 前端已部署到 $DEST"
            ls -la "$DEST" | head -10
          else
            echo "⚠️ frontend-admin.tar.gz 无效或不存在，跳过"
          fi

      - name: Deploy frontend mall
        if: needs.detect-changes.outputs.frontend_mall == 'true'
        run: |
          SRC="/tmp/deploy-artifacts/frontend-mall.tar.gz"
          DEST="$HOME/cyi-app/web/cyi-mall/dist"
          if [ -f "$SRC" ] && [ -s "$SRC" ] && gzip -t "$SRC" 2>/dev/null; then
            rm -rf "$DEST"
            mkdir -p "$DEST"
            tar -xzf "$SRC" -C "$DEST"
            echo "✅ mall 前端已部署到 $DEST"
            ls -la "$DEST" | head -10
          else
            echo "⚠️ frontend-mall.tar.gz 无效或不存在，跳过"
          fi

      # ---------- 启动基础设施 ----------
      - name: Ensure infrastructure
        run: |
          cd "$HOME/cyi-app/deploy/docker-compose"
          docker compose -f docker-compose.infra.yml --env-file .env up -d
          echo "✅ 基础设施已就绪"

      # ---------- 重启变更服务 ----------
      - name: Restart changed services
        run: |
          cd "$HOME/cyi-app/deploy/docker-compose"
          RESTARTED=""

          restart_svc() {
            local name="$1"
            echo "重启 $name ..."
            docker compose -f docker-compose.app.yml --env-file .env up -d --no-deps "service-$name"
            RESTARTED="$RESTARTED service-$name"
          }

          [ "${{ needs.detect-changes.outputs.blades }}" == "true" ]        && restart_svc blades
          [ "${{ needs.detect-changes.outputs.admin }}" == "true" ]         && restart_svc admin
          [ "${{ needs.detect-changes.outputs.interface }}" == "true" ]     && restart_svc interface
          [ "${{ needs.detect-changes.outputs.user }}" == "true" ]          && restart_svc user
          [ "${{ needs.detect-changes.outputs.order }}" == "true" ]         && restart_svc order
          [ "${{ needs.detect-changes.outputs.product }}" == "true" ]       && restart_svc product
          [ "${{ needs.detect-changes.outputs.marketing }}" == "true" ]     && restart_svc marketing
          [ "${{ needs.detect-changes.outputs.nats_consumer }}" == "true" ] && {
            docker compose -f docker-compose.app.yml --env-file .env up -d --no-deps service-nats-consumer
            RESTARTED="$RESTARTED service-nats-consumer"
          }
          [ "${{ needs.detect-changes.outputs.job }}" == "true" ]           && restart_svc job
          [ "${{ needs.detect-changes.outputs.task }}" == "true" ]          && restart_svc task

          # 前端或任何后端服务变更 → 确保 nginx 运行
          if [ -n "$RESTARTED" ] || \
             [ "${{ needs.detect-changes.outputs.frontend_admin }}" == "true" ] || \
             [ "${{ needs.detect-changes.outputs.frontend_mall }}" == "true" ]; then
            docker compose -f docker-compose.app.yml --env-file .env up -d --no-deps nginx
            RESTARTED="$RESTARTED nginx"
          fi

          echo "✅ 已重启服务:$RESTARTED"

      # ---------- 验证 ----------
      - name: Verify deployment
        if: always()
        run: |
          cd "$HOME/cyi-app/deploy/docker-compose"
          echo "--- 基础设施 ---"
          docker compose -f docker-compose.infra.yml --env-file .env ps
          echo ""
          echo "--- 应用服务 ---"
          docker compose -f docker-compose.app.yml --env-file .env ps
