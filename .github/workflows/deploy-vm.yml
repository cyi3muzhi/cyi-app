name: Deploy to VM

# ====================================================================
# CI/CD 方案：检测变更 + Self-hosted Runner 本机构建/部署
#
# 流程：
#   1. 云端检测哪些服务代码变了（很轻量，几秒完成）
#   2. 在你的虚拟机(self-hosted runner)上：
#      - 直接构建变更的 Docker 镜像（不需要传文件，本机直接做）
#      - 直接构建前端 dist 到本地项目目录
#      - 同步部署配置文件
#      - 启动基础设施 + 重启变更服务
#
# 优势：完全没有 GitHub→VM 的跨网络 artifact 传输（之前下载 10 分钟→0秒）
#
# 前置条件：
#   1. 虚拟机能访问 GitHub
#   2. 虚拟机已安装：Docker、Go 1.25、Node.js 20
#   3. 虚拟机上已注册 Self-hosted Runner（标签 [self-hosted, linux, vm]）
#   4. 项目代码在 $HOME/cyi-app 下（consul 配置、docker compose 等在那）
# ====================================================================

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      service:
        description: '要部署的服务（auto=自动检测变更，其他=强制部署指定服务）'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - all
          - infra
          - blades
          - admin
          - interface
          - user
          - order
          - product
          - marketing
          - nats
          - job
          - task
          - frontend

concurrency:
  group: deploy-vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ======================== 检测变更的服务（轻量，云端跑）========================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      blades: ${{ steps.detect.outputs.blades }}
      admin: ${{ steps.detect.outputs.admin }}
      interface: ${{ steps.detect.outputs.interface }}
      user: ${{ steps.detect.outputs.user }}
      order: ${{ steps.detect.outputs.order }}
      product: ${{ steps.detect.outputs.product }}
      marketing: ${{ steps.detect.outputs.marketing }}
      nats_consumer: ${{ steps.detect.outputs.nats_consumer }}
      job: ${{ steps.detect.outputs.job }}
      task: ${{ steps.detect.outputs.task }}
      frontend_admin: ${{ steps.detect.outputs.frontend_admin }}
      frontend_mall: ${{ steps.detect.outputs.frontend_mall }}
      infra: ${{ steps.detect.outputs.infra }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      force_all: ${{ steps.detect.outputs.force_all }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: detect
        run: |
          SVC=""
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SVC="${{ github.event.inputs.service }}"
          fi
          echo "触发方式: ${{ github.event_name }}, 指定服务: '$SVC'"

          # auto 或空：走自动检测；其他：强制部署指定服务
          if [ -z "$SVC" ] || [ "$SVC" == "auto" ]; then
            SVC=""
          fi

          # 手动触发指定服务
          if [ -n "$SVC" ]; then
            echo "手动部署: $SVC"
            if [ "$SVC" == "all" ]; then
              echo "force_all=true" >> $GITHUB_OUTPUT
              echo "blades=true" >> $GITHUB_OUTPUT
              echo "admin=true" >> $GITHUB_OUTPUT
              echo "interface=true" >> $GITHUB_OUTPUT
              echo "user=true" >> $GITHUB_OUTPUT
              echo "order=true" >> $GITHUB_OUTPUT
              echo "product=true" >> $GITHUB_OUTPUT
              echo "marketing=true" >> $GITHUB_OUTPUT
              echo "nats_consumer=true" >> $GITHUB_OUTPUT
              echo "job=true" >> $GITHUB_OUTPUT
              echo "task=true" >> $GITHUB_OUTPUT
              echo "frontend_admin=true" >> $GITHUB_OUTPUT
              echo "frontend_mall=true" >> $GITHUB_OUTPUT
              echo "infra=true" >> $GITHUB_OUTPUT
            else
              case "$SVC" in
                infra)         echo "infra=true" >> $GITHUB_OUTPUT ;;
                blades)        echo "blades=true" >> $GITHUB_OUTPUT ;;
                admin)         echo "admin=true" >> $GITHUB_OUTPUT ;;
                interface)     echo "interface=true" >> $GITHUB_OUTPUT ;;
                user)          echo "user=true" >> $GITHUB_OUTPUT ;;
                order)         echo "order=true" >> $GITHUB_OUTPUT ;;
                product)       echo "product=true" >> $GITHUB_OUTPUT ;;
                marketing)     echo "marketing=true" >> $GITHUB_OUTPUT ;;
                nats)          echo "nats_consumer=true" >> $GITHUB_OUTPUT ;;
                job)           echo "job=true" >> $GITHUB_OUTPUT ;;
                task)          echo "task=true" >> $GITHUB_OUTPUT ;;
                frontend)      echo "frontend_admin=true" >> $GITHUB_OUTPUT
                               echo "frontend_mall=true" >> $GITHUB_OUTPUT ;;
              esac
            fi
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 自动检测变更（push 触发）
          echo "自动检测模式：对比最近两次提交"
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          if [ -z "$CHANGED_FILES" ]; then
            echo "无法获取变更文件（可能是首次提交），强制全量部署"
            echo "force_all=true" >> $GITHUB_OUTPUT
            echo "blades=true" >> $GITHUB_OUTPUT
            echo "admin=true" >> $GITHUB_OUTPUT
            echo "interface=true" >> $GITHUB_OUTPUT
            echo "user=true" >> $GITHUB_OUTPUT
            echo "order=true" >> $GITHUB_OUTPUT
            echo "product=true" >> $GITHUB_OUTPUT
            echo "marketing=true" >> $GITHUB_OUTPUT
            echo "nats_consumer=true" >> $GITHUB_OUTPUT
            echo "job=true" >> $GITHUB_OUTPUT
            echo "task=true" >> $GITHUB_OUTPUT
            echo "frontend_admin=true" >> $GITHUB_OUTPUT
            echo "frontend_mall=true" >> $GITHUB_OUTPUT
            echo "infra=true" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "变更文件列表:"
          echo "$CHANGED_FILES"

          check_change() {
            local pattern="$1"
            local var_name="$2"
            if echo "$CHANGED_FILES" | grep -qE "$pattern"; then
              echo "$var_name=true" >> $GITHUB_OUTPUT
              echo "  ✅ $var_name 有变更"
            else
              echo "$var_name=false" >> $GITHUB_OUTPUT
            fi
          }

          check_change 'app/blades/|api/blades/'              blades
          check_change 'app/cin/admin/|api/cin/admin/'        admin
          check_change 'app/cin/interface/|api/cin/interface/' interface
          check_change 'app/service/user/|api/service/user/'  user
          check_change 'app/service/order/|api/service/order/' order
          check_change 'app/service/product/|api/service/product/' product
          check_change 'app/service/marketing/|api/service/marketing/' marketing
          check_change 'app/nats/'                              nats_consumer
          check_change 'app/job/|api/job/'                    job
          check_change 'app/task/|api/task/'                  task
          check_change 'web/admin/'                           frontend_admin
          check_change 'web/cyi-mall/'                        frontend_mall

          if echo "$CHANGED_FILES" | grep -qE 'app/|api/|pkg/|web/|deploy/|go\.mod|go\.sum'; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  # ======================== 构建 + 部署（全部在虚拟机上本机执行）========================
  deploy:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: [self-hosted, linux, vm]
    steps:
      # ---------- 设置环境变量 ----------
      - name: Set up environment
        run: |
          PROJECT_DIR="$HOME/cyi-app"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "部署目录: $PROJECT_DIR"
          df -h /

      # ---------- 清理磁盘（防止磁盘满导致 Runner 崩溃）----------
      - name: Clean disk space
        run: |
          echo "清理 Docker 无用资源..."
          docker system prune -f 2>/dev/null || true
          docker builder prune -f 2>/dev/null || true
          echo "清理 Go 缓存..."
          go clean -cache 2>/dev/null || true
          echo "✅ 清理完成"

      - uses: actions/checkout@v4

      # ---------- 部署信息 ----------
      - name: Show deployment info
        run: |
          echo "=========================================="
          echo "  开始部署（在虚拟机本机构建+部署）"
          echo "  分支: ${{ github.ref_name }}"
          echo "  提交: ${{ github.sha }}"
          echo "  工作区: $(pwd)"
          echo "  部署目录: $PROJECT_DIR"
          echo "=========================================="

      # ---------- 准备目录 ----------
      - name: Prepare directories
        run: |
          # 清理可能冲突的旧文件（防止文件/目录冲突）
          rm -f "$PROJECT_DIR/deploy/docker-compose/prometheus" 2>/dev/null || true
          # 创建必要目录
          mkdir -p "$PROJECT_DIR/deploy/docker-compose/prometheus"
          mkdir -p "$PROJECT_DIR/deploy/docker-compose/logstash"
          mkdir -p "$PROJECT_DIR/deploy/nginx"
          mkdir -p "$PROJECT_DIR/web/admin/dist"
          mkdir -p "$PROJECT_DIR/web/cyi-mall/dist"
          mkdir -p "$PROJECT_DIR/logs"

      # ---------- 同步部署配置（从 runner workspace 复制到部署目录）----------
      - name: Sync deploy configs
        run: |
          SRC="$GITHUB_WORKSPACE/deploy"
          DST="$PROJECT_DIR/deploy"
          echo "从 $SRC 同步部署配置到 $DST"

          # docker-compose 主文件
          cp -f "$SRC/docker-compose/docker-compose.infra.yml" "$DST/docker-compose/"
          cp -f "$SRC/docker-compose/docker-compose.app.yml" "$DST/docker-compose/"
          cp -f "$SRC/docker-compose/docker-compose.yml" "$DST/docker-compose/" 2>/dev/null || true
          cp -f "$SRC/docker-compose/filebeat.yml" "$DST/docker-compose/" 2>/dev/null || true

          # .env
          if [ -f "$SRC/docker-compose/.env" ]; then
            cp -f "$SRC/docker-compose/.env" "$DST/docker-compose/"
          else
            echo "创建默认 .env"
            printf 'INTERFACE_HTTP_PORT=8010\nINTERFACE_GRPC_PORT=9010\nTASK_PORT=10100\nJOB_PORT=10200\nUSER_GRPC_PORT=9100\nORDER_GRPC_PORT=9101\nPRODUCT_GRPC_PORT=9102\nMARKETING_GRPC_PORT=9103\nBLADES_HTTP_PORT=30800\nBLADES_GRPC_PORT=30900\nADMIN_HTTP_PORT=8080\nADMIN_GRPC_PORT=9090\nNGINX_HTTP_PORT=80\nCONSUL_PORT=8500\nREDIS_PORT=6379\nMYSQL_PORT=3306\nJAEGER_UI_PORT=16686\nJAEGER_HTTP_PORT=14268\nJAEGER_GRPC_PORT=14250\nJAEGER_THRIFT_BINARY_PORT=6831\nJAEGER_THRIFT_COMPACT_PORT=6832\nJAEGER_OTLP_GRPC_PORT=4318\nJAEGER_OTLP_HTTP_PORT=4317\nRUSTFS_WEB_PORT=9000\nRUSTFS_API_PORT=9001\nELASTICSEARCH_PORT=9200\nELASTICSEARCH_TRANSPORT_PORT=9300\nLOGSTASH_BEATS_PORT=5044\nLOGSTASH_API_PORT=9600\nKIBANA_PORT=5601\nPROMETHEUS_PORT=9090\nGRAFANA_PORT=3000\nRABBITMQ_PORT=5672\nRABBITMQ_MANAGEMENT_PORT=15672\nRABBITMQ_USER=admin\nRABBITMQ_PASSWORD=admin\nRABBITMQ_VHOST=/\nNATS_PORT=4222\nNATS_HTTP_PORT=8222\nNATS_EXPORTER_PORT=7777\nNATS_NUI_PORT=9092\n' > "$DST/docker-compose/.env"
          fi

          # nginx 配置
          if [ -f "$SRC/nginx/cyi-app.conf" ]; then
            cp -f "$SRC/nginx/cyi-app.conf" "$DST/nginx/"
            echo "✅ nginx 配置已同步"
          fi

          # prometheus 子目录
          if [ -d "$SRC/docker-compose/prometheus" ]; then
            rm -rf "$DST/docker-compose/prometheus"
            mkdir -p "$DST/docker-compose/prometheus"
            cp -r "$SRC/docker-compose/prometheus/"* "$DST/docker-compose/prometheus/"
            echo "✅ prometheus 配置已同步"
          fi

          # logstash 子目录
          if [ -d "$SRC/docker-compose/logstash" ]; then
            rm -rf "$DST/docker-compose/logstash"
            mkdir -p "$DST/docker-compose/logstash"
            cp -r "$SRC/docker-compose/logstash/"* "$DST/docker-compose/logstash/"
            echo "✅ logstash 配置已同步"
          fi

          echo "✅ 配置文件已同步"
          ls -la "$DST/docker-compose/"

      # ---------- 构建后端 Docker 镜像（本机直接构建，不需要 save/load）----------
      - name: Build blades image
        if: needs.detect-changes.outputs.blades == 'true'
        run: |
          cd app/blades && make docker
          echo "✅ blades 镜像构建完成"

      - name: Build admin image
        if: needs.detect-changes.outputs.admin == 'true'
        run: |
          cd app/cin/admin && make docker
          echo "✅ admin 镜像构建完成"

      - name: Build interface image
        if: needs.detect-changes.outputs.interface == 'true'
        run: |
          cd app/cin/interface && make docker
          echo "✅ interface 镜像构建完成"

      - name: Build user image
        if: needs.detect-changes.outputs.user == 'true'
        run: |
          cd app/service/user && make docker
          echo "✅ user 镜像构建完成"

      - name: Build job image
        if: needs.detect-changes.outputs.job == 'true'
        run: |
          cd app/job && make docker
          echo "✅ job 镜像构建完成"

      - name: Build task image
        if: needs.detect-changes.outputs.task == 'true'
        run: |
          cd app/task && make docker
          echo "✅ task 镜像构建完成"

      - name: Build order image
        if: needs.detect-changes.outputs.order == 'true'
        run: |
          cd app/service/order && make docker
          echo "✅ order 镜像构建完成"

      - name: Build product image
        if: needs.detect-changes.outputs.product == 'true'
        run: |
          cd app/service/product && make docker
          echo "✅ product 镜像构建完成"

      - name: Build marketing image
        if: needs.detect-changes.outputs.marketing == 'true'
        run: |
          cd app/service/marketing && make docker
          echo "✅ marketing 镜像构建完成"

      - name: Build nats-consumer image
        if: needs.detect-changes.outputs.nats_consumer == 'true'
        run: |
          cd app/nats && DOCKER_IMAGE_NAME=nats-consumer make docker
          echo "✅ nats-consumer 镜像构建完成"

      # ---------- 构建前端（直接在工作区 build，然后 dist 复制到部署目录）----------
      - name: Build admin frontend
        if: needs.detect-changes.outputs.frontend_admin == 'true'
        run: |
          cd web/admin
          echo "清理旧构建产物..."
          rm -rf dist tsconfig.tsbuildinfo
          echo "安装依赖..."
          npm ci
          echo "开始构建..."
          npm run build
          echo "同步 dist 到部署目录..."
          rm -rf "$PROJECT_DIR/web/admin/dist"
          cp -r dist "$PROJECT_DIR/web/admin/"
          echo "✅ 管理后台前端构建+部署完成"

      - name: Build mall frontend
        if: needs.detect-changes.outputs.frontend_mall == 'true'
        run: |
          cd web/cyi-mall
          echo "清理旧构建产物..."
          rm -rf dist tsconfig.tsbuildinfo
          echo "安装依赖..."
          npm ci
          echo "开始构建..."
          npm run build
          echo "同步 dist 到部署目录..."
          rm -rf "$PROJECT_DIR/web/cyi-mall/dist"
          cp -r dist "$PROJECT_DIR/web/cyi-mall/"
          echo "✅ 用户端商城前端构建+部署完成"

      # ---------- 确保基础设施先启动（创建共享网络）----------
      - name: Ensure infrastructure running
        run: |
          cd "$PROJECT_DIR/deploy/docker-compose"
          # 清理可能存在的旧网络（无正确标签导致compose不识别）
          docker network rm cyi-network 2>/dev/null || true
          echo "确保基础设施正在运行..."
          docker compose -f docker-compose.infra.yml --env-file .env up -d
          echo "✅ 基础设施已就绪"

      # ---------- 重启应用服务 ----------
      - name: Restart changed services
        run: |
          cd "$PROJECT_DIR/deploy/docker-compose"
          RESTARTED=""

          restart_svc() {
            local name="$1"
            echo "启动/重启 $name ..."
            docker compose -f docker-compose.app.yml --env-file .env up -d --no-deps "service-$name"
            RESTARTED="$RESTARTED service-$name"
          }

          if [ "${{ needs.detect-changes.outputs.blades }}" == "true" ];        then restart_svc blades; fi
          if [ "${{ needs.detect-changes.outputs.admin }}" == "true" ];         then restart_svc admin; fi
          if [ "${{ needs.detect-changes.outputs.interface }}" == "true" ];     then restart_svc interface; fi
          if [ "${{ needs.detect-changes.outputs.user }}" == "true" ];          then restart_svc user; fi
          if [ "${{ needs.detect-changes.outputs.job }}" == "true" ];           then restart_svc job; fi
          if [ "${{ needs.detect-changes.outputs.task }}" == "true" ];          then restart_svc task; fi
          if [ "${{ needs.detect-changes.outputs.order }}" == "true" ];         then restart_svc order; fi
          if [ "${{ needs.detect-changes.outputs.product }}" == "true" ];       then restart_svc product; fi
          if [ "${{ needs.detect-changes.outputs.marketing }}" == "true" ];     then restart_svc marketing; fi
          if [ "${{ needs.detect-changes.outputs.nats_consumer }}" == "true" ]; then
            echo "启动/重启 service-nats-consumer ..."
            docker compose -f docker-compose.app.yml --env-file .env up -d --no-deps service-nats-consumer
            RESTARTED="$RESTARTED service-nats-consumer"
          fi

          # Nginx：前端变了 restart；任何后端服务变了确保 nginx 在运行
          if [ "${{ needs.detect-changes.outputs.frontend_admin }}" == "true" ] || [ "${{ needs.detect-changes.outputs.frontend_mall }}" == "true" ]; then
            docker compose -f docker-compose.app.yml --env-file .env restart nginx 2>/dev/null || \
            docker compose -f docker-compose.app.yml --env-file .env up -d --no-deps nginx
            RESTARTED="$RESTARTED nginx"
          elif [ "${{ needs.detect-changes.outputs.force_all }}" == "true" ] ||
               [ "${{ needs.detect-changes.outputs.blades }}" == "true" ] ||
               [ "${{ needs.detect-changes.outputs.admin }}" == "true" ] ||
               [ "${{ needs.detect-changes.outputs.interface }}" == "true" ] ||
               [ "${{ needs.detect-changes.outputs.user }}" == "true" ] ||
               [ "${{ needs.detect-changes.outputs.order }}" == "true" ] ||
               [ "${{ needs.detect-changes.outputs.product }}" == "true" ] ||
               [ "${{ needs.detect-changes.outputs.marketing }}" == "true" ] ||
               [ "${{ needs.detect-changes.outputs.nats_consumer }}" == "true" ] ||
               [ "${{ needs.detect-changes.outputs.job }}" == "true" ] ||
               [ "${{ needs.detect-changes.outputs.task }}" == "true" ]; then
            docker compose -f docker-compose.app.yml --env-file .env up -d --no-deps nginx 2>/dev/null || true
            RESTARTED="$RESTARTED nginx"
          fi

          if [ -z "$RESTARTED" ]; then
            echo "⚠️ 没有需要重启的服务"
          else
            echo "✅ 已重启服务:$RESTARTED"
          fi

      # ---------- 验证：显示服务状态 ----------
      - name: Verify deployment status
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "  最终服务状态"
          echo "=========================================="
          cd "$PROJECT_DIR/deploy/docker-compose"
          echo "--- 基础设施 ---"
          docker compose -f docker-compose.infra.yml --env-file .env ps
          echo ""
          echo "--- 应用服务 ---"
          docker compose -f docker-compose.app.yml --env-file .env ps
          echo "=========================================="
