version: '3.8'

volumes:
  # Elasticsearch 数据卷
  es_data:
    driver: local
  # Logstash 配置卷
  logstash_config:
    driver: local
  # Kibana 配置卷
  kibana_config:
    driver: local

services:
  # Elasticsearch 服务
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: cyi-app-elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=cyi-app-cluster
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - ELASTIC_PASSWORD=changeme
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: curl -s http://localhost:9200/_cluster/health | grep -v 'status":"red"'
      interval: 30s
      timeout: 10s
      retries: 5

  # Logstash 服务
  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.10
    container_name: cyi-app-logstash
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - logstash_config:/usr/share/logstash/config
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    ports:
      - "5044:5044"  # Filebeat 输入端口
      - "9600:9600"  # Logstash API 端口
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m

  # Kibana 服务
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.10
    container_name: cyi-app-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - kibana_config:/usr/share/kibana/config
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=changeme
