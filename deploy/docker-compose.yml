volumes:
  # Consul数据卷
  consul-data:
    driver: local
  consul-config:
    driver: local
  # Redis数据卷
  redis_data:
    driver: local
  # MySQL数据卷
  mysql_data:
    driver: local
  # RustFS数据卷
  rustfs_data:
    driver: local
# 日志目录
  rustfs_logs:
    driver: local

services:
  # Consul服务 - 用于服务发现和配置管理
  consul:
    image: hashicorp/consul:1.22
    container_name: cin_consul
    restart: always
    volumes:
      - consul-data:/consul/data
      - consul-config:/consul/config
    ports:
      - "8500:8500"  # HTTP API端口
      - "8600:8600/udp"  # DNS端口
      - "8300:8300"  # 服务器RPC端口
    environment:
      - CONSUL_UI=true  # 启用Web UI
    command: >
      consul agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -bind=0.0.0.0
      -data-dir=/consul/data -config-dir=/consul/config
    networks:
      - cyi-network

  # Redis服务 - 用于缓存
  redis:
    image: redis:7.0.12
    container_name: cin_redis
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=redis0411  # 设置Redis密码
      - REDIS_MAXMEMORY=1gb  # 设置最大内存使用
      - REDIS_MAXMEMORY_POLICY=allkeys-lru  # 内存不足时的淘汰策略
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD:-redis0411}
      - --maxmemory ${REDIS_MAXMEMORY:-1gb}
      - --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      - --appendonly yes  # 启用AOF持久化
    networks:
      - cyi-network

  # MySQL服务 - 用于数据库存储
  mysql:
    image: mysql:8.0
    container_name: cin_mysql
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
      # 可选：挂载初始化脚本目录
      # - ./mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=mysql0411  # 设置root密码
      - MYSQL_DATABASE=cin_test  # 创建默认数据库
      # - MYSQL_USER=app_user  # 创建普通用户
      # - MYSQL_PASSWORD=app_password  # 设置普通用户密码
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - cyi-network

  # Jaeger服务 - 用于分布式追踪
  jaeger:
    image: jaegertracing/all-in-one:1.49
    container_name: cin_jaeger
    restart: always
    ports:
      - "16686:16686"  # Jaeger UI端口
      - "14268:14268"  # Jaeger收集器端口（HTTP）
      - "14250:14250"  # Jaeger收集器端口（gRPC）
      - "6831:6831/udp"  # Jaeger Thrift 二进制端口
      - "6832:6832/udp"  # Jaeger Thrift 压缩端口
      - "4318:4318"  # OTLP gRPC端口
      - "4317:4317"  # OTLP HTTP端口
    environment:
      - COLLECTOR_OTLP_ENABLED=true  # 启用OTLP收集器
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411  # 启用Zipkin收集器
    command:
      - --log-level=info
    networks:
      - cyi-network

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    ports:
      - "9000:9000"  # Web控制台端口
      - "9001:9001"  # API端口
    volumes:
      - rustfs_data:/data  # 数据存储目录
      - rustfs_logs:/logs  # 日志目录
    environment:
      - RUSTFS_ROOT_USER=rustfsadmin  # 管理员用户名
      - RUSTFS_ROOT_PASSWORD=rustfsadmin  # 管理员密码
      - RUSTFS_REGION=us-east-1  # 区域设置
    restart: always
    networks:
      - cyi-network

  # Interface 服务 - 业务微服务
  interface-server:
    build:
      context: ..  # 项目根目录作为构建上下文
      dockerfile: app/cin/interface/Dockerfile
    container_name: cin_interface
    restart: always
    ports:
      - "8003:8003"  # HTTP 端口
      - "9003:9003"  # gRPC 端口
    environment:
      - CONSUL_ADDR=consul:8500  # 通过服务名访问 Consul
      - CONSUL_PATH=/cyi-app/cin/interface
      - SERVICE_ENV=dev
    depends_on:
      - consul
      - redis
      - jaeger
      - user-server
    networks:
      - cyi-network

  # task 任务服务
  task-server:
    build:
      context: ..  # 项目根目录作为构建上下文
      dockerfile: app/task/Dockerfile
    container_name: task_server
    restart: always
    ports:
      - "9400:9400"  # gRPC 端口
    environment:
      - CONSUL_ADDR=consul:8500  # 通过服务名访问 Consul
      - CONSUL_PATH=/cyi-app/task
      - SERVICE_ENV=dev
    depends_on:
      - consul
      - jaeger
      - mysql
      - redis
    networks:
      - cyi-network

  job-server:
    build:
      context: ..  # 项目根目录作为构建上下文
      dockerfile: app/job/Dockerfile
    container_name: task_server
    restart: always
    ports:
      - "9400:9400"  # gRPC 端口
    environment:
      - CONSUL_ADDR=consul:8500  # 通过服务名访问 Consul
      - CONSUL_PATH=/cyi-app/job
      - SERVICE_ENV=dev
    depends_on:
      - consul
      - jaeger
      - mysql
      - redis
    networks:
      - cyi-network

  # User 服务 - 技术微服务
  user-server:
    build:
      context: ..  # 项目根目录作为构建上下文
      dockerfile: app/service/user/Dockerfile
    container_name: user_server
    restart: always
    ports:
      - "9100:9100"  # gRPC 端口
    environment:
      - CONSUL_ADDR=consul:8500  # 通过服务名访问 Consul
      - CONSUL_PATH=/cyi-app/service/user
      - SERVICE_ENV=dev
    depends_on:
      - consul
      - jaeger
      - mysql
      - redis
    networks:
      - cyi-network
   # Product 服务 - 技术微服务
  product-server:
    build:
      context: ..  # 项目根目录作为构建上下文
      dockerfile: app/service/product/Dockerfile
    container_name: product_server
    restart: always
    ports:
      - "9200:9200"  # gRPC 端口
    environment:
      - CONSUL_ADDR=consul:8500  # 通过服务名访问 Consul
      - CONSUL_PATH=/cyi-app/service/product
      - SERVICE_ENV=dev
    depends_on:
      - consul
      - jaeger
      - mysql
      - redis
    networks:
      - cyi-network

  # Order 服务 - 技术微服务
  order-server:
    build:
      context: ..  # 项目根目录作为构建上下文
      dockerfile: app/service/order/Dockerfile
    container_name: order_server
    restart: always
    ports:
      - "9300:9300"  # gRPC 端口
    environment:
      - CONSUL_ADDR=consul:8500  # 通过服务名访问 Consul
      - CONSUL_PATH=/cyi-app/service/order
      - SERVICE_ENV=dev
    depends_on:
      - consul
      - jaeger
      - mysql
      - redis
    networks:
      - cyi-network
networks:
  cyi-network:
    driver: bridge