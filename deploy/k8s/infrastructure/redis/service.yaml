apiVersion: v1  # Kubernetes API 版本，使用 v1 版本的 Service API
kind: Service  # 资源类型，这里是 Service
metadata:
  name: redis  # Service 的名称
  namespace: infrastructure  # 部署在 infrastructure 命名空间
spec:
  type: NodePort  # 服务类型：NodePort，允许外部访问
  selector:
    app: redis  # 选择标签为 app: redis 的 Pod
  ports:
  - port: 6379  # 服务端口
    targetPort: 6379  # 容器端口
    nodePort: 30637  # 节点端口，外部访问地址：http://localhost:30637

# 说明：
# 1. 该 Service 为 Redis 服务创建网络访问配置。
# 2. 使用 NodePort 类型，允许从集群外部访问 Redis。
# 3. 暴露端口 6379，用于 Redis 连接。
# 4. 通过节点端口 30637 可以从外部访问缓存服务：http://localhost:30637
# 5. 该 Service 将流量路由到标签为 app: redis 的 Pod。
# 6. 集群内部的其他服务可以通过 redis:6379 访问缓存服务。