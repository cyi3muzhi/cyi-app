apiVersion: v1  # Kubernetes API 版本，使用 v1 版本的 PersistentVolumeClaim API
kind: PersistentVolumeClaim  # 资源类型，这里是 PersistentVolumeClaim
metadata:
  name: mysql-data  # 持久卷声明的名称，用于存储 MySQL 数据
  namespace: default  # 部署在 default 命名空间
spec:
  accessModes:
    - ReadWriteOnce  # 访问模式：单节点读写
  resources:
    requests:
      storage: 10Gi  # 存储请求：10GB

# 说明：
# 1. 该 PersistentVolumeClaim 为 MySQL 服务创建持久卷声明，用于存储数据库数据。
# 2. 请求 10GB 的存储空间，使用 ReadWriteOnce 访问模式。
# 3. 该 PVC 确保 MySQL 的数据在 Pod 重启后不会丢失。
# 4. 存储的数据包括数据库表、索引、日志等信息。