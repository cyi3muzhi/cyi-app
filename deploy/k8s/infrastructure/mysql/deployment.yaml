apiVersion: apps/v1  # Kubernetes API 版本，使用 apps/v1 版本的 Deployment API
kind: Deployment  # 资源类型，这里是 Deployment
metadata:
  name: mysql  # Deployment 的名称
  namespace: default  # 部署在 default 命名空间
spec:
  replicas: 1  # 运行 1 个副本
  selector:
    matchLabels:
      app: mysql  # 选择标签为 app: mysql 的 Pod
  template:
    metadata:
      labels:
        app: mysql  # Pod 的标签，与 selector 对应
    spec:
      containers:
      - name: mysql  # 容器名称
        image: mysql:8.0  # 使用的容器镜像
        ports:
        - containerPort: 3306  # 端口
        env:
        - name: MYSQL_ROOT_PASSWORD  # MySQL 根密码
          valueFrom:
            secretKeyRef:
              name: cyi-app-secret  # 密钥名称
              key: MYSQL_ROOT_PASSWORD  # 密钥键
        - name: MYSQL_DATABASE  # 数据库名称
          valueFrom:
            configMapKeyRef:
              name: cyi-app-config  # 配置映射名称
              key: MYSQL_DATABASE  # 配置键
        resources:  # 资源限制
          requests:
            cpu: "150m"  # 请求 150m CPU
            memory: "250Mi"  # 请求 250Mi 内存
          limits:
            cpu: "300m"  # 限制 300m CPU
            memory: "400Mi"  # 限制 400Mi 内存
        livenessProbe:  # 存活探针
          exec:
            command:
            - sh
            - -c
            - exec mysqladmin ping -uroot -p"${MYSQL_ROOT_PASSWORD}"
          initialDelaySeconds: 60  # 初始延迟 60 秒
          periodSeconds: 10  # 检查周期 10 秒
        readinessProbe:  # 就绪探针
          exec:
            command:
            - sh
            - -c
            - exec mysqladmin ping -uroot -p"${MYSQL_ROOT_PASSWORD}"
          initialDelaySeconds: 30  # 初始延迟 30 秒
          periodSeconds: 5  # 检查周期 5 秒
        args:  # 启动参数
        - --character-set-server=utf8mb4  # 字符集
        - --collation-server=utf8mb4_unicode_ci  # 排序规则
        volumeMounts:  # 卷挂载
        - name: mysql-data  # 数据卷
          mountPath: /var/lib/mysql  # 挂载到容器内的数据目录
      volumes:  # 卷配置
      - name: mysql-data  # 数据卷名称
        persistentVolumeClaim:
          claimName: mysql-data  # 数据持久卷声明名称

# 说明：
# 1. 该 Deployment 管理一个名为 mysql 的容器，用于提供数据库服务。
# 2. 容器使用 mysql:8.0 镜像。
# 3. 容器暴露端口 3306，用于数据库连接。
# 4. 从 Secret 中获取 MySQL 根密码，从 ConfigMap 中获取数据库名称。
# 5. 配置 MySQL 使用 utf8mb4 字符集和 utf8mb4_unicode_ci 排序规则。
# 6. 使用持久卷存储 MySQL 数据，确保数据持久化。
# 7. 该服务为应用提供持久化数据存储功能。
# 8. 配置了资源限制，确保容器不会过度消耗集群资源。
# 9. 配置了健康检查，提高服务的可用性。

# 生产环境说明：
# 1. 生产环境应使用固定版本的 MySQL 镜像，避免自动拉取最新版本
# 2. 生产环境应使用外部存储系统（如 EBS、GCE PD 等）作为持久卷
# 3. 建议使用 MySQL 集群或主从复制，提高可用性和数据冗余
# 4. 生产环境应配置适当的备份策略，定期备份数据库
# 5. 生产环境应调整 MySQL 配置参数，根据实际负载进行优化
# 6. 考虑使用数据库连接池，提高数据库访问性能
# 7. 生产环境应监控 MySQL 的健康状态和性能指标
# 8. 根据实际负载调整资源限制
# 9. 生产环境应配置网络策略，限制对 MySQL 服务的访问