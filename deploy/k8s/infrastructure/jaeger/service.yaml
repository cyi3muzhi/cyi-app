apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: default
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
  - port: 16686
    targetPort: 16686
    name: ui
    nodePort: 30686
  - port: 14268
    targetPort: 14268
    name: collector
    nodePort: 30268
  - port: 4318
    targetPort: 4318
    name: otlp-http
    nodePort: 30418