apiVersion: v1  # Kubernetes API 版本，使用 v1 版本的 Service API
kind: Service  # 资源类型，这里是 Service
metadata:
  name: jaeger  # Service 的名称
  namespace: default  # 部署在 default 命名空间
spec:
  type: NodePort  # 服务类型：NodePort，允许外部访问
  selector:
    app: jaeger  # 选择标签为 app: jaeger 的 Pod
  ports:
  - port: 16686  # 服务端口
    targetPort: 16686  # 容器端口
    name: ui  # 端口名称
    nodePort: 30686  # 节点端口，外部访问地址：http://localhost:30686
  - port: 14268  # 服务端口
    targetPort: 14268  # 容器端口
    name: collector  # 端口名称
    nodePort: 30268  # 节点端口
  - port: 4318  # 服务端口
    targetPort: 4318  # 容器端口
    name: otlp-http  # 端口名称
    nodePort: 30418  # 节点端口

# 说明：
# 1. 该 Service 为 Jaeger 服务创建网络访问配置。
# 2. 使用 NodePort 类型，允许从集群外部访问 Jaeger。
# 3. 暴露三个端口：
#    - 16686（UI 端口）：用于访问 Jaeger UI，外部访问地址：http://localhost:30686
#    - 14268（收集器端口）：用于接收追踪数据
#    - 4318（OTLP HTTP 端口）：用于接收 OTLP 格式的追踪数据
# 4. 该 Service 将流量路由到标签为 app: jaeger 的 Pod。