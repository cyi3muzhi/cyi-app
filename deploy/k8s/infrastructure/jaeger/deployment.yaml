apiVersion: apps/v1  # Kubernetes API 版本，使用 apps/v1 版本的 Deployment API
kind: Deployment  # 资源类型，这里是 Deployment
metadata:
  name: jaeger  # Deployment 的名称
  namespace: default  # 部署在 default 命名空间
spec:
  replicas: 1  # 运行 1 个副本
  selector:
    matchLabels:
      app: jaeger  # 选择标签为 app: jaeger 的 Pod
  template:
    metadata:
      labels:
        app: jaeger  # Pod 的标签，与 selector 对应
    spec:
      containers:
      - name: jaeger  # 容器名称
        image: jaegertracing/all-in-one:1.49  # 使用的容器镜像
        ports:
        - containerPort: 16686  # UI 端口
        - containerPort: 14268  # 收集器端口
        env:
        - name: COLLECTOR_OTLP_ENABLED  # 启用 OTLP 收集器
          value: "true"  # 启用
        - name: COLLECTOR_ZIPKIN_HOST_PORT  # Zipkin 收集器端口
          value: ":9411"  # 端口值
        - name: SPAN_STORAGE_TYPE  # 跨度存储类型
          value: "badger"  # 使用 Badger 存储
        - name: BADGER_DIR  # Badger 存储目录
          value: "/data/badger"  # 目录路径
        resources:  # 资源限制
          requests:
            cpu: "100m"  # 请求 100m CPU
            memory: "150Mi"  # 请求 150Mi 内存
          limits:
            cpu: "200m"  # 限制 200m CPU
            memory: "300Mi"  # 限制 300Mi 内存
        livenessProbe:  # 存活探针
          httpGet:
            path: /
            port: 16686
          initialDelaySeconds: 30  # 初始延迟 30 秒
          periodSeconds: 10  # 检查周期 10 秒
        readinessProbe:  # 就绪探针
          httpGet:
            path: /
            port: 16686
          initialDelaySeconds: 15  # 初始延迟 15 秒
          periodSeconds: 5  # 检查周期 5 秒
        volumeMounts:  # 卷挂载
        - name: jaeger-data  # 数据卷
          mountPath: /data  # 挂载到容器内的数据目录
      volumes:  # 卷配置
      - name: jaeger-data  # 数据卷名称
        persistentVolumeClaim:
          claimName: jaeger-data  # 数据持久卷声明名称

# 说明：
# 1. 该 Deployment 管理一个名为 jaeger 的容器，用于提供分布式追踪服务。
# 2. 容器使用 jaegertracing/all-in-one:1.49 镜像，包含所有 Jaeger 组件。
# 3. 容器暴露端口 16686（UI）和 14268（收集器）。
# 4. 启用 OTLP 收集器和 Zipkin 收集器。
# 5. 使用 Badger 作为跨度存储，存储在 /data/badger 目录。
# 6. 使用持久卷存储 Jaeger 数据，确保数据持久化。
# 7. 该服务用于追踪分布式系统中的请求流程，便于故障排查和性能分析。
# 8. 配置了资源限制，确保容器不会过度消耗集群资源。
# 9. 配置了健康检查，提高服务的可用性。

# 生产环境说明：
# 1. 生产环境应使用更可靠的存储后端，如 Cassandra 或 Elasticsearch
# 2. 生产环境应部署多个 Jaeger 实例，提高可用性
# 3. 建议使用外部存储系统（如 EBS、GCE PD 等）作为持久卷
# 4. 生产环境应配置适当的采样策略，平衡追踪数据量和系统性能
# 5. 考虑使用 Jaeger 的集群模式，分离收集器、查询服务和存储
# 6. 生产环境应监控 Jaeger 的健康状态和性能指标
# 7. 根据实际负载调整资源限制和副本数
# 8. 生产环境应配置访问控制，限制对 Jaeger UI 的访问