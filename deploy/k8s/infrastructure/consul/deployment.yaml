apiVersion: apps/v1  # Kubernetes API 版本，使用 apps/v1 版本的 Deployment API
kind: Deployment  # 资源类型，这里是 Deployment
metadata:
  name: consul  # Deployment 的名称
  namespace: infrastructure  # 部署在 infrastructure 命名空间
spec:
  replicas: 1  # 运行 1 个副本
  selector:
    matchLabels:
      app: consul  # 选择标签为 app: consul 的 Pod
  template:
    metadata:
      labels:
        app: consul  # Pod 的标签，与 selector 对应
    spec:
      containers:
      - name: consul  # 容器名称
        image: hashicorp/consul:1.22  # 使用的容器镜像
        ports:
        - containerPort: 8500  # HTTP 端口，用于 Consul UI 和 API
        - containerPort: 8600  # DNS 端口，使用 UDP 协议
        - containerPort: 8300  # 服务器间通信端口
        env:
        - name: CONSUL_UI  # Consul UI 启用配置
          value: "true"  # 启用 Consul UI
        resources:  # 资源限制
          requests:
            cpu: "50m"  # 请求 50m CPU
            memory: "100Mi"  # 请求 100Mi 内存
          limits:
            cpu: "200m"  # 限制 200m CPU
            memory: "128Mi"  # 限制 128Mi 内存
        livenessProbe:  # 存活探针
          httpGet:
            path: /v1/status/leader
            port: 8500
          initialDelaySeconds: 30  # 初始延迟 30 秒
          periodSeconds: 10  # 检查周期 10 秒
        readinessProbe:  # 就绪探针
          httpGet:
            path: /v1/status/leader
            port: 8500
          initialDelaySeconds: 5  # 初始延迟 5 秒
          periodSeconds: 5  # 检查周期 5 秒
        command:  # 启动命令
        - consul
        - agent
        - -server  # 以服务器模式运行
        - -bootstrap-expect=1  # 期望的服务器数量
        - -ui  # 启用 UI
        - -client=0.0.0.0  # 客户端绑定地址
        - -bind=0.0.0.0  # 绑定地址
        - -data-dir=/consul/data  # 数据目录
        - -config-dir=/consul/config  # 配置目录
        volumeMounts:  # 卷挂载
        - name: consul-data  # 数据卷
          mountPath: /consul/data  # 挂载到容器内的数据目录
        - name: consul-config  # 配置卷
          mountPath: /consul/config  # 挂载到容器内的配置目录
      volumes:  # 卷配置
      - name: consul-data  # 数据卷名称
        persistentVolumeClaim:
          claimName: consul-data
      - name: consul-config  # 配置卷名称
        persistentVolumeClaim:
          claimName: consul-config

# 说明：
# 1. 该 Deployment 管理一个名为 consul 的容器，用于提供服务发现和配置管理功能。
# 2. 容器使用 hashicorp/consul:1.22 镜像。
# 3. 容器暴露端口 8500（HTTP）、8600（DNS）和 8300（服务器间通信）。
# 4. 启用了 Consul UI，并配置了数据和配置目录。
# 5. 使用持久卷存储 Consul 数据和配置，确保数据持久化。
# 6. 配置了资源限制，确保容器不会过度消耗集群资源。
# 7. 配置了健康检查，提高服务的可用性。

# 生产环境说明：
# 1. 生产环境应部署多个 Consul 服务器节点（至少 3 个），确保高可用性
# 2. 生产环境应配置 TLS 加密，保护服务间通信
# 3. 建议使用外部存储系统（如 EBS、GCE PD 等）作为持久卷
# 4. 生产环境应配置适当的备份策略，定期备份 Consul 数据
# 5. 考虑使用 Consul 的 ACL 功能，限制服务注册和查询权限
# 6. 生产环境应监控 Consul 集群的健康状态
# 7. 根据实际负载调整资源限制和副本数