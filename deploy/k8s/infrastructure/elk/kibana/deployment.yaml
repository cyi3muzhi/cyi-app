apiVersion: apps/v1  # Kubernetes API 版本，使用 apps/v1 版本的 Deployment API
kind: Deployment  # 资源类型，这里是 Deployment
metadata:
  name: kibana  # Deployment 的名称
  namespace: default  # 部署在 default 命名空间
  labels:
    app: kibana  # 标签

spec:
  replicas: 1  # 运行 1 个副本
  selector:
    matchLabels:
      app: kibana  # 选择标签为 app: kibana 的 Pod
  template:
    metadata:
      labels:
        app: kibana  # Pod 的标签，与 selector 对应
    spec:
      containers:
      - name: kibana  # 容器名称
        image: docker.elastic.co/kibana/kibana:7.17.10  # 使用的容器镜像
        ports:
        - containerPort: 5601  # 端口
        env:
        - name: ELASTICSEARCH_HOSTS  # Elasticsearch 地址
          value: http://elasticsearch:9200  # 地址值
        - name: ELASTICSEARCH_USERNAME  # Elasticsearch 用户名
          value: elastic  # 用户名
        - name: ELASTICSEARCH_PASSWORD  # Elasticsearch 密码
          value: changeme  # 密码
        resources:  # 资源限制
          requests:
            cpu: "200m"  # 请求 200m CPU
            memory: "512Mi"  # 请求 512Mi 内存
          limits:
            cpu: "500m"  # 限制 500m CPU
            memory: "1Gi"  # 限制 1Gi 内存
        livenessProbe:  # 存活探针
          httpGet:
            path: /api/status
            port: 5601
          initialDelaySeconds: 60  # 初始延迟 60 秒
          periodSeconds: 10  # 检查周期 10 秒
        readinessProbe:  # 就绪探针
          httpGet:
            path: /api/status
            port: 5601
          initialDelaySeconds: 30  # 初始延迟 30 秒
          periodSeconds: 5  # 检查周期 5 秒

---

apiVersion: v1  # Kubernetes API 版本，使用 v1 版本的 Service API
kind: Service  # 资源类型，这里是 Service
metadata:
  name: kibana  # Service 的名称
  namespace: default  # 部署在 default 命名空间
spec:
  selector:
    app: kibana  # 选择标签为 app: kibana 的 Pod
  ports:
  - name: http  # 端口名称
    port: 5601  # 服务端口
    targetPort: 5601  # 容器端口
    nodePort: 30201  # 节点端口，外部访问地址：http://localhost:30201
  type: NodePort  # 服务类型：NodePort，允许外部访问

# 说明：
# 1. 该 Deployment 管理一个名为 kibana 的容器，用于可视化和分析日志数据。
# 2. 容器使用 docker.elastic.co/kibana/kibana:7.17.10 镜像。
# 3. 容器暴露端口 5601，用于访问 Kibana UI。
# 4. 配置 Elasticsearch 地址、用户名和密码，用于连接 Elasticsearch 集群。
# 5. 该 Service 为 Kibana 服务创建网络访问配置，使用 NodePort 类型，允许外部访问。
# 6. 通过节点端口 30201 可以访问 Kibana UI：http://localhost:30201
# 7. 配置了资源限制，确保容器不会过度消耗集群资源。
# 8. 配置了健康检查，提高服务的可用性。

# 生产环境说明：
# 1. 生产环境应使用 Kubernetes Secret 存储 Elasticsearch 用户名和密码
# 2. 生产环境应配置 TLS 加密，保护 Kibana UI 访问
# 3. 建议使用 Ingress 控制器暴露 Kibana 服务，提供更灵活的路由配置和访问控制
# 4. 生产环境应配置访问控制，限制对 Kibana UI 的访问
# 5. 考虑使用 Kibana 的空间功能，为不同团队或用户组创建隔离的视图
# 6. 生产环境应监控 Kibana 的健康状态和性能指标
# 7. 根据实际使用情况调整资源限制
# 8. 生产环境应定期备份 Kibana 配置和仪表盘