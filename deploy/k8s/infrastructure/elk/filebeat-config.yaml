apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: default
data:
  filebeat.yml: |
    # 容器日志文件输入
    filebeat.inputs:
      # 接口服务日志
      - type: log
        enabled: true
        paths:
          - /app/logs/interface/*.log
        encoding: utf-8
        multiline.pattern: '^\d{4}-\d{2}-\d{2}'
        multiline.negate: true
        multiline.match: after
        fields:
          service: interface-service
          environment: ${ENVIRONMENT:development}
        fields_under_root: true

      # 用户服务日志
      - type: log
        enabled: true
        paths:
          - /app/logs/user/*.log
        encoding: utf-8
        multiline.pattern: '^\d{4}-\d{2}-\d{2}'
        multiline.negate: true
        multiline.match: after
        fields:
          service: user-service
          environment: ${ENVIRONMENT:development}
        fields_under_root: true

      # 任务服务日志
      - type: log
        enabled: true
        paths:
          - /app/logs/task/*.log
        encoding: utf-8
        multiline.pattern: '^\d{4}-\d{2}-\d{2}'
        multiline.negate: true
        multiline.match: after
        fields:
          service: task-service
          environment: ${ENVIRONMENT:development}
        fields_under_root: true

      # 作业服务日志
      - type: log
        enabled: true
        paths:
          - /app/logs/job/*.log
        encoding: utf-8
        multiline.pattern: '^\d{4}-\d{2}-\d{2}'
        multiline.negate: true
        multiline.match: after
        fields:
          service: job-service
          environment: ${ENVIRONMENT:development}
        fields_under_root: true

    # 输出配置
    output.logstash:
      hosts: ["logstash:5044"]
      ssl.enabled: false

    # 日志配置
    logging.level: info
    logging.to_files: false
