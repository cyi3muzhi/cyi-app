apiVersion: v1  # Kubernetes API 版本，使用 v1 版本的 ConfigMap API
kind: ConfigMap  # 资源类型，这里是 ConfigMap
metadata:
  name: filebeat-config  # ConfigMap 的名称
  namespace: default  # 部署在 default 命名空间
data:
  filebeat.yml: |
    # 容器日志文件输入
    filebeat.inputs:
      # 所有服务日志
      - type: log  # 输入类型：日志
        enabled: true  # 启用该输入
        paths:
          - /app/logs/*/*.log  # 日志文件路径
        encoding: utf-8  # 编码格式
        multiline.pattern: '^\d{4}-\d{2}-\d{2}'  # 多行日志模式：以日期开头
        multiline.negate: true  # 否定模式：不匹配模式
        multiline.match: after  # 匹配方式：将不匹配的行添加到前一行
        processors:  # 处理器
          - dissect:  # 解析处理器
              tokenizer: '%{log_dir}/%{filename}'  # 分词器
              field: 'log.file.path'  # 字段
              target_prefix: 'parsed'  # 目标前缀
          - rename:  # 重命名处理器
              fields:
                parsed.filename: 'log_filename'  # 重命名字段
          - add_fields:  # 添加字段处理器
              fields:
                service: app  # 服务名称
                environment: ${ENVIRONMENT:development}  # 环境变量，默认值为 development
              target: ''  # 目标：根级别
        fields_under_root: true  # 字段在根级别

    # 输出配置
    output.logstash:
      hosts: ["logstash:5044"]  # Logstash 地址
      ssl.enabled: false  # 禁用 SSL

    # 日志配置
    logging.level: info  # 日志级别
    logging.to_files: false  # 不输出到文件

# 说明：
# 1. 该 ConfigMap 存储 Filebeat 的配置信息。
# 2. 配置 Filebeat 从 /app/logs/*/*.log 路径收集日志。
# 3. 处理多行日志，以日期开头的行为新日志的开始。
# 4. 使用处理器解析日志路径，提取文件名，并添加服务和环境字段。
# 5. 将处理后的日志输出到 Logstash 的 5044 端口。
# 6. 配置 Filebeat 自身的日志级别为 info，不输出到文件。
