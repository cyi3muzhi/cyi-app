apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: default
  labels:
    app: filebeat
spec:
  selector:
    matchLabels:
      app: filebeat
  template:
    metadata:
      labels:
        app: filebeat
    spec:
      containers:
      - name: filebeat
        image: docker.elastic.co/beats/filebeat:7.17.10
        args:
        - -e
        - --strict.perms=false
        env:
        - name: ENVIRONMENT
          value: development
        volumeMounts:
        - name: filebeat-config
          mountPath: /usr/share/filebeat/filebeat.yml
          subPath: filebeat.yml
        - name: filebeat-data
          mountPath: /usr/share/filebeat/data
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: filebeat-config
        configMap:
          name: filebeat-config
      - name: filebeat-data
        emptyDir: {}
      - name: logs
        hostPath:
          path: /mnt/e/me/cyi-app/deploy/logs
          type: DirectoryOrCreate
