apiVersion: v1
kind: ConfigMap
metadata:
  name: cyi-app-config
  namespace: default
data:
  # 服务发现配置
  CONSUL_ADDR: "consul:8500"
  # 环境配置
  SERVICE_ENV: "dev"
  # 数据库配置
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "cin_test"
  # Redis配置
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  # Jaeger配置
  JAEGER_HOST: "jaeger"
  JAEGER_PORT: "14268"
