apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: default
spec:
  type: NodePort
  selector:
    app: consul
  ports:
  - port: 8500
    targetPort: 8500
    name: http
    nodePort: 30500
  - port: 8600
    targetPort: 8600
    name: dns
    protocol: UDP
    nodePort: 30600

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: default
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: default
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: default
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
  - port: 16686
    targetPort: 16686
    name: ui
    nodePort: 30686
  - port: 14268
    targetPort: 14268
    name: collector
    nodePort: 30268

---
apiVersion: v1
kind: Service
metadata:
  name: service-interface
  namespace: default
spec:
  type: NodePort
  selector:
    app: service-interface
  ports:
  - port: 8000
    targetPort: 8000
    name: http
    nodePort: 30800
  - port: 9000
    targetPort: 9000
    name: grpc
    nodePort: 30901

---
apiVersion: v1
kind: Service
metadata:
  name: service-task
  namespace: default
spec:
  selector:
    app: service-task
  ports:
  - port: 8000
    targetPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: service-job
  namespace: default
spec:
  selector:
    app: service-job
  ports:
  - port: 8000
    targetPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: service-user
  namespace: default
spec:
  selector:
    app: service-user
  ports:
  - port: 9000
    targetPort: 9000
    name: grpc
