apiVersion: v1  # Kubernetes API 版本，使用 v1 版本的 Service API
kind: Service  # 资源类型，这里是 Service
metadata:
  name: service-task  # Service 的名称
  namespace: default  # 部署在 default 命名空间
spec:
  selector:
    app: service-task  # 选择标签为 app: service-task 的 Pod
  ports:
  - port: 8000  # 服务端口
    targetPort: 8000  # 容器端口

# 说明：
# 1. 该 Service 为任务处理服务创建网络访问配置。
# 2. 使用默认的 ClusterIP 类型，只允许集群内部访问。
# 3. 暴露端口 8000，用于服务访问。
# 4. 该 Service 将流量路由到标签为 app: service-task 的 Pod。
# 5. 集群内部的其他服务可以通过 service-task:8000 访问任务处理服务。