apiVersion: v1  # Kubernetes API 版本，使用 v1 版本的 Service API
kind: Service  # 资源类型，这里是 Service
metadata:
  name: service-interface  # Service 的名称
  namespace: default  # 部署在 default 命名空间
spec:
  type: NodePort  # 服务类型：NodePort，允许外部访问
  selector:
    app: service-interface  # 选择标签为 app: service-interface 的 Pod
  ports:
  - port: 8000  # 服务端口
    targetPort: 8000  # 容器端口
    name: http  # 端口名称
    nodePort: 30800  # 节点端口，外部访问地址：http://localhost:30800
  - port: 9000  # 服务端口
    targetPort: 9000  # 容器端口
    name: grpc  # 端口名称
    nodePort: 30901  # 节点端口

# 说明：
# 1. 该 Service 为接口服务创建网络访问配置。
# 2. 使用 NodePort 类型，允许从集群外部访问接口服务。
# 3. 暴露两个端口：
#    - 8000（HTTP 端口）：用于 REST API 访问，外部访问地址：http://localhost:30800
#    - 9000（gRPC 端口）：用于 gRPC 服务访问
# 4. 该 Service 将流量路由到标签为 app: service-interface 的 Pod。
# 5. 接口服务作为 API 网关，处理外部请求并路由到其他服务。