apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-interface
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-interface
  template:
    metadata:
      labels:
        app: service-interface
    spec:
      containers:
      - name: service-interface
        image: go-kratos/cin-interface:0.1.0
        ports:
        - containerPort: 8000
        - containerPort: 9000
        env:
        - name: CONSUL_ADDR
          value: "consul:8500"
        - name: CONSUL_PATH
          value: "/develop/cyi-app/cin/interface"
        - name: SERVICE_ENV
          value: "dev"
        - name: LOG_LEVEL
          value: "debug"
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}