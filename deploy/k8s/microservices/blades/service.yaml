apiVersion: v1  # Kubernetes API 版本，使用 v1 版本的 Service API
kind: Service  # 资源类型，这里是 Service
metadata:
  name: service-blades  # Service 的名称
  namespace: default  # 部署在 default 命名空间
spec:
  type: NodePort  # 服务类型为 NodePort，允许外部访问
  selector:
    app: service-blades  # 选择标签为 app: service-blades 的 Pod
  ports:
  - port: 9000  # 服务端口
    targetPort: 9000  # 容器端口
    name: grpc  # 端口名称
  - port: 8000  # 服务端口
    targetPort: 8000  # 容器端口
    name: http  # 端口名称
    nodePort: 31000  # 节点端口，外部访问地址：http://localhost:30900

# 说明：
# 1. 该 Service 为 blades 服务创建网络访问配置。
# 2. 使用 NodePort 类型，允许外部访问。
# 3. 暴露端口 9000，用于 gRPC 服务访问。
# 4. 暴露端口 8000，用于 HTTP 服务访问，外部访问地址：http://localhost:30900
# 5. 该 Service 将流量路由到标签为 app: service-blades 的 Pod。
# 6. 集群内部的其他服务可以通过 service-blades:9000 访问 blades 服务。