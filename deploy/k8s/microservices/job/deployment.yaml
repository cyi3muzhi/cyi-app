apiVersion: apps/v1  # Kubernetes API 版本，使用 apps/v1 版本的 Deployment API
kind: Deployment  # 资源类型，这里是 Deployment
metadata:
  name: service-job  # Deployment 的名称
  namespace: default  # 部署在 default 命名空间
spec:
  replicas: 2  # 运行 2 个副本
  selector:
    matchLabels:
      app: service-job  # 选择标签为 app: service-job 的 Pod
  template:
    metadata:
      labels:
        app: service-job  # Pod 的标签，与 selector 对应
    spec:
      containers:
      - name: service-job  # 容器名称
        image: go-kratos/job:0.1.0  # 使用的容器镜像
        ports:
        - containerPort: 8000  # 端口
        env:
        - name: CONSUL_ADDR  # Consul 地址
          valueFrom:
            configMapKeyRef:
              name: cyi-app-config  # 配置映射名称
              key: CONSUL_ADDR  # 配置键
        - name: CONSUL_PATHS  # Consul 路径
          value: "/develop/common,/develop/cyi-app/job"  # 路径值
        - name: SERVICE_ENV  # 服务环境
          valueFrom:
            configMapKeyRef:
              name: cyi-app-config  # 配置映射名称
              key: SERVICE_ENV  # 配置键
        resources:  # 资源限制
          requests:
            cpu: "50m"  # 请求 50m CPU
            memory: "100Mi"  # 请求 100Mi 内存
          limits:
            cpu: "150m"  # 限制 150m CPU
            memory: "128Mi"  # 限制 128Mi 内存
        livenessProbe:  # 存活探针
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30  # 初始延迟 30 秒
          periodSeconds: 10  # 检查周期 10 秒
        readinessProbe:  # 就绪探针
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5  # 初始延迟 5 秒
          periodSeconds: 5  # 检查周期 5 秒
        volumeMounts:  # 卷挂载
        - name: logs  # 日志卷
          mountPath: /app/logs  # 挂载到容器内的路径
      volumes:  # 卷配置
      - name: logs  # 卷名称，与 volumeMounts 对应
        hostPath:  # 使用主机路径卷
          path: /mnt/e/me/cyi-app/deploy/logs/job  # 主机上的路径
          type: DirectoryOrCreate  # 目录不存在则创建

# 说明：
# 1. 该 Deployment 管理一个名为 service-job 的容器，用于提供任务服务。
# 2. 容器使用 go-kratos/job:0.1.0 镜像。
# 3. 容器暴露端口 8000，用于服务访问。
# 4. 从 ConfigMap 中获取 Consul 地址和服务环境配置。
# 5. 挂载主机路径 /mnt/e/me/cyi-app/deploy/logs/job 到容器内的 /app/logs 目录。
# 6. 该服务处理定时任务和后台任务，如数据清理、统计分析等。
# 7. 配置了资源限制，确保容器不会过度消耗集群资源。
# 8. 配置了健康检查，提高服务的可用性。

---
apiVersion: autoscaling/v2  # Kubernetes API 版本，使用 autoscaling/v2 版本的 HorizontalPodAutoscaler API
kind: HorizontalPodAutoscaler  # 资源类型，这里是 HorizontalPodAutoscaler
metadata:
  name: service-job-hpa  # HPA 的名称
  namespace: default  # 部署在 default 命名空间
spec:
  scaleTargetRef:
    apiVersion: apps/v1  # 目标资源的 API 版本
    kind: Deployment  # 目标资源的类型
    name: service-job  # 目标 Deployment 的名称
  minReplicas: 1  # 最小副本数
  maxReplicas: 5  # 最大副本数
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70  # CPU 使用率目标为 70%
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80  # 内存使用率目标为 80%

# 生产环境说明：
# 1. 生产环境需将 SERVICE_ENV 设置为 "prod"
# 2. 生产环境应使用固定版本的镜像，避免自动拉取最新版本
# 3. 建议使用持久卷（PV）替代 hostPath 卷，提高数据安全性
# 4. 生产环境应增加副本数，提高服务可用性
# 5. 根据实际负载调整 HPA 的资源使用率目标和最大副本数
# 6. 生产环境应配置网络策略，限制服务之间的通信
# 7. 考虑使用 ingress 控制器暴露服务，提供更灵活的路由配置
# 8. 生产环境应启用 Pod 反亲和性，避免所有副本运行在同一节点