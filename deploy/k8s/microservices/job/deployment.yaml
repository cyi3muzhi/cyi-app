apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-job
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-job
  template:
    metadata:
      labels:
        app: service-job
    spec:
      containers:
      - name: service-job
        image: go-kratos/job:0.1.0
        ports:
        - containerPort: 8000
        env:
        - name: CONSUL_ADDR
          valueFrom:
            configMapKeyRef:
              name: cyi-app-config
              key: CONSUL_ADDR
        - name: CONSUL_PATH
          value: "/develop/cyi-app/job"
        - name: SERVICE_ENV
          valueFrom:
            configMapKeyRef:
              name: cyi-app-config
              key: SERVICE_ENV
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        hostPath:
          path: /mnt/e/me/cyi-app/deploy/logs/job
          type: DirectoryOrCreate