apiVersion: v1  # Kubernetes API 版本，使用 v1 版本的 PersistentVolumeClaim API
kind: PersistentVolumeClaim  # 资源类型，这里是 PersistentVolumeClaim
metadata:
  name: prometheus-data  # PVC 的名称
  namespace: default  # 部署在 default 命名空间
spec:
  accessModes:
    - ReadWriteOnce  # 访问模式为读写一次
  resources:
    requests:
      storage: 10Gi  # 请求 10Gi 存储空间


# 说明：
# 1. 该 PersistentVolumeClaim 为 Prometheus 提供持久化存储。
# 2. 存储容量为 10Gi，访问模式为 ReadWriteOnce。
# 3. 用于存储 Prometheus 采集的监控数据和索引。

# 生产环境说明：
# 1. 生产环境应根据监控数据量调整存储容量
# 2. 建议使用外部存储系统（如 EBS、GCE PD 等）作为持久卷
# 3. 生产环境应配置适当的存储和保留策略，避免数据量过大
# 4. 考虑使用具有更高 IOPS 的存储类型，提高 Prometheus 性能
# 5. 生产环境应定期备份存储数据，确保数据安全