apiVersion: apps/v1  # Kubernetes API 版本，使用 apps/v1 版本的 Deployment API
kind: Deployment    # 资源类型，这里是 Deployment
metadata:
  name: prometheus  # Deployment 的名称
  namespace: default  # 部署在 default 命名空间
spec:
  replicas: 1  # 运行 1 个副本
  selector:
    matchLabels:
      app: prometheus  # 选择标签为 app: prometheus 的 Pod
  template:
    metadata:
      labels:
        app: prometheus  # Pod 的标签，与 selector 对应
    spec:
      containers:
      - name: prometheus  # 容器名称
        image: prom/prometheus:v2.43.0  # 使用的容器镜像
        ports:
        - containerPort: 9090  # 容器暴露的端口 9090
        resources:  # 资源限制
          requests:
            cpu: "500m"  # 请求 500m CPU
            memory: "1Gi"  # 请求 1Gi 内存
          limits:
            cpu: "1"  # 限制 1 CPU
            memory: "2Gi"  # 限制 2Gi 内存
        livenessProbe:  # 存活探针
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 60  # 初始延迟 60 秒
          periodSeconds: 10  # 检查周期 10 秒
        readinessProbe:  # 就绪探针
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 30  # 初始延迟 30 秒
          periodSeconds: 5  # 检查周期 5 秒
        volumeMounts:  # 卷挂载
        - name: prometheus-config  # 卷名称
          mountPath: /etc/prometheus/prometheus.yml  # 挂载到容器内的路径
          subPath: prometheus.yml  # 子路径
        - name: prometheus-data  # 卷名称
          mountPath: /prometheus  # 挂载到容器内的路径
      volumes:  # 卷配置
      - name: prometheus-config  # 卷名称，与 volumeMounts 对应
        configMap:  # 使用 ConfigMap 卷
          name: prometheus-config  # ConfigMap 的名称
      - name: prometheus-data  # 卷名称，与 volumeMounts 对应
        persistentVolumeClaim:  # 使用持久卷声明
          claimName: prometheus-data  # PVC 的名称

---
apiVersion: v1  # Kubernetes API 版本，使用 v1 版本的 Service API
kind: Service  # 资源类型，这里是 Service
metadata:
  name: prometheus  # Service 的名称
  namespace: default  # 部署在 default 命名空间
spec:
  type: NodePort  # Service 类型为 NodePort，暴露到节点端口
  selector:
    app: prometheus  # 选择标签为 app: prometheus 的 Pod
  ports:
  - port: 9090  # Service 端口
    targetPort: 9090  # 目标 Pod 端口
    nodePort: 30900  # 节点端口

---
apiVersion: v1  # Kubernetes API 版本，使用 v1 版本的 ConfigMap API
kind: ConfigMap  # 资源类型，这里是 ConfigMap
metadata:
  name: prometheus-config  # ConfigMap 的名称
  namespace: default  # 部署在 default 命名空间
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s  # 抓取间隔为 15 秒
    scrape_configs:
    - job_name: 'kubernetes-services'  # 作业名称
      kubernetes_sd_configs:
      - role: service  # 服务发现角色为 service
      relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: true  # 只保留带有 prometheus.io/scrape=true 注释的服务
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)  # 替换指标路径
      - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__  # 替换地址
      - action: labelmap
        regex: __meta_kubernetes_service_label_(.+)  # 映射服务标签
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace  # 替换命名空间标签
      - source_labels: [__meta_kubernetes_service_name]
        action: replace
        target_label: kubernetes_name  # 替换服务名称标签


# 说明：
# 1. 该文件包含三个资源：Deployment、Service 和 ConfigMap。
# 2. Deployment 管理一个名为 prometheus 的容器，用于监控系统。
# 3. Service 以 NodePort 方式暴露 prometheus 服务到节点端口 30900。
# 4. ConfigMap 存储 prometheus 的配置，包括抓取间隔和服务发现规则。
# 5. 容器使用 prom/prometheus:v2.43.0 镜像，挂载配置文件和数据卷。
# 6. 配置了资源限制，确保容器不会过度消耗集群资源。
# 7. 配置了健康检查，提高服务的可用性。

# 生产环境说明：
# 1. 生产环境应使用固定版本的 Prometheus 镜像，避免自动拉取最新版本
# 2. 生产环境应使用外部存储系统（如 EBS、GCE PD 等）作为持久卷
# 3. 建议使用 Prometheus Operator 管理 Prometheus 集群
# 4. 生产环境应配置适当的存储和保留策略，避免数据量过大
# 5. 生产环境应调整抓取间隔和配置，根据实际监控需求进行优化
# 6. 考虑使用 Prometheus 联邦集群，提高监控系统的可扩展性
# 7. 生产环境应监控 Prometheus 自身的健康状态和性能指标
# 8. 根据实际负载调整资源限制
# 9. 生产环境应配置网络策略，限制对 Prometheus 服务的访问
