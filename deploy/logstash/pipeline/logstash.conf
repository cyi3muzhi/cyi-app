# Logstash 管道配置文件
# 用于处理来自 Filebeat 的日志数据

input {
  # Filebeat 输入
  beats {
    port => 5044
  }
  
  # 标准输入（用于测试）
  stdin {
    codec => json
  }
}

filter {
  # 处理 JSON 格式的日志
  if [message] =~ /^{"/ {
    json {
      source => "message"
      target => "log"
    }
  }
  
  # 处理文本格式的日志
  else {
    # 使用 grok 解析日志格式
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{GREEDYDATA:log_message}"
      }
      # 如果解析失败，将消息存储在 log_message 字段中
      break_on_match => false
    }
    
    # 日期处理
    date {
      match => ["timestamp", "yyyy-MM-dd HH:mm:ss"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }
  
  # 添加服务字段
  if [fields][service] {
    mutate {
      add_field => {
        "service" => "%{[fields][service]}"
      }
    }
  }
  
  # 移除不需要的字段
  mutate {
    remove_field => ["fields", "host", "agent", "ecs"]
  }
}

output {
  # 输出到 Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "cyi-app-logs-%{+yyyy.MM.dd}"
    user => "elastic"
    password => "changeme"
  }
  
  # 输出到控制台（用于调试）
  stdout {
    codec => rubydebug
  }
}
