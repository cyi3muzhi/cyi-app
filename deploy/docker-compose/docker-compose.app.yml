# 应用层微服务配置
# 注意：基础设施（Consul/MySQL/Redis/NATS/Jaeger）由 docker-compose.infra.yml 管理
#       这里不声明它们为外部服务（Docker Compose 不支持 external: true for services）
#       服务发现通过 Consul DNS 实现，网络共享通过 external: true 网络实现
services:
  # Interface 服务 - 业务微服务
  service-interface:
    image: cyi3muz/cin-interface:0.1.0
    container_name: service-cin-interface
    restart: always
    ports:
      - "${INTERFACE_HTTP_PORT}:8000"  # HTTP 端口
      - "${INTERFACE_GRPC_PORT}:9000"  # gRPC 端口
    volumes:
      - ../logs/interface-service:/app/logs
    environment:
      - CONSUL_ADDR=consul:8500
      - CONSUL_PATHS=/develop/common,/develop/cyi-app/cin/interface
      - SERVICE_ENV=dev
    networks:
      - cyi-network

  # task 任务服务
  service-task:
    image: cyi3muz/task:0.1.0
    container_name: service-task
    restart: always
    ports:
      - "${TASK_PORT}:8000"
    volumes:
      - ../logs/task-service:/app/logs
    environment:
      - CONSUL_ADDR=consul:8500
      - CONSUL_PATHS=/develop/common,/develop/cyi-app/task
      - SERVICE_ENV=dev
    networks:
      - cyi-network

  # job 任务服务
  service-job:
    image: cyi3muz/job:0.1.0
    container_name: service-job
    restart: always
    ports:
      - "${JOB_PORT}:8000"
    volumes:
      - ../logs/job-service:/app/logs
    environment:
      - CONSUL_ADDR=consul:8500
      - CONSUL_PATHS=/develop/common,/develop/cyi-app/job
      - SERVICE_ENV=dev
    networks:
      - cyi-network

  # User 服务 - 技术微服务
  service-user:
    image: cyi3muz/service-user:0.1.0
    container_name: service-user
    restart: always
    ports:
      - "${USER_GRPC_PORT}:9000"
    volumes:
      - ../logs/user-service:/app/logs
    environment:
      - CONSUL_ADDR=consul:8500
      - CONSUL_PATHS=/develop/common,/develop/cyi-app/service/user
      - SERVICE_ENV=dev
    networks:
      - cyi-network

  # Blade 服务 - 技术微服务
  service-blades:
    image: cyi3muz/blades:0.1.0
    container_name: service-blades
    restart: always
    ports:
      - "${BLADES_HTTP_PORT}:8000"
      - "${BLADES_GRPC_PORT}:9000"
    volumes:
      - ../logs/blades-service:/app/logs
    environment:
      - CONSUL_ADDR=consul:8500
      - CONSUL_PATHS=/develop/common,/develop/cyi-app/blades
      - SERVICE_ENV=dev
    networks:
      - cyi-network

  # Admin BFF 服务 - 管理后台 API
  service-admin:
    image: cyi3muz/cin-admin:0.1.0
    container_name: service-admin
    restart: always
    ports:
      - "${ADMIN_HTTP_PORT}:8000"
      - "${ADMIN_GRPC_PORT}:9000"
    environment:
      - CONSUL_ADDR=consul:8500
      - CONSUL_PATHS=/develop/common,/develop/cyi-app/cin/admin
      - SERVICE_ENV=dev
    networks:
      - cyi-network

  # Order 订单服务
  service-order:
    image: cyi3muz/service-order:0.1.0
    container_name: service-order
    restart: always
    ports:
      - "${ORDER_GRPC_PORT:-9101}:9000"
    volumes:
      - ../logs/order-service:/app/logs
    environment:
      - CONSUL_ADDR=consul:8500
      - CONSUL_PATHS=/develop/common,/develop/cyi-app/service/order
      - SERVICE_ENV=dev
    networks:
      - cyi-network

  # Product 商品服务
  service-product:
    image: cyi3muz/service-product:0.1.0
    container_name: service-product
    restart: always
    ports:
      - "${PRODUCT_GRPC_PORT:-9102}:9000"
    volumes:
      - ../logs/product-service:/app/logs
    environment:
      - CONSUL_ADDR=consul:8500
      - CONSUL_PATHS=/develop/common,/develop/cyi-app/service/product
      - SERVICE_ENV=dev
    networks:
      - cyi-network

  # Marketing 营销服务
  service-marketing:
    image: cyi3muz/service-marketing:0.1.0
    container_name: service-marketing
    restart: always
    ports:
      - "${MARKETING_GRPC_PORT:-9103}:9000"
    volumes:
      - ../logs/marketing-service:/app/logs
    environment:
      - CONSUL_ADDR=consul:8500
      - CONSUL_PATHS=/develop/common,/develop/cyi-app/service/marketing
      - SERVICE_ENV=dev
    networks:
      - cyi-network

  # NATS 消费者服务
  service-nats-consumer:
    image: cyi3muz/nats-consumer:0.1.0
    container_name: service-nats-consumer
    restart: always
    volumes:
      - ../logs/nats-consumer:/app/logs
    environment:
      - CONSUL_ADDR=consul:8500
      - CONSUL_PATHS=/develop/common,/develop/cyi-app/nats
      - SERVICE_ENV=dev
    networks:
      - cyi-network

  # Nginx 反向代理 - 前端静态文件托管 + API 反向代理
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    restart: always
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ../nginx/cyi-app.conf:/etc/nginx/conf.d/cyi-app.conf:ro
      - ../../web/admin/dist:/usr/share/nginx/html/admin:ro
      - ../../web/cyi-mall/dist:/usr/share/nginx/html/mall:ro
    depends_on:
      - service-admin
      - service-interface
    networks:
      - cyi-network

networks:
  cyi-network:
    external: true
    name: cyi-network
