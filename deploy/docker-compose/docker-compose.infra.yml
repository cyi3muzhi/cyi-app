  # Prometheus 服务 - 用于监控数据采集
  prometheus:
    image: prom/prometheus:v2.43.0
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - cyi-network
    depends_on:
      - nats-exporter

  # NATS Exporter - 将 NATS 监控指标转为 Prometheus 格式
  nats-exporter:
    image: natsio/prometheus-nats-exporter:latest
    container_name: nats-exporter
    restart: always
    entrypoint:
      - /prometheus-nats-exporter
    command:
      - -connz
      - -routez
      - -subz
      - -jsz=all
      - http://nats:8222
    ports:
      - "${NATS_EXPORTER_PORT}:7777"
    networks:
