volumes:
  # Consul数据卷
  consul-data:
    driver: local
  consul-config:
    driver: local
  # Redis数据卷
  redis_data:
    driver: local
  # MySQL数据卷
  mysql_data:
    driver: local
  # RustFS数据卷
  rustfs_data:
    driver: local
  # 日志目录
  rustfs_logs:
    driver: local
  # Elasticsearch 数据卷
  es_data:
    driver: local
  # Logstash 配置卷
  logstash_config:
    driver: local
  # Kibana 配置卷
  kibana_config:
    driver: local
  # Filebeat数据卷
  filebeat_data:
    driver: local
  # Jaeger数据卷
  jaeger_data:
    driver: local
  # Jaeger临时数据卷
  jaeger_tmp:
    driver: local
  # Prometheus数据卷
  prometheus_data:
    driver: local
  # Grafana数据卷
  grafana_data:
    driver: local
  # RabbitMQ数据卷
  rabbitmq_data:
    driver: local

services:
  # Consul服务 - 用于服务发现和配置管理
  consul:
    image: hashicorp/consul:1.22
    container_name: consul
    restart: always
    volumes:
      - consul-data:/consul/data
      - consul-config:/consul/config
    ports:
      - "${CONSUL_PORT}:8500"  # HTTP API端口
      - "8600:8600/udp"  # DNS端口
      - "8300:8300"  # 服务器RPC端口
    environment:
      - CONSUL_UI=true  # 启用Web UI
      - "CONSUL_LOCAL_CONFIG={\"server_rejoin_age_max\": \"8760h\"}"
    command: >
      consul agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -bind=0.0.0.0
      -data-dir=/consul/data -config-dir=/consul/config
    networks:
      - cyi-network

  # Redis服务 - 用于缓存和向量搜索（RAG）
  redis:
    image: redis/redis-stack-server:7.2.0-v10
    container_name: redis
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT}:6379"
    environment:
      - REDIS_PASSWORD=redis0411  # 设置Redis密码
      - REDIS_MAXMEMORY=1gb  # 设置最大内存使用
      - REDIS_MAXMEMORY_POLICY=allkeys-lru  # 内存不足时的淘汰策略
    networks:
      - cyi-network

  # RabbitMQ服务 - 用于消息队列（暂不部署，需要时取消注释）
  # rabbitmq:
  #   image: rabbitmq:4.3.0-management
  #   container_name: rabbitmq
  #   restart: always
  #   volumes:
  #     - rabbitmq_data:/var/lib/rabbitmq
  #   ports:
  #     - "${RABBITMQ_PORT}:5672"      # AMQP协议端口（应用连接）
  #     - "${RABBITMQ_MANAGEMENT_PORT}:15672"  # Web管理界面端口
  #   environment:
  #     - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}      # 默认用户名
  #     - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-admin}  # 默认密码
  #     - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-/}        # 默认虚拟主机
  #   healthcheck:
  #     test: rabbitmq-diagnostics -q ping
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #   networks:
  #     - cyi-network

  # NATS服务 - 用于事件驱动消息总线
  nats:
    image: nats:2.11
    container_name: nats
    restart: always
    ports:
      - "${NATS_PORT}:4222"       # 客户端连接端口
      - "${NATS_HTTP_PORT}:8222"  # HTTP监控端口
    command:
      - -js
      - -m
      - "8222"  # 启用HTTP监控端口
    networks:
      - cyi-network

  # MySQL服务 - 用于数据库存储
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
      # 可选：挂载初始化脚本目录
      # - ./mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=mysql0411  # 设置root密码
      - MYSQL_DATABASE=cin_test  # 创建默认数据库
      # - MYSQL_USER=app_user  # 创建普通用户
      # - MYSQL_PASSWORD=app_password  # 设置普通用户密码
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - cyi-network

  # Jaeger服务 - 用于分布式追踪
  jaeger:
    image: jaegertracing/all-in-one:1.49
    container_name: jaeger
    restart: always
    ports:
      - "${JAEGER_UI_PORT}:16686"  # Jaeger UI端口
      - "${JAEGER_HTTP_PORT}:14268"  # Jaeger收集器端口（HTTP）
      - "${JAEGER_GRPC_PORT}:14250"  # Jaeger收集器端口（gRPC）
      - "${JAEGER_THRIFT_BINARY_PORT}:6831/udp"  # Jaeger Thrift 二进制端口
      - "${JAEGER_THRIFT_COMPACT_PORT}:6832/udp"  # Jaeger Thrift 压缩端口
      - "${JAEGER_OTLP_GRPC_PORT}:4318"  # OTLP gRPC端口
      - "${JAEGER_OTLP_HTTP_PORT}:4317"  # OTLP HTTP端口
    environment:
      - COLLECTOR_OTLP_ENABLED=true  # 启用OTLP收集器
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411  # 启用Zipkin收集器
    volumes:
      - jaeger_tmp:/tmp
      - jaeger_data:/jaeger/tmp
    command:
      - --log-level=info
    networks:
      - cyi-network

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    ports:
      - "${RUSTFS_API_PORT}:9000"  # S3 API端口
      - "${RUSTFS_WEB_PORT}:9001"  # Web控制台端口
    volumes:
      - rustfs_data:/data  # 数据存储目录
      - rustfs_logs:/logs  # 日志目录
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_REGION=us-east-1
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
    restart: always
    networks:
      - cyi-network

