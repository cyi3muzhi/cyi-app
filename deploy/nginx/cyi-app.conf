# ====================================================================
# Nginx 配置文件 - CYI-APP 前端反向代理（Docker 版）
#
# 部署方式：作为 Docker 容器运行，在 docker-compose.app.yml 中定义
#   容器名：nginx
#   端口：80
#   配置文件挂载：/etc/nginx/conf.d/cyi-app.conf
#   前端文件挂载：
#     /usr/share/nginx/html/admin  ← web/admin/dist
#     /usr/share/nginx/html/mall   ← web/cyi-mall/dist
#
# 域名说明（通过 hosts 文件解析，仅本地开发测试用）：
#   admin.cyi.local  → 管理后台前端 + 代理 Admin BFF (容器名 service-admin)
#   mall.cyi.local   → 用户端商城前端 + 代理 Interface 服务 (容器名 service-cin-interface)
#
# hosts 文件配置（在访问端电脑上）：
#   Windows: C:\Windows\System32\drivers\etc\hosts
#   Mac/Linux: /etc/hosts
#   添加：192.168.191.128  admin.cyi.local  mall.cyi.local
# ====================================================================

# ---------- 管理后台 ----------
server {
    listen 80;
    server_name admin.cyi.local;

    # 前端静态文件根目录（Docker 容器内路径，挂载自 web/admin/dist）
    root /usr/share/nginx/html/admin;
    index index.html;

    # 开启 gzip 压缩，提升前端加载速度
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # 前端路由 history 模式支持（Vue Router）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的 JS/CSS 缓存 1 年）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存（确保用户拿到最新版本）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 管理后台 API 反向代理到 Admin BFF 服务
    # 使用 Docker 容器名访问（同一 docker 网络），端口是容器内部端口
    location /api/ {
        proxy_pass http://service-admin:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE/WebSocket 支持（AI 对话、实时推送用）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE 必须关闭缓冲，否则流式输出会被卡住
        proxy_buffering off;
        proxy_cache off;

        # AI 对话可能耗时较长，超时设为 5 分钟
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ---------- 用户端商城 ----------
server {
    listen 80;
    server_name mall.cyi.local;

    # 用户端前端静态文件（Docker 容器内路径，挂载自 web/cyi-mall/dist）
    root /usr/share/nginx/html/mall;
    index index.html;

    # 开启 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # 前端路由 history 模式支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 用户端 API 反向代理到 Interface 服务
    # 使用 Docker 容器名访问（同一 docker 网络），端口是容器内部端口
    location /api/ {
        proxy_pass http://service-cin-interface:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE/WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE 流式输出支持
        proxy_buffering off;
        proxy_cache off;

        # 超时设置
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
