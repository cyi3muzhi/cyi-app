volumes:
  # Consul数据卷
  consul-data-v1:
    driver: local
  consul-config-v1:
    driver: local
  # Redis数据卷
  redis_data:
    driver: local
  # MySQL数据卷
  mysql_data:
    driver: local

services:
  # Consul服务 - 用于服务发现和配置管理
  consul:
    image: hashicorp/consul:1.22
    container_name: cin_consul
    restart: always
    user: "0:0"
    volumes:
      - consul-data-v1:/consul/data
      - consul-config-v1:/consul/config
    ports:
      - "8500:8500"  # HTTP API端口
      - "8600:8600/udp"  # DNS端口
      - "8300:8300"  # 服务器RPC端口
    # environment:
    #   - CONSUL_BIND_INTERFACE=eth0
    #   - CONSUL_CLIENT_INTERFACE=eth0
    #   - CONSUL_UI=true  # 启用Web UI
    # command:
    #   - agent
    #   - server
    #   - bootstrap-expect=1
    #   - ui
    #   - client=0.0.0.0
    #   - bind=0.0.0.0

  # Redis服务 - 用于缓存
  redis:
    image: redis:7.0.12
    container_name: cin_redis
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=redis0411  # 设置Redis密码
      - REDIS_MAXMEMORY=1gb  # 设置最大内存使用
      - REDIS_MAXMEMORY_POLICY=allkeys-lru  # 内存不足时的淘汰策略
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD:-redis0411}
      - --maxmemory ${REDIS_MAXMEMORY:-1gb}
      - --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      - --appendonly yes  # 启用AOF持久化

  # MySQL服务 - 用于数据库存储
  mysql:
    image: mysql:8.0
    container_name: cin_mysql
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
      # 可选：挂载初始化脚本目录
      # - ./mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=mysql0411  # 设置root密码
      - MYSQL_DATABASE=cin_test  # 创建默认数据库
      # - MYSQL_USER=app_user  # 创建普通用户
      # - MYSQL_PASSWORD=app_password  # 设置普通用户密码
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci