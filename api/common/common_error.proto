syntax = "proto3";

package api.common;

option go_package = "cyi-app/api/common;common";
option java_multiple_files = true;
option java_package = "api.common";
import "errors/errors.proto";

// CommonErrorReason 通用错误码定义
enum CommonErrorReason {
	// 设置缺省错误码
	option (errors.default_code) = 500;
	// 参数校验失败
	BAD_REQUEST = 0 [(errors.code) = 400];
	// 未登录
	UNAUTHORIZED = 1 [(errors.code) = 401];
	// 无权限
	FORBIDDEN = 2 [(errors.code) = 403];
	// 资源不存在
	NOT_FOUND = 3 [(errors.code) = 404];
	// 数据冲突
	CONFLICT = 4 [(errors.code) = 409];
	// 限流
	TOOL_MANY_REQUESTS = 5 [(errors.code) = 429];
	// 系统错误
	INTERNAL_SERVER = 6 [(errors.code) = 500];
	// 上游服务异常
	BAD_GATEWAY = 7 [(errors.code) = 502];
	// 服务暂不可用
	SERVICE_UNAVAILABLE = 8 [(errors.code) = 503];
	// 服务超时
	SERVICE_TIMEOUT = 9 [(errors.code) = 504];
}
