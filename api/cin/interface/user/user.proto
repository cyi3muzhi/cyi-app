syntax = "proto3";

package api.cin.interface.user;

option go_package = "cyi-app/api/cin/interface/user;user";
import "google/api/annotations.proto";

service User {
	// 登录
	rpc Login (LoginRequest) returns (LoginReply){
		option (google.api.http) = {
			post: "user/v1/login"
			body: "*"
		};
	};

	// 注册
	rpc Register (RegisterRequest) returns (RegisterReply){
		option (google.api.http) = {
			post: "user/v1/register"
			body: "*"
		};
	};
}

message LoginRequest {
	string username = 1;
	string password = 2;
}
message LoginReply {
	string token = 1;
}

message RegisterRequest {
	string username = 1;
	string password = 2;
}
message RegisterReply {
	bool success = 1;
}
