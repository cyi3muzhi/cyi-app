syntax = "proto3";

package api.cin.interface.user;

option go_package = "cyi-app/api/cin/interface/user;user";
import "google/api/annotations.proto";
import "validate/validate.proto";

service User {
	// 登录
	rpc Login (LoginRequest) returns (LoginReply){
		option (google.api.http) = {
			post: "user/v1/login"
			body: "*"
		};
	};

	// 注册
	rpc Register (RegisterRequest) returns (RegisterReply){
		option (google.api.http) = {
			post: "user/v1/register"
			body: "*"
		};
	};
	// 获取用户信息
	rpc GetUserInfo (GetUserInfoRequest) returns (GetUserInfoReply){
		option (google.api.http) = {
			get: "user/v1/get/{id}"
		};
	};
}

message LoginRequest {
	string username = 1;
	string password = 2;
}
message LoginReply {
	string token = 1;
	UserInfo info = 2;
	message UserInfo {
		int64 id = 1;
		string username = 2;
		string email = 3;
		string phone = 4;
		int32 sex = 5;
	}
}

message RegisterRequest {
    // 手机号验证（中国大陆手机号示例）
    string phone = 1 [(validate.rules).string = {pattern: "^1[3-9]\\d{9}$"}];
    
    // 密码长度验证
    string password = 2 [(validate.rules).string = {min_len: 6, max_len: 20}];
    
    // 确认密码
    string confirm_password = 3 [(validate.rules).string = {min_len: 6, max_len: 20}];
    
    // 用户名验证
    string username = 4 [(validate.rules).string = {min_len: 2, max_len: 24, pattern: "^[\\w\\p{Han}]+$"}];
}
message RegisterReply {
	bool ok = 1;
}

message GetUserInfoRequest {
	// 用户ID
	int64 id = 1;
}
message GetUserInfoReply {
	// 用户ID
	int64 id = 1;
	// 姓名
	string name = 2;
}
