syntax = "proto3";

package api.cin.interface.v1;

option go_package = "cyi-app/api/cin/interface/v1;v1";
option java_multiple_files = true;
option java_package = "api.cin.interface.v1";
import "errors/errors.proto";


enum CinInterfaceErrorReason {
	/* 
	  	- 400 Bad Request ：参数错误、请求格式错误
		- 401 Unauthorized ：未认证（缺少令牌、令牌无效）
		- 403 Forbidden ：已认证但无权限
		- 404 Not Found ：请求的资源不存在
		- 409 Conflict ：请求冲突（如：用户已存在）
		- 422 Unprocessable Entity ：请求格式正确但语义错误（如：手机号格式正确但已被注册
	*/
	// 设置缺省错误码
	option (errors.default_code) = 400;
	USER_NOT_EXIST = 0 [(errors.code) = 404];
	// 用户已注册
	USER_ALREADY_REGISTERED = 1 [(errors.code) = 409];
	// 用户注册失败
	USER_REGISTER_FAILED = 2 [(errors.code) = 400];
	// 用户不存在
	USER_NOT_FOUND = 3 [(errors.code) = 404];
	// 密码错误
	PASSWORD_ERROR = 4 [(errors.code) = 400];

}