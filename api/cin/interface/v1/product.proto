syntax = "proto3";

package api.cin.interface.v1;

option go_package = "cyi-app/api/cin/interface/v1;v1";
option java_multiple_files = true;
option java_package = "api.cin.interface.v1";

import "validate/validate.proto";
import "google/api/annotations.proto";

// 商品服务
service Product {
  // 创建商品
  rpc CreateProduct (CreateProductRequest) returns (CreateProductReply) {
    option (google.api.http) = {
      post: "/product/v1/create"
      body: "*"
    };
  }
  // 更新商品
  rpc UpdateProduct (UpdateProductRequest) returns (UpdateProductReply) {
    option (google.api.http) = {
      put: "/product/v1/update"
      body: "*"
    };
  }
  // 商品列表
  rpc ListProduct (ListProductRequest) returns (ListProductReply) {
    option (google.api.http) = {
      get: "/product/v1/list"
    };
  }
  // 搜索联想（输入关键词时返回商品名建议）
  // 注意：必须声明在 GetProduct（/product/v1/{id}）之前，
  // 否则静态路径 suggest 会被 {id} 参数路由抢先匹配导致解析失败
  rpc SuggestProduct (SuggestProductRequest) returns (SuggestProductReply) {
    option (google.api.http) = {
      get: "/product/v1/suggest"
    };
  }
  // 商品详情
  rpc GetProduct (GetProductRequest) returns (GetProductReply) {
    option (google.api.http) = {
      get: "/product/v1/{id}"
    };
  }
}

message CreateProductRequest {
  string name = 1 [(validate.rules).string = {min_len: 2, max_len: 64}];
  string description = 2 [(validate.rules).string = {max_len: 256}];
  int64 price = 3 [(validate.rules).int64 = {gte: 0}];
}

message CreateProductReply {
  int64 product_id = 1 [(validate.rules).int64 = {gt: 0}];
}

message UpdateProductRequest {
  int64 product_id = 1 [(validate.rules).int64 = {gt: 0}];
  string name = 2 [(validate.rules).string = {min_len: 2, max_len: 64}];
  string description = 3 [(validate.rules).string = {max_len: 256}];
  int64 price = 4 [(validate.rules).int64 = {gte: 0}];
}

message UpdateProductReply {
  bool success = 1;
}

message ListProductRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  string category = 4;
}

message ListProductReply {
  repeated ProductItem items = 1;
  int32 total = 2;
}

message ProductItem {
  int64 id = 1;
  string name = 2;
  string description = 3;
  int64 price = 4;
  int32 stock = 5;
  string category = 6;
  string status = 7;
  string image = 8;
  int32 sales = 9;
  int64 category_id = 10;
  repeated string images = 11;
  repeated SpecGroupInfo specs = 12;
  repeated SkuInfo skus = 13;
}

message SpecGroupInfo {
  int64 id = 1;
  string name = 2;
  repeated string values = 3;
}

message SkuInfo {
  int64 id = 1;
  string sku_code = 2;
  int64 price = 3;
  int32 stock = 4;
  int32 sales = 5;
  map<string, string> spec = 6;
  string image = 7;
}

message GetProductRequest {
  int64 id = 1;
}

message GetProductReply {
  ProductItem product = 1;
}

// 搜索联想请求
message SuggestProductRequest {
  string keyword = 1;  // 联想关键词
  int32 limit = 2;     // 返回条数上限（默认 8，最大 20）
}

// 搜索联想响应
message SuggestProductReply {
  repeated string items = 1;  // 商品名称列表
}
