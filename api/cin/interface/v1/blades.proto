syntax = "proto3";

package api.cin.interface.v1;

option go_package = "cyi-app/api/cin/interface/v1;v1";
option java_multiple_files = true;
option java_package = "api.cin.interface.v1";

import "validate/validate.proto";
import "google/api/annotations.proto";

// AI 智能助手服务
service Blades {
  // AI 聊天
  rpc AiChat (AiChatRequest) returns (AiChatReply) {
    option (google.api.http) = {
      post: "/ai/v1/chat"
      body: "*"
    };
  }
}

// AiChatRequest AI 聊天请求
message AiChatRequest {
  // 用户输入的聊天内容
  string message = 1 [(validate.rules).string = {min_len: 1, max_len: 500}];
  // 会话 ID（用于多轮连续对话，首次对话可传空）
  string session_id = 2;
}

// AiChatReply AI 聊天响应
message AiChatReply {
  // AI 智能助手的回复内容
  string message = 1;
}
