syntax = "proto3";

package api.cin.interface.v1;

option go_package = "cyi-app/api/cin/interface/v1;v1";
option java_multiple_files = true;
option java_package = "api.cin.interface.v1";

import "validate/validate.proto";
import "google/api/annotations.proto";

service UserCoupon {
  // 用户领取优惠券
  rpc ClaimCoupon (ClaimCouponRequest) returns (ClaimCouponReply) {
    option (google.api.http) = {
      post: "/api/v1/coupons/{coupon_id}/claim"
      body: "*"
    };
  }
  // 我的优惠券列表
  rpc ListMyCoupons (ListMyCouponsRequest) returns (ListMyCouponsReply) {
    option (google.api.http) = {
      get: "/api/v1/coupons/my"
    };
  }
}

message ClaimCouponRequest {
  int64 coupon_id = 1 [(validate.rules).int64 = {gt: 0}];
  string source = 2;
}

message ClaimCouponReply {
  int64 record_id = 1;
}

message ListMyCouponsRequest {
  int32 status = 1; // 0=全部 1=未使用 2=已使用 3=已过期
  int32 page = 2;
  int32 page_size = 3;
}

message MyCouponItem {
  int64 record_id = 1;
  int64 coupon_id = 2;
  string name = 3;
  int32 type = 4;
  int64 value = 5;
  int64 min_amount = 6;
  string valid_start = 7;
  string valid_end = 8;
  int32 record_status = 9; // 0=未使用 1=已使用 2=已过期
  int64 used_time = 10;
  int64 order_id = 11;
  string source = 12;
  string create_time = 13;
}

message ListMyCouponsReply {
  repeated MyCouponItem items = 1;
  int32 total = 2;
}
