syntax = "proto3";

package api.cin.interface.v1;

option go_package = "cyi-app/api/cin/interface/v1;v1";
option java_multiple_files = true;
option java_package = "api.cin.interface.v1";

import "validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// 用户信息服务
service User {
  // 获取个人信息
  rpc GetMyInfo (google.protobuf.Empty) returns (GetMyInfoReply) {
    option (google.api.http) = {
      get: "/user/v1/my_info"
    };
  }
  // 更新用户信息
  rpc UpdateUserInfo (UpdateUserInfoRequest) returns (UpdateUserInfoReply) {
    option (google.api.http) = {
      put: "/user/v1/update"
      body: "*"
    };
  }
  // 修改密码
  rpc ChangePassword (ChangePasswordRequest) returns (ChangePasswordReply) {
    option (google.api.http) = {
      post: "/user/v1/change_password"
      body: "*"
    };
  }
  // 个人中心概览（用户信息 + 订单/优惠券统计）
  rpc GetUserCenter (google.protobuf.Empty) returns (GetUserCenterReply) {
    option (google.api.http) = {
      get: "/user/v1/center"
    };
  }
  // 收货地址列表
  rpc ListAddress (google.protobuf.Empty) returns (ListAddressReply) {
    option (google.api.http) = {
      get: "/user/v1/address/list"
    };
  }
  // 获取用户信息（带路径参数，需注册在静态路由之后避免抢占）
  rpc GetUserInfo (GetUserInfoRequest) returns (GetUserInfoReply) {
    option (google.api.http) = {
      get: "/user/v1/{id}"
    };
  }
  // 新增收货地址
  rpc CreateAddress (CreateAddressRequest) returns (CreateAddressReply) {
    option (google.api.http) = {
      post: "/user/v1/address/create"
      body: "*"
    };
  }
  // 更新收货地址
  rpc UpdateAddress (UpdateAddressRequest) returns (UpdateAddressReply) {
    option (google.api.http) = {
      put: "/user/v1/address/update"
      body: "*"
    };
  }
  // 删除收货地址
  rpc DeleteAddress (DeleteAddressRequest) returns (DeleteAddressReply) {
    option (google.api.http) = {
      delete: "/user/v1/address/{id}"
    };
  }
  // 设置默认收货地址
  rpc SetDefaultAddress (SetDefaultAddressRequest) returns (SetDefaultAddressReply) {
    option (google.api.http) = {
      post: "/user/v1/address/{id}/default"
      body: "*"
    };
  }
}

message GetUserInfoRequest {
  int64 id = 1;
}

message GetUserInfoReply {
  int64 id = 1;
  string nickname = 2;
  string avatar = 3;
  string phone = 4;
}

message GetMyInfoReply {
  int64 id = 1;
  string username = 2;
  string nickname = 3;
  string avatar = 4;
  string phone = 5;
  int32 gender = 6;
  string email = 7;
  string birthday = 8; // YYYY-MM-DD
  string level = 9; // 会员等级 regular/gold/diamond
  int64 growth_value = 10; // 成长值
  int64 created_at = 11; // 注册时间（Unix 秒）
}

message UpdateUserInfoRequest {
  int64 id = 1;
  string nickname = 2 [(validate.rules).string = {min_len: 2, max_len: 24, pattern: "^[\\w\\p{Han}]+$"}];
  string avatar = 3 [(validate.rules).string = {uri: true, ignore_empty: true}];
  string email = 4;
  int32 gender = 5; // 0=未知 1=男 2=女
  string birthday = 6; // YYYY-MM-DD
}

message UpdateUserInfoReply {
  bool success = 1;
}

// ========== 修改密码 ==========
message ChangePasswordRequest {
  string old_password = 1 [(validate.rules).string = {min_len: 6, max_len: 32}];
  string new_password = 2 [(validate.rules).string = {min_len: 6, max_len: 32}];
}
message ChangePasswordReply {
  bool success = 1;
}

// ========== 收货地址 ==========
message AddressItem {
  int64 id = 1;
  string receiver = 2; // 收货人姓名
  string phone = 3; // 收货人手机号
  string province = 4; // 省份
  string city = 5; // 城市
  string district = 6; // 区县
  string detail = 7; // 详细地址
  int32 is_default = 8; // 是否默认地址 0=否 1=是
  int64 create_time = 9;
}

message ListAddressReply {
  repeated AddressItem items = 1;
}

message CreateAddressRequest {
  string receiver = 1 [(validate.rules).string = {min_len: 2, max_len: 32}];
  string phone = 2 [(validate.rules).string = {min_len: 6, max_len: 20}];
  string province = 3;
  string city = 4;
  string district = 5;
  string detail = 6 [(validate.rules).string = {min_len: 2, max_len: 255}];
  int32 is_default = 7; // 1=设为默认地址
}
message CreateAddressReply {
  int64 id = 1;
}

message UpdateAddressRequest {
  int64 id = 1 [(validate.rules).int64 = {gt: 0}];
  string receiver = 2;
  string phone = 3;
  string province = 4;
  string city = 5;
  string district = 6;
  string detail = 7;
  int32 is_default = 8;
}
message UpdateAddressReply {
  bool success = 1;
}

message DeleteAddressRequest {
  int64 id = 1 [(validate.rules).int64 = {gt: 0}];
}
message DeleteAddressReply {
  bool success = 1;
}

message SetDefaultAddressRequest {
  int64 id = 1 [(validate.rules).int64 = {gt: 0}];
}
message SetDefaultAddressReply {
  bool success = 1;
}

// ========== 个人中心概览 ==========
message UserCenterStats {
  int64 total_orders = 1; // 总订单数
  int64 pending_pay = 2; // 待付款
  int64 pending_ship = 3; // 待发货
  int64 pending_receive = 4; // 待收货
  int64 pending_review = 5; // 待评价（已完成）
  int64 refund_count = 6; // 退款/售后
  int64 coupon_count = 7; // 可用优惠券数
  int64 total_spent = 8; // 累计消费（分）
}

message GetUserCenterReply {
  GetMyInfoReply user = 1;
  UserCenterStats stats = 2;
}
