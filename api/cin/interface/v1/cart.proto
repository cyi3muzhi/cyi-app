syntax = "proto3";

package api.cin.interface.v1;

option go_package = "cyi-app/api/cin/interface/v1;v1";
option java_multiple_files = true;
option java_package = "api.cin.interface.v1";

import "validate/validate.proto";
import "google/api/annotations.proto";

// 购物车服务
service Cart {
  // 加入购物车（同商品自动累加数量）
  rpc AddCartItem (AddCartItemRequest) returns (AddCartItemReply) {
    option (google.api.http) = {
      post: "/cart/v1/add"
      body: "*"
    };
  }
  // 获取购物车
  rpc GetCart (GetCartRequest) returns (GetCartReply) {
    option (google.api.http) = {
      get: "/cart/v1/info"
    };
  }
  // 修改购物车商品数量
  rpc UpdateCartItem (UpdateCartItemRequest) returns (UpdateCartItemReply) {
    option (google.api.http) = {
      put: "/cart/v1/item"
      body: "*"
    };
  }
  // 选中/取消选中单个商品
  rpc ToggleCartItem (ToggleCartItemRequest) returns (ToggleCartItemReply) {
    option (google.api.http) = {
      put: "/cart/v1/item/select"
      body: "*"
    };
  }
  // 全选/取消全选
  rpc SelectAllCart (SelectAllCartRequest) returns (SelectAllCartReply) {
    option (google.api.http) = {
      put: "/cart/v1/select_all"
      body: "*"
    };
  }
  // 删除购物车商品
  rpc DeleteCartItem (DeleteCartItemRequest) returns (DeleteCartItemReply) {
    option (google.api.http) = {
      delete: "/cart/v1/item/{product_id}"
    };
  }
  // 清空购物车
  rpc ClearCart (ClearCartRequest) returns (ClearCartReply) {
    option (google.api.http) = {
      delete: "/cart/v1/clear"
    };
  }
}

// AddCartItemRequest 加入购物车请求
message AddCartItemRequest {
  // 商品 ID
  int64 product_id = 1 [(validate.rules).int64 = {gt: 0}];
  // 加入数量
  int32 quantity = 2 [(validate.rules).int32 = {gt: 0}];
  int64 sku_id = 3; // SKU ID（0 表示取商品默认 SKU）
}

// AddCartItemReply 加入购物车响应
message AddCartItemReply {
  // 是否成功
  bool success = 1;
}

// GetCartRequest 获取购物车请求
message GetCartRequest {}

// GetCartReply 获取购物车响应
message GetCartReply {
  // 购物车商品列表
  repeated CartProductItem items = 1;
}

// UpdateCartItemRequest 修改购物车商品数量请求
message UpdateCartItemRequest {
  // 商品 ID
  int64 product_id = 1 [(validate.rules).int64 = {gt: 0}];
  // 修改后的数量
  int32 quantity = 2 [(validate.rules).int32 = {gt: 0}];
  int64 sku_id = 3; // SKU ID（0 表示取商品默认 SKU）
}

// UpdateCartItemReply 修改购物车商品数量响应
message UpdateCartItemReply {
  // 是否成功
  bool success = 1;
}

// ToggleCartItemRequest 选中/取消选中单个商品请求
message ToggleCartItemRequest {
  // 商品 ID
  int64 product_id = 1 [(validate.rules).int64 = {gt: 0}];
  // 是否选中
  bool selected = 2;
  int64 sku_id = 3; // SKU ID（0 表示商品默认 SKU）
}

// ToggleCartItemReply 选中/取消选中单个商品响应
message ToggleCartItemReply {
  // 是否成功
  bool success = 1;
}

// SelectAllCartRequest 全选/取消全选请求
message SelectAllCartRequest {
  // 是否全选
  bool selected = 1;
}

// SelectAllCartReply 全选/取消全选响应
message SelectAllCartReply {
  // 是否成功
  bool success = 1;
}

// DeleteCartItemRequest 删除购物车商品请求
message DeleteCartItemRequest {
  // 商品 ID
  int64 product_id = 1 [(validate.rules).int64 = {gt: 0}];
  int64 sku_id = 2; // SKU ID（0 表示商品默认 SKU，query 参数）
}

// DeleteCartItemReply 删除购物车商品响应
message DeleteCartItemReply {
  // 是否成功
  bool success = 1;
}

// ClearCartRequest 清空购物车请求
message ClearCartRequest {}

// ClearCartReply 清空购物车响应
message ClearCartReply {
  // 是否成功
  bool success = 1;
}

// CartProductItem 购物车商品项
message CartProductItem {
  int64 product_id = 1;   // 商品ID
  string name = 2;        // 商品名称
  int64 price = 3;        // 价格（单位：分）
  int32 quantity = 4;     // 购买数量
  string image = 5;       // 商品主图
  int32 stock = 6;        // 可用库存
  bool selected = 7;      // 是否选中
  string sku = 8;         // 规格描述
  int32 status = 9;       // 商品状态 0-下架 1-上架
  int64 sku_id = 10;      // SKU ID（0 表示商品默认 SKU）
}
