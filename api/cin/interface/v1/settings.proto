syntax = "proto3";

package api.cin.interface.v1;

option go_package = "cyi-app/api/cin/interface/v1;v1";
option java_multiple_files = true;
option java_package = "api.cin.interface.v1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// 公开配置服务
service Settings {
  // 获取公开配置（商城名称、联系方式等）
  rpc GetPublicSettings (google.protobuf.Empty) returns (PublicSettingsReply) {
    option (google.api.http) = {
      get: "/settings/v1/public"
    };
  }
}

// PublicSettingsReply 公开配置响应
message PublicSettingsReply {
  // 商城名称
  string shop_name = 1;
  // 商城简介
  string shop_description = 2;
  // 联系电话
  string contact_phone = 3;
  // 联系邮箱
  string contact_email = 4;
  // ICP 备案号
  string icp_record = 5;
  repeated string hot_keywords = 6;  // 热门搜索词（用户端搜索框联想展示）
}
