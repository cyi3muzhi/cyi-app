syntax = "proto3";

package api.cin.interface.v1;

option go_package = "cyi-app/api/cin/interface/v1;v1";
option java_multiple_files = true;
option java_package = "api.cin.interface.v1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// 公开配置服务
service Settings {
  // 获取公开配置（商城名称、联系方式等）
  rpc GetPublicSettings (google.protobuf.Empty) returns (PublicSettingsReply) {
    option (google.api.http) = {
      get: "/settings/v1/public"
    };
  }
}

message PublicSettingsReply {
  string shop_name = 1;
  string shop_description = 2;
  string contact_phone = 3;
  string contact_email = 4;
  string icp_record = 5;
}
