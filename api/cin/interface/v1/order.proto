syntax = "proto3";

package api.cin.interface.v1;

option go_package = "cyi-app/api/cin/interface/v1;v1";
option java_multiple_files = true;
option java_package = "api.cin.interface.v1";

import "validate/validate.proto";
import "google/api/annotations.proto";

// 订单服务
service Order {
  // 下单
  rpc PlaceOrder (PlaceOrderRequest) returns (PlaceOrderReply) {
    option (google.api.http) = {
      post: "/order/v1/create"
      body: "*"
    };
  }
  // 支付订单
  rpc PayOrder (PayOrderRequest) returns (PayOrderReply) {
    option (google.api.http) = {
      post: "/order/v1/pay"
      body: "*"
    };
  }
  // 购物车结算
  rpc CartCheckout (CartCheckoutRequest) returns (CartCheckoutReply) {
    option (google.api.http) = {
      post: "/order/v1/cart_checkout"
      body: "*"
    };
  }
  // 订单列表
  rpc ListOrder (ListOrderRequest) returns (ListOrderReply) {
    option (google.api.http) = {
      get: "/order/v1/list"
    };
  }
  // 申请退款（仅已支付/待发货订单）
  // 注意：必须放在 GetOrder 之前注册，避免 /refund/apply 被 {order_id} 通配匹配
  rpc ApplyRefund (ApplyRefundRequest) returns (ApplyRefundReply) {
    option (google.api.http) = {
      post: "/order/v1/refund/apply"
      body: "*"
    };
  }
  // 我的退款记录
  // 注意：必须放在 GetOrder 之前注册，避免 /refunds 被 {order_id} 通配匹配
  rpc ListRefund (ListRefundRequest) returns (ListRefundReply) {
    option (google.api.http) = {
      get: "/order/v1/refunds"
    };
  }
  // 订单详情
  rpc GetOrder (GetOrderRequest) returns (GetOrderReply) {
    option (google.api.http) = {
      get: "/order/v1/{order_id}"
    };
  }
  // 确认收货
  rpc ReceiveOrder (ReceiveOrderRequest) returns (ReceiveOrderReply) {
    option (google.api.http) = {
      post: "/order/v1/receive"
      body: "*"
    };
  }
  // 取消订单
  rpc CancelOrder (CancelOrderRequest) returns (CancelOrderReply) {
    option (google.api.http) = {
      post: "/order/v1/cancel"
      body: "*"
    };
  }
  // 查询物流轨迹（当前登录用户订单，发货后展示）
  rpc GetLogistics (GetLogisticsRequest) returns (GetLogisticsReply) {
    option (google.api.http) = {
      get: "/order/v1/{order_id}/logistics"
    };
  }
}

// PlaceOrderRequest 下单请求
message PlaceOrderRequest {
  // 商品 ID
  int64 product_id = 1 [(validate.rules).int64 = {gt: 0}];
  // 购买数量
  int32 count = 2 [(validate.rules).int32 = {gt: 0}];
  int64 sku_id = 3; // SKU ID（多SKU商品必传）
}

// PlaceOrderReply 下单响应
message PlaceOrderReply {
  // 订单 ID
  int64 order_id = 1 [(validate.rules).int64 = {gt: 0}];
}

// PayOrderRequest 支付订单请求
message PayOrderRequest {
  // 订单 ID
  int64 order_id = 1 [(validate.rules).int64 = {gt: 0}];
}

// PayOrderReply 支付订单响应
message PayOrderReply {
  // 是否支付成功
  bool success = 1;
}

// ReceiveOrderRequest 确认收货请求
message ReceiveOrderRequest {
  // 订单 ID
  int64 order_id = 1 [(validate.rules).int64 = {gt: 0}];
}

// ReceiveOrderReply 确认收货响应
message ReceiveOrderReply {
  // 是否成功
  bool success = 1;
}

// CancelOrderRequest 取消订单请求
message CancelOrderRequest {
  // 订单 ID
  int64 order_id = 1 [(validate.rules).int64 = {gt: 0}];
  string reason = 2; // 取消原因（可选）
}

// CancelOrderReply 取消订单响应
message CancelOrderReply {
  // 是否成功
  bool success = 1;
}

// CartCheckoutRequest 购物车结算请求
message CartCheckoutRequest {
  repeated CartItem items = 1 [(validate.rules).repeated = {min_items: 1}];
  int64 address_id = 2; // 收货地址ID
  string receiver = 3; // 收货人（地址快照）
  string phone = 4; // 手机号（地址快照）
  string address = 5; // 完整收货地址（地址快照）
  int64 freight = 6; // 运费（单位：分，前端计算）
  int64 coupon_id = 7; // 优惠券发放记录ID（0=不使用优惠券）
}

// CartCheckoutReply 购物车结算响应
message CartCheckoutReply {
  // 订单 ID
  int64 order_id = 1;
}

// CartItem 购物车商品项（结算用）
message CartItem {
  // 商品 ID
  int64 product_id = 1 [(validate.rules).int64 = {gt: 0}];
  // 购买数量
  int32 quantity = 2 [(validate.rules).int32 = {gt: 0}];
  int64 sku_id = 3; // SKU ID（多SKU商品必传）
}

// ListOrderRequest 订单列表请求
message ListOrderRequest {
  // 页码
  int32 page = 1;
  // 每页数量
  int32 page_size = 2;
  // 订单状态筛选
  string status = 3;
  // 搜索关键词（订单号/商品名等）
  string keyword = 4;
}

// ListOrderReply 订单列表响应
message ListOrderReply {
  // 订单列表
  repeated OrderItem items = 1;
  // 订单总数
  int32 total = 2;
}

// OrderItem 订单项
message OrderItem {
  // 订单 ID
  int64 id = 1;
  // 订单号
  string order_no = 2;
  // 下单时间
  string created_at = 3;
  // 下单用户
  string user_name = 4;
  // 订单金额（分）
  int64 amount = 5;
  // 支付方式
  string payment = 6;
  // 订单状态（状态码）
  string status = 7;
  // 订单状态文本
  string status_text = 8;
  // 订单商品列表
  repeated OrderProduct products = 9;
  string logistics_company = 10; // 物流公司（发货后）
  string logistics_no = 11; // 快递单号（发货后）
  string receiver = 12; // 收货人
  string phone = 13; // 手机号
  string address = 14; // 完整收货地址
  int64 pay_deadline = 15; // 支付截止时间（Unix 秒，待付款订单为下单时间+30分钟，其余为 0）
}

// OrderProduct 订单商品项
message OrderProduct {
  // 商品名称
  string name = 1;
  // 规格描述
  string spec = 2;
  // 购买数量
  int32 qty = 3;
  // 单价（分）
  int64 price = 4;
  // 商品图片
  string image = 5;
  int64 product_id = 6; // 商品ID（再次购买用）
  int64 sku_id = 7; // SKU ID（再次购买用）
}

// GetOrderRequest 订单详情请求
message GetOrderRequest {
  // 订单 ID
  int64 order_id = 1;
}

// GetOrderReply 订单详情响应
message GetOrderReply {
  // 订单详情
  OrderItem order = 1;
}

// 申请退款请求
message ApplyRefundRequest {
  // 订单 ID
  int64 order_id = 1 [(validate.rules).int64 = {gt: 0}];
  string reason = 2; // 退款原因
}

// 申请退款响应
message ApplyRefundReply {
  // 退款单 ID
  int64 refund_id = 1;
}

// 我的退款记录请求
message ListRefundRequest {
  // 页码
  int32 page = 1;
  // 每页数量
  int32 page_size = 2;
  string status = 3; // 按退款单状态筛选（1-待审核 2-已通过 3-已拒绝；空字符串表示全部）
}

// 我的退款记录响应
message ListRefundReply {
  // 退款记录列表
  repeated RefundItem items = 1;
  // 退款记录总数
  int32 total = 2;
}

// 退款记录项
message RefundItem {
  int64 refund_id = 1; // 退款单ID
  int64 order_id = 2; // 订单ID
  string order_no = 3; // 订单号
  int64 refund_amount = 4; // 退款金额（单位：分）
  string reason = 5; // 退款原因
  int32 status = 6; // 状态: 1-待审核 2-已通过 3-已拒绝
  string status_text = 7; // 状态文本
  string reject_reason = 8; // 拒绝原因
  string created_at = 9; // 申请时间（格式化字符串）
}

// 查询物流轨迹请求
message GetLogisticsRequest {
  // 订单 ID
  int64 order_id = 1 [(validate.rules).int64 = {gt: 0}];
}

// 查询物流轨迹响应
message GetLogisticsReply {
  int64 order_id = 1; // 订单ID
  string logistics_company = 2; // 物流公司
  string logistics_no = 3; // 快递单号
  int64 ship_time = 4; // 发货时间（Unix 秒，0=未发货）
  string ship_time_text = 5; // 发货时间（格式化字符串，0=未发货时为空）
  repeated LogisticsTrace traces = 6; // 轨迹节点（按时间升序）
}

// 物流轨迹节点
message LogisticsTrace {
  int64 time = 1; // 节点时间（Unix 秒）
  string time_text = 2; // 节点时间（格式化字符串）
  string desc = 3; // 节点描述
  int32 status = 4; // 节点状态: 1-已发货 2-运输中 3-派送中 4-已签收
}
