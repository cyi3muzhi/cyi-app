syntax = "proto3";

package api.cin.interface.v1;

option go_package = "cyi-app/api/cin/interface/v1;v1";
option java_multiple_files = true;
option java_package = "api.cin.interface.v1";
import "validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";



service CinInterface {
	// 登录
	rpc Login (LoginRequest) returns (LoginReply){
		option (google.api.http) = {
			post: "/user/v1/login"
			body: "*"
		};
	};

	// 注册
    rpc Register (RegisterReq) returns (RegisterReply) {
        option (google.api.http) = {
            post: "/user/v1/register"
            body: "*"
        };
    }
	// 获取用户信息
	rpc GetUserInfo (GetUserInfoRequest) returns (GetUserInfoReply){
		option (google.api.http) = {
			get: "/user/v1/{id}"
		};
	};
	// 获取个人信息
	rpc GetMyInfo (google.protobuf.Empty) returns (GetMyInfoReply){
		option (google.api.http) = {
			get: "/user/v1/my_info"
		};
	};
	// 更新用户信息
	rpc UpdateUserInfo (UpdateUserInfoRequest) returns (UpdateUserInfoReply){
		option (google.api.http) = {
			put: "/user/v1/update"
			body: "*"
		};
	};

	// 下单
	rpc PlaceOrder (PlaceOrderRequest) returns (PlaceOrderReply){
		option (google.api.http) = {
			post: "/order/v1/create"
			body: "*"
		};
	};

	// 支付订单
	rpc PayOrder (PayOrderRequest) returns (PayOrderReply){
		option (google.api.http) = {
			post: "/order/v1/pay"
			body: "*"
		};
	};

	// 购物车结算
	rpc CartCheckout (CartCheckoutRequest) returns (CartCheckoutReply){
		option (google.api.http) = {
			post: "/order/v1/cart_checkout"
			body: "*"
		};
	};

	// 创建商品
	rpc CreateProduct (CreateProductRequest) returns (CreateProductReply){
		option (google.api.http) = {
			post: "/product/v1/create"
			body: "*"
		};
	};

	// 更新商品
	rpc UpdateProduct (UpdateProductRequest) returns (UpdateProductReply){
		option (google.api.http) = {
			put: "/product/v1/update"
			body: "*"
		};
	};

	// 设置库存
	rpc UpdateStock (UpdateStockRequest) returns (UpdateStockReply){
		option (google.api.http) = {
			put: "/product/v1/stock/update"
			body: "*"
		};
	};

	// AI 聊天
	rpc AiChat (AiChatRequest) returns (AiChatReply){
		option (google.api.http) = {
			post: "/ai/v1/chat"
			body: "*"
		};
	};

}

message PlaceOrderRequest {
	// 商品ID
	int64 product_id = 1 [(validate.rules).int64 = {gt: 0}];
	// 购买数量
	int32 count = 2 [(validate.rules).int32 = {gt: 0}];
}
message PlaceOrderReply {
	// 订单ID
	int64 order_id = 1 [(validate.rules).int64 = {gt: 0}];
}

message PayOrderRequest {
	// 订单ID
	int64 order_id = 1 [(validate.rules).int64 = {gt: 0}];
}
message PayOrderReply {
	bool success = 1;
}

// 购物车商品项
message CartItem {
	int64 product_id = 1 [(validate.rules).int64 = {gt: 0}];
	int32 quantity = 2 [(validate.rules).int32 = {gt: 0}];
}

message CartCheckoutRequest {
	repeated CartItem items = 1 [(validate.rules).repeated = {min_items: 1}];
}
message CartCheckoutReply {
	int64 order_id = 1;
}

message LoginRequest {
	// 用户名或手机号 可以为空
	string username = 1 [(validate.rules).string = {min_len: 2, max_len: 24, pattern: "^[\\w\\p{Han}]+$"}];
	// string phone = 2 [(validate.rules).string = {pattern: "^1[3-9]\\d{9}$"}];
	string password = 3 [(validate.rules).string = {min_len: 6, max_len: 20}];
}
message LoginReply {
	string token = 1;
	// UserInfo info = 2 [(validate.rules).message = {required: true}];
	// message UserInfo {
	// 	int64 id = 1 [(validate.rules).int64 = {gt: 0}];
	// 	string username = 2 [(validate.rules).string = {min_len: 2, max_len: 24, pattern: "^[\\w\\p{Han}]+$"}];
	// 	// string email = 3 [(validate.rules).string = {email: true}];
	// 	string phone = 4 [(validate.rules).string = {pattern: "^1[3-9]\\d{9}$"}];
	// 	// int32 sex = 5 [(validate.rules).int32 = {gte: 0, lte: 2}];
	// }
}

message RegisterReq {
	// 用户名验证
    string username = 1 [(validate.rules).string = {min_len: 2, max_len: 24, pattern: "^[\\w\\p{Han}]+$"}];
    // 密码长度验证
    string password = 2 [(validate.rules).string = {min_len: 6, max_len: 20}];
}
message RegisterReply {
    bool success = 1;
}

message GetUserInfoRequest {
	// 用户ID
	int64 id = 1;
}
message GetUserInfoReply {
	// 用户ID
	int64 id = 1;
	// 姓名
	string name = 2;
}

message GetMyInfoReply{
	// 用户ID
	int64 id = 1;
	// 用户账号
	string username = 2;
}

message UpdateUserInfoRequest{
	// 用户ID
	int64 id = 1;
	// 姓名
	string name = 2 [(validate.rules).string = {min_len: 2, max_len: 24, pattern: "^[\\w\\p{Han}]+$"}];
	// 头像URL
	string avatar = 3 [(validate.rules).string = {uri: true}];
}

message UpdateUserInfoReply{
	bool success = 1;
}

message CreateProductRequest {
	// 商品名称
	string name = 1 [(validate.rules).string = {min_len: 2, max_len: 64}];
	// 商品描述
	string description = 2 [(validate.rules).string = {max_len: 256}];
	// 价格（单位：分）
	int64 price = 3 [(validate.rules).int64 = {gte: 0}];
}
message CreateProductReply {
	// 商品ID
	int64 product_id = 1 [(validate.rules).int64 = {gt: 0}];
}

message UpdateProductRequest {
	// 商品ID
	int64 product_id = 1 [(validate.rules).int64 = {gt: 0}];
	// 商品名称
	string name = 2 [(validate.rules).string = {min_len: 2, max_len: 64}];
	// 商品描述
	string description = 3 [(validate.rules).string = {max_len: 256}];
	// 价格（单位：分）
	int64 price = 4 [(validate.rules).int64 = {gte: 0}];
}
message UpdateProductReply {
	bool success = 1;
}

message UpdateStockRequest {
	// 商品ID
	int64 product_id = 1 [(validate.rules).int64 = {gt: 0}];
	// 总库存数量
	int32 total = 2 [(validate.rules).int32 = {gte: 0}];
}
message UpdateStockReply {
	bool success = 1;
}

message AiChatRequest {
	string message = 1 [(validate.rules).string = {min_len: 1, max_len: 500}];
	string session_id = 2;
}
message AiChatReply {
	string message = 1;
}
