syntax = "proto3";

package api.cin.admin.v1;

option go_package = "cyi-app/api/cin/admin/v1;adminv1";
option java_multiple_files = true;
option java_package = "api.cin.admin.v1";

import "validate/validate.proto";
import "google/api/annotations.proto";

// 管理后台 - 认证服务
service AdminAuth {
  // 管理员登录
  rpc Login (LoginRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/admin/v1/auth/login"
      body: "*"
    };
  }
  // 管理员登出
  rpc Logout (LogoutRequest) returns (LogoutReply) {
    option (google.api.http) = {
      post: "/admin/v1/auth/logout"
      body: "*"
    };
  }
  // 获取当前管理员信息
  rpc GetAdminInfo (GetAdminInfoRequest) returns (GetAdminInfoReply) {
    option (google.api.http) = {
      get: "/admin/v1/auth/info"
    };
  }
  // 更换头像（上传文件到后端，后端代理传到 OSS）
  rpc ChangeAvatar (ChangeAvatarRequest) returns (ChangeAvatarReply) {
    option (google.api.http) = {
      post: "/admin/v1/auth/avatar"
      body: "*"
    };
  }
  // 更新基本信息
  rpc UpdateAdminInfo (UpdateAdminInfoRequest) returns (UpdateAdminInfoReply) {
    option (google.api.http) = {
      put: "/admin/v1/auth/info"
      body: "*"
    };
  }
}

message LoginRequest {
  // 管理员账号
  string username = 1 [(validate.rules).string = {min_len: 2, max_len: 32}];
  // 管理员密码
  string password = 2 [(validate.rules).string = {min_len: 6, max_len: 32}];
}

message LoginReply {
  // 认证令牌
  string token = 1;
  // 管理员信息
  AdminInfo admin = 2;
}

message LogoutRequest {
  // 要登出的 token
  string token = 1;
}

message LogoutReply {
  bool success = 1;
}

message GetAdminInfoRequest {}

message GetAdminInfoReply {
  AdminInfo admin = 1;
}

// 管理员信息
message AdminInfo {
  int64 id = 1;
  string name = 2;
  string username = 3;
  string role = 4;
  string email = 5;
  string phone = 6;
  string department = 7;
  string position = 8;
  string bio = 9;
  string avatar = 10;
  string created_at = 11;
  string last_login = 12;
}

message ChangeAvatarRequest {
  // 头像图片 Base64 编码
  string avatar_base64 = 1 [(validate.rules).string = {min_len: 1, max_len: 5242880}];
}

message ChangeAvatarReply {
  bool success = 1;
  // 头像 URL
  string avatar_url = 2;
}

message UpdateAdminInfoRequest {
  // 姓名
  string name = 1;
  // 邮箱
  string email = 2;
  // 手机号
  string phone = 3;
  // 部门
  string department = 4;
  // 职位
  string position = 5;
  // 个人简介
  string bio = 6;
}

message UpdateAdminInfoReply {
  bool success = 1;
}
