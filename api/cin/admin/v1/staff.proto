syntax = "proto3";

package api.cin.admin.v1;

option go_package = "cyi-app/api/cin/admin/v1;adminv1";
option java_multiple_files = true;
option java_package = "api.cin.admin.v1";

import "google/api/annotations.proto";

// 管理后台 - 员工管理服务
service Staff {
  // 员工列表
  rpc ListStaff (ListStaffRequest) returns (ListStaffReply) {
    option (google.api.http) = {
      get: "/admin/v1/staff"
    };
  }
  // 创建员工
  rpc CreateStaff (CreateStaffRequest) returns (CreateStaffReply) {
    option (google.api.http) = {
      post: "/admin/v1/staff"
      body: "*"
    };
  }
  // 更新员工
  rpc UpdateStaff (UpdateStaffRequest) returns (UpdateStaffReply) {
    option (google.api.http) = {
      put: "/admin/v1/staff/{id}"
      body: "*"
    };
  }
  // 切换员工状态
  rpc ToggleStaffStatus (ToggleStaffStatusRequest) returns (ToggleStaffStatusReply) {
    option (google.api.http) = {
      post: "/admin/v1/staff/{id}/toggle-status"
      body: "*"
    };
  }
  // 获取角色名称映射（无需角色管理权限）
  rpc GetRoleNameMap (GetRoleNameMapRequest) returns (GetRoleNameMapReply) {
    option (google.api.http) = {
      get: "/admin/v1/role-name-map"
    };
  }
}

// StaffInfo 员工信息
message StaffInfo {
  // 员工ID
  int64 id = 1;
  // 姓名
  string name = 2;
  // 登录账号
  string username = 3;
  // 手机号
  string phone = 4;
  // 邮箱
  string email = 5;
  // 角色
  string role = 6;
  // 部门
  string department = 7;
  // 职位
  string position = 8;
  // 个人简介
  string bio = 9;
  // 头像
  string avatar = 10;
  // 状态（1=正常 2=冻结）
  int32 status = 11;
  // 最后登录时间
  string last_login = 12;
  // 创建时间
  string created_at = 13;
}

// ListStaffRequest 员工列表请求
message ListStaffRequest {
  // 页码
  int32 page = 1;
  // 每页数量
  int32 page_size = 2;
  // 搜索关键词
  string keyword = 3;
  // 状态筛选
  string status = 4;
  // 角色筛选
  string role = 5;
}

// ListStaffReply 员工列表响应
message ListStaffReply {
  // 员工列表
  repeated StaffInfo items = 1;
  // 总数
  int32 total = 2;
}

// CreateStaffRequest 创建员工请求
message CreateStaffRequest {
  // 登录账号
  string username = 1;
  // 密码
  string password = 2;
  // 姓名
  string name = 3;
  // 角色
  string role = 4;
  // 邮箱
  string email = 5;
  // 手机号
  string phone = 6;
  // 部门
  string department = 7;
}

// CreateStaffReply 创建员工响应
message CreateStaffReply {
  // 员工ID
  int64 id = 1;
}

// UpdateStaffRequest 更新员工请求
message UpdateStaffRequest {
  // 员工ID
  int64 id = 1;
  // 姓名
  string name = 2;
  // 角色
  string role = 3;
  // 邮箱
  string email = 4;
  // 手机号
  string phone = 5;
  // 部门
  string department = 6;
  // 职位
  string position = 7;
  // 个人简介
  string bio = 8;
}

// UpdateStaffReply 更新员工响应
message UpdateStaffReply {
  // 是否成功
  bool success = 1;
}

// ToggleStaffStatusRequest 切换员工状态请求
message ToggleStaffStatusRequest {
  // 员工ID
  int64 id = 1;
}

// ToggleStaffStatusReply 切换员工状态响应
message ToggleStaffStatusReply {
  // 是否成功
  bool success = 1;
  // 切换后的状态
  int32 new_status = 2;
}

// GetRoleNameMapRequest 获取角色名称映射请求（无入参）
message GetRoleNameMapRequest {}

// GetRoleNameMapReply 获取角色名称映射响应
message GetRoleNameMapReply {
  map<string, string> items = 1; // slug → name
}
