syntax = "proto3";

package api.cin.admin.v1;

option go_package = "cyi-app/api/cin/admin/v1;adminv1";
option java_multiple_files = true;
option java_package = "api.cin.admin.v1";

import "google/api/annotations.proto";

// 管理后台 - 员工管理服务
service Staff {
  // 员工列表
  rpc ListStaff (ListStaffRequest) returns (ListStaffReply) {
    option (google.api.http) = {
      get: "/admin/v1/staff"
    };
  }
  // 创建员工
  rpc CreateStaff (CreateStaffRequest) returns (CreateStaffReply) {
    option (google.api.http) = {
      post: "/admin/v1/staff"
      body: "*"
    };
  }
  // 更新员工
  rpc UpdateStaff (UpdateStaffRequest) returns (UpdateStaffReply) {
    option (google.api.http) = {
      put: "/admin/v1/staff/{id}"
      body: "*"
    };
  }
  // 切换员工状态
  rpc ToggleStaffStatus (ToggleStaffStatusRequest) returns (ToggleStaffStatusReply) {
    option (google.api.http) = {
      post: "/admin/v1/staff/{id}/toggle-status"
      body: "*"
    };
  }
  // 获取角色名称映射（无需角色管理权限）
  rpc GetRoleNameMap (GetRoleNameMapRequest) returns (GetRoleNameMapReply) {
    option (google.api.http) = {
      get: "/admin/v1/role-name-map"
    };
  }
}

message StaffInfo {
  int64 id = 1;
  string name = 2;
  string username = 3;
  string phone = 4;
  string email = 5;
  string role = 6;
  string department = 7;
  string position = 8;
  string bio = 9;
  string avatar = 10;
  int32 status = 11;
  string last_login = 12;
  string created_at = 13;
}

message ListStaffRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  string status = 4;
}

message ListStaffReply {
  repeated StaffInfo items = 1;
  int32 total = 2;
}

message CreateStaffRequest {
  string username = 1;
  string password = 2;
  string name = 3;
  string role = 4;
  string email = 5;
  string phone = 6;
  string department = 7;
}

message CreateStaffReply {
  int64 id = 1;
}

message UpdateStaffRequest {
  int64 id = 1;
  string name = 2;
  string role = 3;
  string email = 4;
  string phone = 5;
  string department = 6;
  string position = 7;
  string bio = 8;
}

message UpdateStaffReply {
  bool success = 1;
}

message ToggleStaffStatusRequest {
  int64 id = 1;
}

message ToggleStaffStatusReply {
  bool success = 1;
  int32 new_status = 2;
}

message GetRoleNameMapRequest {}

message GetRoleNameMapReply {
  map<string, string> items = 1; // slug → name
}
