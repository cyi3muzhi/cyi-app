syntax = "proto3";

package api.cin.admin.v1;

option go_package = "cyi-app/api/cin/admin/v1;adminv1";

import "google/api/annotations.proto";

// 操作日志服务（管理端查询）
// 日志写入由 HTTP 中间件发布 NATS 事件，user 服务订阅落库
service AdminLogs {
  // 分页查询操作日志
  rpc ListOperationLogs (ListOperationLogsRequest) returns (ListOperationLogsReply) {
    option (google.api.http) = {
      get: "/admin/v1/logs"
    };
  }
  // 操作日志统计（今日/近7天/近30天/累计）
  rpc CountOperationLogs (CountOperationLogsRequest) returns (CountOperationLogsReply) {
    option (google.api.http) = {
      get: "/admin/v1/logs/stats"
    };
  }
  // 操作人列表（筛选下拉）
  rpc ListOperationLogOperators (ListOperationLogOperatorsRequest) returns (ListOperationLogOperatorsReply) {
    option (google.api.http) = {
      get: "/admin/v1/logs/operators"
    };
  }
}

// ListOperationLogsRequest 分页查询操作日志请求
message ListOperationLogsRequest {
  // 页码
  int32 page = 1;
  // 每页数量
  int32 page_size = 2;
  string start_date = 3; // 开始日期（2006-01-02）
  string end_date = 4;   // 结束日期（2006-01-02）
  string operator = 5;   // 操作人姓名
  string module = 6;     // 操作模块
  string keyword = 7;    // 关键词（匹配操作内容）
}

// ListOperationLogsReply 分页查询操作日志响应
message ListOperationLogsReply {
  // 操作日志列表
  repeated AdminLogItem items = 1;
  // 总记录数
  int32 total = 2;
}

// AdminLogItem 操作日志条目
message AdminLogItem {
  // 日志 ID
  int64 id = 1;
  string operator = 2;    // 操作人姓名
  string role = 3;        // 角色标识（如 super_admin）
  string module = 4;      // 操作模块
  string action = 5;      // 动作
  string content = 6;     // 操作内容
  string method = 7;      // HTTP 方法
  string path = 8;        // 请求路径
  string ip = 9;          // 来源 IP
  string user_agent = 10; // User-Agent
  int32 result = 11;      // 执行结果：1-成功 0-失败
  int64 created_at = 12;  // 操作时间（Unix 秒）
  string avatar = 13;     // 操作人头像（公开 URL）
}

// CountOperationLogsRequest 操作日志统计请求
message CountOperationLogsRequest {}

// CountOperationLogsReply 操作日志统计响应
message CountOperationLogsReply {
  int64 today = 1;  // 今日操作数
  int64 week = 2;   // 近7天操作数（滚动窗口）
  int64 month = 3;  // 近30天操作数（滚动窗口）
  int64 total = 4;  // 累计操作数
}

// ListOperationLogOperatorsRequest 操作人列表请求
message ListOperationLogOperatorsRequest {}

// ListOperationLogOperatorsReply 操作人列表响应
message ListOperationLogOperatorsReply {
  repeated string operators = 1; // 操作人姓名列表（去重）
}
