syntax = "proto3";

package api.cin.admin.v1;

option go_package = "cyi-app/api/cin/admin/v1;adminv1";
option java_multiple_files = true;
option java_package = "api.cin.admin.v1";

import "validate/validate.proto";
import "google/api/annotations.proto";

// 管理后台 - 订单管理服务
service AdminOrder {
  // 订单列表
  rpc ListOrder (ListOrderRequest) returns (ListOrderReply) {
    option (google.api.http) = {
      get: "/admin/v1/orders"
    };
  }
  // 订单统计（顶部统计卡片数据）
  // 注意：必须放在 GetOrder 之前注册，避免 /stats 被当作 {order_id} 匹配
  rpc OrderStats (OrderStatsRequest) returns (OrderStatsReply) {
    option (google.api.http) = {
      get: "/admin/v1/orders/stats"
    };
  }
  // 导出订单
  // 注意：需要放在 GetOrder 之前，避免 /export 被当作 {order_id} 匹配
  rpc ExportOrder (ExportOrderRequest) returns (ExportOrderReply) {
    option (google.api.http) = {
      get: "/admin/v1/orders/export"
    };
  }
  // 查询导出任务状态
  // 注意：需要放在 GetOrder 之前，避免 /export/{task_id} 中的 export 被当作 {order_id}
  rpc ExportTaskStatus (ExportTaskStatusRequest) returns (ExportTaskStatusReply) {
    option (google.api.http) = {
      get: "/admin/v1/orders/export/{task_id}"
    };
  }
  // 订单详情
  rpc GetOrder (GetOrderRequest) returns (GetOrderReply) {
    option (google.api.http) = {
      get: "/admin/v1/orders/{order_id}"
    };
  }
  // 发货
  rpc ShipOrder (ShipOrderRequest) returns (ShipOrderReply) {
    option (google.api.http) = {
      post: "/admin/v1/orders/{order_id}/ship"
      body: "*"
    };
  }
  // 取消订单
  rpc CancelOrder (CancelOrderRequest) returns (CancelOrderReply) {
    option (google.api.http) = {
      post: "/admin/v1/orders/{order_id}/cancel"
      body: "*"
    };
  }
  // 退款/售后单列表
  rpc ListRefund (ListRefundRequest) returns (ListRefundReply) {
    option (google.api.http) = {
      get: "/admin/v1/refunds"
    };
  }
  // 审核退款（通过/拒绝）
  rpc AuditRefund (AuditRefundRequest) returns (AuditRefundReply) {
    option (google.api.http) = {
      post: "/admin/v1/refunds/{refund_id}/audit"
      body: "*"
    };
  }
  // 查询物流轨迹（发货后展示）
  rpc GetLogistics (GetLogisticsRequest) returns (GetLogisticsReply) {
    option (google.api.http) = {
      get: "/admin/v1/orders/{order_id}/logistics"
    };
  }
}

message ListOrderRequest {
  int32 page = 1;
  int32 page_size = 2;
  string status = 3;
  string keyword = 4;
  string date_from = 5;
  string date_to = 6;
}

message ListOrderReply {
  repeated OrderItem items = 1;
  int32 total = 2;
}

message OrderItem {
  int64 id = 1;
  string order_no = 2;
  string created_at = 3;
  string user_name = 4;
  int64 amount = 5;
  string payment = 6;
  string status = 7;
  string status_text = 8;
  repeated OrderProduct products = 9;
  string logistics_company = 10; // 物流公司（发货后）
  string logistics_no = 11; // 快递单号（发货后）
  string receiver = 12; // 收货人
  string phone = 13; // 手机号
  string address = 14; // 完整收货地址
}

message OrderProduct {
  string name = 1;
  string spec = 2;
  int32 qty = 3;
  int64 price = 4;
  string image = 5; // 商品图片
}

message GetOrderRequest {
  int64 order_id = 1 [(validate.rules).int64 = {gt: 0}];
}

message GetOrderReply {
  OrderItem order = 1;
}

message ShipOrderRequest {
  int64 order_id = 1 [(validate.rules).int64 = {gt: 0}];
  string logistics_company = 2;
  string logistics_no = 3;
}

message ShipOrderReply {
  bool success = 1;
}

message CancelOrderRequest {
  int64 order_id = 1 [(validate.rules).int64 = {gt: 0}];
  string reason = 2;
}

message CancelOrderReply {
  bool success = 1;
}

message ExportOrderRequest {
  string status = 1;
  string date_from = 2;
  string date_to = 3;
}

message ExportOrderReply {
  string task_id = 1; // 异步任务ID，前端用于轮询状态
  ExportStatus status = 2; // 当前状态（初始为 PENDING）
}

// 导出任务状态查询请求
message ExportTaskStatusRequest {
  string task_id = 1 [(validate.rules).string.min_len = 1];
}

// 导出任务状态查询响应
message ExportTaskStatusReply {
  string task_id = 1;
  ExportStatus status = 2; // 任务状态
  string download_url = 3; // 完成后的下载链接（动态生成 presigned URL）
  int64 created_at = 4; // 任务创建时间（Unix秒）
  int64 finished_at = 5; // 任务完成时间（Unix秒）
  string error = 6; // 失败原因
  int32 total_count = 7; // 总订单数（进度展示）
  int32 processed_count = 8; // 已处理订单数
}

// 导出任务状态枚举
enum ExportStatus {
  ExportStatusUnspecified = 0;
  PENDING = 1; // 已入队，等待处理
  PROCESSING = 2; // 处理中
  COMPLETED = 3; // 已完成
  FAILED = 4; // 失败
}

// 订单统计请求（无入参，统计全量数据）
message OrderStatsRequest {}

// 订单统计响应
message OrderStatsReply {
  int32 total_count = 1; // 总订单数
  int32 pending_count = 2; // 待处理数（待支付 + 待发货）
  int32 today_count = 3; // 今日订单数
  int32 refund_count = 4; // 退款/售后数（退款中 + 已退款）
}

// 退款单列表请求
message ListRefundRequest {
  int32 page = 1;
  int32 page_size = 2;
  string status = 3; // 状态筛选（1-待审核 2-已通过 3-已拒绝；空=全部）
  string keyword = 4; // 订单号模糊搜索
}

// 退款单列表响应
message ListRefundReply {
  repeated RefundItem items = 1;
  int32 total = 2;
}

// 退款单项
message RefundItem {
  int64 refund_id = 1; // 退款单ID
  int64 order_id = 2; // 订单ID
  string order_no = 3; // 订单号
  int64 user_id = 4; // 用户ID
  string user_name = 5; // 用户名
  int64 refund_amount = 6; // 退款金额（单位：分）
  string reason = 7; // 退款原因
  int32 status = 8; // 状态: 1-待审核 2-已通过 3-已拒绝
  string status_text = 9; // 状态文本
  string reject_reason = 10; // 拒绝原因
  string auditor = 11; // 审核人
  string created_at = 12; // 申请时间（格式化字符串）
  int32 origin_status = 13; // 申请前的订单状态
}

// 审核退款请求
message AuditRefundRequest {
  int64 refund_id = 1 [(validate.rules).int64 = {gt: 0}];
  bool approve = 2; // true=通过（退款）；false=拒绝
  string reject_reason = 3; // 拒绝原因（approve=false 时必填）
}

// 审核退款响应
message AuditRefundReply {
  bool success = 1;
}

// 查询物流轨迹请求
message GetLogisticsRequest {
  int64 order_id = 1 [(validate.rules).int64 = {gt: 0}];
}

// 查询物流轨迹响应
message GetLogisticsReply {
  int64 order_id = 1; // 订单ID
  string logistics_company = 2; // 物流公司
  string logistics_no = 3; // 快递单号
  int64 ship_time = 4; // 发货时间（Unix 秒，0=未发货）
  string ship_time_text = 5; // 发货时间（格式化字符串，0=未发货时为空）
  repeated LogisticsTrace traces = 6; // 轨迹节点（按时间升序）
}

// 物流轨迹节点
message LogisticsTrace {
  int64 time = 1; // 节点时间（Unix 秒）
  string time_text = 2; // 节点时间（格式化字符串）
  string desc = 3; // 节点描述
  int32 status = 4; // 节点状态: 1-已发货 2-运输中 3-派送中 4-已签收
}
