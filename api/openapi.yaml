openapi: 3.0.0
info:
  title: API Documentation
  version: 1.0.0
paths:
  /blades/v1/chat:
    post:
      summary: Chat
      description: chat 聊天
      responses:
        '200':
          description: Success
  /user/v1/login:
    post:
      summary: Login
      description: 登录
      responses:
        '200':
          description: Success
  /user/v1/register:
    post:
      summary: Register
      description: 注册
      responses:
        '200':
          description: Success
  /user/v1/{id}:
    get:
      summary: GetUserInfo
      description: 获取用户信息
      responses:
        '200':
          description: Success
  /user/v1/info:
    get:
      summary: UserInfo
      description: 获取个人信息
      responses:
        '200':
          description: Success
  /user/v1/update:
    put:
      summary: UpdateUserInfo
      description: 更新用户信息
      responses:
        '200':
          description: Success
  /order/v1/create:
    post:
      summary: CreateOrder
      description: 创建订单
      responses:
        '200':
          description: Success
  /order/v1/pay:
    post:
      summary: PayOrder
      description: 支付订单
      responses:
        '200':
          description: Success
