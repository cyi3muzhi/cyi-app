syntax = "proto3";

package api.err.user;

option go_package = "github.com/cin/cin-app/api/err/user;user";
option java_multiple_files = true;
option java_package = "api.err.user";
import "errors/errors.proto";

enum ErrorReason {
	// 设置缺省错误码
	option (errors.default_code) = 500;

	USER_NOT_FOUND = 0 [(errors.code) = 301];

	CONTENT_MISSING = 1 [(errors.code) = 301];
	// 密码不一致
	PASSWORD_NOT_MATCH = 2 [(errors.code) = 301];
}