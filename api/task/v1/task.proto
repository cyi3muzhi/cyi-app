syntax = "proto3";

package api.task.v1;

option go_package = "cyi-app/api/task/v1;v1";
option java_multiple_files = true;
option java_package = "api.task.v1";

// TaskName 异步任务类型定义
enum TaskName {
	// 创建用户
	create_user = 0 ;
	// 定时统计用户数量
	user_count = 1 ;
	// 批量过期优惠券发放记录
	coupon_expire = 2 ;
}

// CreateUserTask 创建用户任务
message CreateUserTask {
	// 用户名
	string username = 1;
	// 密码
	string password = 2;
}
