syntax = "proto3";

package api.task.v1;

option go_package = "cyi-app/api/task/v1;v1";
option java_multiple_files = true;
option java_package = "api.task.v1";

enum TaskName {
	// 创建用户
	create_user = 0 ;
	// 定时统计用户数量
	user_count = 1 ;
	// 批量过期优惠券发放记录
	coupon_expire = 2 ;
}

message CreateUserTask {
	string username = 1;
	string password = 2;
}