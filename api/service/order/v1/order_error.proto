syntax = "proto3";

package api.service.order.v1;

option go_package = "cyi-app/api/service/order/v1;v1";
import "errors/errors.proto";

enum OrderErrorReason {
	// 设置缺省错误码
	option (errors.default_code) = 500;

	// 订单状态无效
	ORDER_STATUS_INVALID = 0 [(errors.code) = 422];
	// 用户不是订单创建人
	USER_NOT_ORDER = 1 [(errors.code) = 422];
	// 订单不存在
	ORDER_NOT_FOUND = 2 [(errors.code) = 422];
	// 商品不存在或已下架
	PRODUCT_NOT_AVAILABLE = 3 [(errors.code) = 422];
	// 库存不足
	INSUFFICIENT_STOCK = 4 [(errors.code) = 422];
	// 库存操作失败
	STOCK_OPERATION_FAILED = 5 [(errors.code) = 422];
	// 订单商品为空
	ORDER_PRODUCT_EMPTY = 6 [(errors.code) = 422];
	// 退款单不存在
	REFUND_NOT_FOUND = 7 [(errors.code) = 422];
}
