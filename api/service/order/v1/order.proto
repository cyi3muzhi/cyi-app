syntax = "proto3";

package api.service.order.v1;

option go_package = "cyi-app/api/service/order/v1;v1";
option java_multiple_files = true;
option java_package = "api.service.order.v1";

service Order {
	rpc CreateOrder (CreateOrderRequest) returns (CreateOrderReply);
	rpc UpdateOrder (UpdateOrderRequest) returns (UpdateOrderReply);
	rpc DeleteOrder (DeleteOrderRequest) returns (DeleteOrderReply);
	rpc GetOrder (GetOrderRequest) returns (GetOrderReply);
	rpc ListOrder (ListOrderRequest) returns (ListOrderReply);
	// 支付订单
	rpc PayOrder (PayOrderRequest) returns (PayOrderReply);
	// 订单统计（按状态分组计数）
	rpc OrderStats (OrderStatsRequest) returns (OrderStatsReply);
	// 获取近 N 日订单趋势（管理端仪表盘按日统计）
	rpc GetOrderTrend (GetOrderTrendRequest) returns (GetOrderTrendReply);
	// 批量获取订单详情（含商品明细），用于导出等场景，1 次调用替代 N 次 GetOrder
	rpc BatchGetOrder (BatchGetOrderRequest) returns (BatchGetOrderReply);
	// 用户订单统计（个人中心使用）：按状态计数 + 累计消费
	rpc GetUserOrderStats (GetUserOrderStatsRequest) returns (GetUserOrderStatsReply);
	// 发货（管理端调用）：待发货 -> 已发货，并写入物流单号
	rpc ShipOrder (ShipOrderRequest) returns (ShipOrderReply);
	// 确认收货（用户端调用）：已发货/待收货 -> 已完成
	rpc ReceiveOrder (ReceiveOrderRequest) returns (ReceiveOrderReply);
	// 取消订单（用户端/管理端调用）：待支付/已支付 -> 已取消
	rpc CancelOrder (CancelOrderRequest) returns (CancelOrderReply);
	// 查询超时未支付的待付款订单（task 服务 cron 兜底扫描用，status=1 且超过超时阈值）
	rpc ListOverdueWaitPayOrders (ListOverdueWaitPayOrdersRequest) returns (ListOverdueWaitPayOrdersReply);
	// 申请退款（用户端调用）：已支付/待发货 -> 退款中，并生成退款单
	rpc ApplyRefund (ApplyRefundRequest) returns (ApplyRefundReply);
	// 退款单列表（管理端/用户端调用）：user_id>0 时查询个人退款单
	rpc ListRefund (ListRefundRequest) returns (ListRefundReply);
	// 审核退款（管理端调用）：通过 -> 已退款并恢复库存；拒绝 -> 订单恢复申请前状态
	rpc AuditRefund (AuditRefundRequest) returns (AuditRefundReply);
	// 查询物流轨迹（用户端/管理端调用）：返回物流公司、单号、发货时间与轨迹节点时间线
	rpc GetLogistics (GetLogisticsRequest) returns (GetLogisticsReply);
}

message CreateOrderRequest {
	int64 user_id = 1;
	int64 product_id = 2; // 立即购买：单个商品ID（与 items 二选一）
	int32 count = 3; // 立即购买：数量
	int64 price = 4; // 立即购买：单价（单位：分）
	repeated OrderItemProto items = 5; // 购物车结算：多个商品（与 product_id 二选一）
	int64 sku_id = 6; // 立即购买：SKU ID
	int64 coupon_record_id = 7; // 优惠券发放记录ID（可选）
	int64 address_id = 8; // 收货地址ID（可选）
	string receiver = 9; // 收货人（地址快照）
	string phone = 10; // 手机号（地址快照）
	string address = 11; // 完整收货地址（地址快照）
	int64 freight = 12; // 运费（单位：分）
}

message CreateOrderReply {
	int64 order_id = 1;
}

message UpdateOrderRequest {}

message UpdateOrderReply {}

message DeleteOrderRequest {}

message DeleteOrderReply {}

message GetOrderRequest {
	int64 order_id = 1;
}

message GetOrderReply {
	int64 order_id = 1;
	int64 user_id = 2;
	string order_no = 3;
	int32 status = 4;
	int64 total_price = 5; // 订单总金额
	int64 pay_amount = 6; // 支付金额
	repeated OrderItemProto items = 7;
	int64 freight = 8; // 运费（单位：分）
	int64 discount_amount = 9; // 优惠金额（单位：分）
	int64 created_at = 10; // 下单时间（Unix 时间戳秒）
	string logistics_company = 11; // 物流公司（发货后）
	string logistics_no = 12; // 快递单号（发货后）
	string receiver = 13; // 收货人
	string phone = 14; // 手机号
	string address = 15; // 完整收货地址
}

message OrderItemProto {
	int64 product_id = 1;
	string product_name = 2;
	int64 price = 3; // 单价
	int32 quantity = 4; // 数量
	int64 sku_id = 5; // SKU ID
	string spec_desc = 6; // 规格描述快照（如"红色/大号"）
	string image = 7; // 商品图片
}

message ListOrderRequest {
	int32 page = 1;
	int32 page_size = 2;
	string status = 3; // 按状态筛选（空字符串表示全部）
	string keyword = 4; // 按订单号模糊搜索
	string date_from = 5; // 开始日期（格式：2006-01-02）
	string date_to = 6; // 结束日期（格式：2006-01-02）
	int64 user_id = 7; // 按用户过滤（>0 时生效，个人中心使用）
}

message ListOrderReply {
	repeated ListOrderItem items = 1;
	int32 total = 2;
}

message ListOrderItem {
	int64 order_id = 1;
	string order_no = 2;
	int64 user_id = 3;
	int32 status = 4;
	int64 total_price = 5;
	int64 pay_amount = 6;
	int64 freight = 7;
	int64 discount_amount = 8;
	int64 created_at = 9;
}


message PayOrderRequest {
	int64 order_id = 1;
	int64 user_id = 2;
}

message PayOrderReply {}

// 订单统计请求
message OrderStatsRequest {}

// 订单统计响应
message OrderStatsReply {
	int32 total_count = 1; // 总订单数
	int32 pending_count = 2; // 待处理数（待支付+待发货: status=1,2,3）
	int32 today_count = 3; // 今日订单数
	int32 refund_count = 4; // 退款/售后数（退款中+已退款: status=8,9）
	int32 yesterday_count = 5; // 昨日订单数（增长率对比用）
	int64 today_revenue = 6; // 今日营收（今日支付/完成订单实付金额，单位：分）
	int64 yesterday_revenue = 7; // 昨日营收（单位：分）
}

// 获取订单趋势请求
message GetOrderTrendRequest {
	int32 days = 1; // 统计天数（默认 14）
}

// 获取订单趋势响应
message GetOrderTrendReply {
	repeated TrendItem items = 1; // 按日期升序
}

// 订单趋势项
message TrendItem {
	string date = 1; // 日期（MM-DD）
	int32 order_count = 2; // 当日订单数
}

// 批量获取订单详情请求
message BatchGetOrderRequest {
	repeated int64 order_ids = 1; // 订单ID列表
}

// 批量获取订单详情响应（复用 GetOrderReply 结构，含商品明细）
message BatchGetOrderReply {
	repeated GetOrderReply orders = 1;
}

enum OrderStatus {
    OrderStatusUnspecified = 0; // 未指定
    WaitPay = 1; // 待支付
    Pay = 2; // 已支付
    WaitShip = 3; // 待发货
    Ship = 4; // 已发货
    WaitReceive = 5; // 待收货
    Complete = 6; // 已完成
    Cancel = 7; // 已取消
    Refunding = 8; // 退款中
    Refunded = 9; // 已退款
}

// 用户订单统计请求
message GetUserOrderStatsRequest {
	int64 user_id = 1;
}

// 用户订单统计响应（个人中心使用）
message GetUserOrderStatsReply {
	int64 total_orders = 1; // 总订单数（不含已取消）
	int64 pending_pay = 2; // 待付款（status=1）
	int64 pending_ship = 3; // 待发货（status=3）
	int64 pending_receive = 4; // 待收货（status=5）
	int64 complete = 5; // 已完成/待评价（status=6）
	int64 refund_count = 6; // 退款/售后（status=8,9）
	int64 total_spent = 7; // 累计消费（已完成订单实付金额之和，单位：分）
}

// 发货请求（管理端调用）
message ShipOrderRequest {
	int64 order_id = 1; // 订单ID
	string logistics_company = 2; // 物流公司
	string logistics_no = 3; // 快递单号
}

// 发货响应
message ShipOrderReply {}

// 确认收货请求（用户端调用）
message ReceiveOrderRequest {
	int64 order_id = 1; // 订单ID
	int64 user_id = 2; // 用户ID（校验订单归属）
}

// 确认收货响应
message ReceiveOrderReply {}

// 取消订单请求（用户端/管理端调用）
message CancelOrderRequest {
	int64 order_id = 1; // 订单ID
	int64 user_id = 2; // 用户ID（>0 时校验订单归属；0 表示管理端操作）
	string reason = 3; // 取消原因（可选）
}

// 取消订单响应
message CancelOrderReply {}

// 超时待付款订单查询请求
message ListOverdueWaitPayOrdersRequest {
	int32 page = 1;
	int32 page_size = 2;
	int64 timeout_seconds = 3; // 超时阈值（秒）：创建时间早于 now-timeout_seconds 且仍为待付款的订单
}

message ListOverdueWaitPayOrdersReply {
	repeated ListOrderItem items = 1; // 复用列表项结构（含 order_id / created_at / user_id）
	int32 total = 2;
}

// 退款单状态枚举
enum RefundStatus {
    RefundStatusUnspecified = 0; // 未指定
    RefundPending = 1; // 待审核
    RefundApproved = 2; // 已通过（已退款）
    RefundRejected = 3; // 已拒绝
}

// 申请退款请求（用户端调用）
message ApplyRefundRequest {
	int64 order_id = 1; // 订单ID
	int64 user_id = 2; // 用户ID（校验订单归属）
	string reason = 3; // 退款原因
}

// 申请退款响应
message ApplyRefundReply {
	int64 refund_id = 1; // 退款单ID
}

// 退款单列表请求（管理端/用户端共用）
message ListRefundRequest {
	int32 page = 1;
	int32 page_size = 2;
	string status = 3; // 按退款单状态筛选（1-待审核 2-已通过 3-已拒绝；空字符串表示全部）
	string keyword = 4; // 按订单号模糊搜索
	int64 user_id = 5; // 按用户过滤（>0 时生效，个人中心使用）
}

// 退款单列表响应
message ListRefundReply {
	repeated RefundItem items = 1;
	int32 total = 2;
}

// 退款单项
message RefundItem {
	int64 refund_id = 1; // 退款单ID
	int64 order_id = 2; // 订单ID
	string order_no = 3; // 订单号
	int64 user_id = 4; // 用户ID
	int64 refund_amount = 5; // 退款金额（单位：分，即订单实付金额）
	string reason = 6; // 退款原因
	int32 status = 7; // 退款单状态（1-待审核 2-已通过 3-已拒绝）
	string status_text = 8; // 退款单状态文本
	string reject_reason = 9; // 拒绝原因
	string auditor = 10; // 审核人
	int64 created_at = 11; // 申请时间（Unix 秒）
	int64 audit_time = 12; // 审核时间（Unix 秒，0=未审核）
	int32 origin_status = 13; // 申请退款前的订单状态（拒绝后恢复用）
}

// 审核退款请求（管理端调用）
message AuditRefundRequest {
	int64 refund_id = 1; // 退款单ID
	bool approve = 2; // true=审核通过（退款并恢复库存）；false=审核拒绝
	string reject_reason = 3; // 拒绝原因（approve=false 时必填）
	int64 auditor_id = 4; // 审核人ID
	string auditor = 5; // 审核人名称
}

// 审核退款响应
message AuditRefundReply {}

// 查询物流轨迹请求
message GetLogisticsRequest {
	int64 order_id = 1; // 订单ID
}

// 查询物流轨迹响应
message GetLogisticsReply {
	int64 order_id = 1; // 订单ID
	string logistics_company = 2; // 物流公司
	string logistics_no = 3; // 快递单号
	int64 ship_time = 4; // 发货时间（Unix 秒，0=未发货）
	repeated LogisticsTrace traces = 5; // 轨迹节点（按时间升序）
}

// 物流轨迹节点
message LogisticsTrace {
	int64 time = 1; // 节点时间（Unix 秒）
	string desc = 2; // 节点描述
	int32 status = 3; // 节点状态: 1-已发货 2-运输中 3-派送中 4-已签收
}
