syntax = "proto3";

package api.service.product.v1;

option go_package = "cyi-app/api/service/product/v1;v1";
option java_multiple_files = true;
option java_package = "api.service.product.v1";

service Product {
	rpc CreateProduct (CreateProductRequest) returns (CreateProductReply);
	rpc UpdateProduct (UpdateProductRequest) returns (UpdateProductReply);
	rpc DeleteProduct (DeleteProductRequest) returns (DeleteProductReply);
	rpc GetProduct (GetProductRequest) returns (GetProductReply);
	rpc ListProduct (ListProductRequest) returns (ListProductReply);
}

message CreateProductRequest {
	string name = 1;        // 商品名称
	string description = 2;  // 商品描述
	int64 price = 3;        // 价格（单位：分）
}

message CreateProductReply {
	int64 product_id = 1;   // 创建后返回的商品ID
}

message UpdateProductRequest {
	int64 product_id = 1;   // 商品ID
	string name = 2;        // 商品名称
	string description = 3;  // 商品描述
	int64 price = 4;        // 价格（单位：分）
}

message UpdateProductReply {}

message DeleteProductRequest {}

message DeleteProductReply {}

message GetProductRequest {
	int64 product_id = 1;   // 商品ID
}

message GetProductReply {
	int64 product_id = 1;   // 商品ID
	string name = 2;        // 商品名称
	string description = 3;  // 商品描述
	int64 price = 4;        // 价格（单位：分）
	int32 status = 5;       // 状态 0-下架 1-上架
}

message ListProductRequest {}

message ListProductReply {}
