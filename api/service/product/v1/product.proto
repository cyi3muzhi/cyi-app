syntax = "proto3";

package api.service.product.v1;

import "google/protobuf/wrappers.proto";

option go_package = "cyi-app/api/service/product/v1;v1";
option java_multiple_files = true;
option java_package = "api.service.product.v1";

// 规格组信息（如颜色、尺码）
message SpecGroupInfo {
	int64 id = 1;           // 规格组ID
	string name = 2;        // 规格名称（如颜色、尺码）
	repeated string values = 3; // 规格值列表（如红色、蓝色）
}

// SKU 信息
message SkuInfo {
	int64 id = 1;           // SKU ID
	string sku_code = 2;    // SKU编码
	int64 price = 3;        // 价格（单位：分）
	int32 stock = 4;        // 库存
	int32 sales = 5;        // 销量
	map<string, string> spec = 6; // 规格描述，如 {"颜色":"红色","尺码":"XL"}
	string image = 7;       // SKU图片
}

// 商品服务
service Product {
	// 创建商品
	rpc CreateProduct (CreateProductRequest) returns (CreateProductReply);
	// 更新商品
	rpc UpdateProduct (UpdateProductRequest) returns (UpdateProductReply);
	// 删除商品
	rpc DeleteProduct (DeleteProductRequest) returns (DeleteProductReply);
	// 获取商品详情
	rpc GetProduct (GetProductRequest) returns (GetProductReply);
	// 商品列表
	rpc ListProduct (ListProductRequest) returns (ListProductReply);
	// 商品名称搜索联想
	rpc SuggestProduct (SuggestProductRequest) returns (SuggestProductReply);
}

// 商品信息（完整字段）
message ProductItem {
	int64 product_id = 1;   // 商品ID
	string name = 2;        // 商品名称
	string description = 3;  // 商品描述
	int64 price = 4;        // 价格（单位：分）
	int32 status = 5;       // 状态 0-下架 1-上架
	string category = 6 [deprecated = true];  // 已废弃，改用 category_id
	string image = 7;       // 商品图片
	int32 sales = 8;        // 销量
	repeated SpecGroupInfo specs = 9;  // 规格组列表
	repeated SkuInfo skus = 10;        // SKU列表
	int64 category_id = 11;  // 商品分类ID，关联 category 表
	repeated string images = 12; // 轮播图列表
}

// CreateProductRequest 创建商品请求
message CreateProductRequest {
	string name = 1;        // 商品名称
	string description = 2;  // 商品描述
	int64 price = 3;        // 价格（单位：分）
	string category = 4 [deprecated = true];  // 已废弃，改用 category_id
	string image = 5;       // 商品图片
	int32 sales = 6;        // 销量
	repeated SpecGroupInfo specs = 7;  // 规格组列表
	repeated SkuInfo skus = 8;         // SKU列表
	int64 category_id = 9;   // 商品分类ID
	repeated string images = 10; // 轮播图列表
}

// CreateProductReply 创建商品响应
message CreateProductReply {
	int64 product_id = 1;   // 创建后返回的商品ID
}

// UpdateProductRequest 更新商品请求
message UpdateProductRequest {
	int64 product_id = 1;   // 商品ID
	string name = 2;        // 商品名称
	string description = 3;  // 商品描述
	int64 price = 4;        // 价格（单位：分）
	string category = 5 [deprecated = true];  // 已废弃，改用 category_id
	string image = 6;       // 商品图片
	int32 sales = 7;        // 销量
	int32 status = 8;       // 状态 0-下架 1-上架
	repeated SpecGroupInfo specs = 9;  // 规格组列表
	repeated SkuInfo skus = 10;        // SKU列表
	int64 category_id = 11;  // 商品分类ID
	repeated string images = 12; // 轮播图列表
}

// UpdateProductReply 更新商品响应
message UpdateProductReply {
	bool success = 1;       // 是否成功
}

// DeleteProductRequest 删除商品请求
message DeleteProductRequest {
	int64 product_id = 1;   // 商品ID
}

// DeleteProductReply 删除商品响应
message DeleteProductReply {
	bool success = 1;       // 是否成功
}

// GetProductRequest 获取商品详情请求
message GetProductRequest {
	int64 product_id = 1;   // 商品ID
}

// GetProductReply 获取商品详情响应
message GetProductReply {
	ProductItem product = 1; // 商品详情（含 specs 和 skus）
}

// ListProductRequest 商品列表请求
message ListProductRequest {
	int32 page = 1;         // 页码（从1开始）
	int32 page_size = 2;    // 每页条数
	string keyword = 3;     // 关键词搜索（匹配名称/描述）
	string category = 4 [deprecated = true];  // 已废弃，改用 category_id
	string status = 5;      // 状态筛选
	int64 category_id = 6;   // 分类ID筛选
	google.protobuf.Int32Value stock_eq = 7; // 按可用库存数量筛选（如 {value: 0}=缺货，不传=不筛选）
	google.protobuf.Int32Value stock_lte = 8; // 按可用库存上限筛选（库存 <= value，用于库存预警，不传=不筛选）
}

// ListProductReply 商品列表响应
message ListProductReply {
	repeated ProductItem items = 1; // 商品列表
	int32 total = 2;                // 总条数
}

// 搜索联想请求
message SuggestProductRequest {
	string keyword = 1;     // 联想关键词
	int32 limit = 2;        // 返回条数上限（默认 8，最大 20）
}

// 搜索联想响应
message SuggestProductReply {
	repeated string items = 1;  // 商品名称列表
}
