syntax = "proto3";

package api.service.product.v1;

option go_package = "cyi-app/api/service/product/v1;v1";
import "errors/errors.proto";

enum ProductErrorReason {
	// 设置缺省错误码
	option (errors.default_code) = 500;

	// 商品不存在
	PRODUCT_NOT_FOUND = 0 [(errors.code) = 422];
	// 库存不存在
	STOCK_NOT_FOUND = 1 [(errors.code) = 422];
	// 库存不足
	INSUFFICIENT_STOCK = 2 [(errors.code) = 422];
	// 库存版本冲突（并发）
	STOCK_VERSION_CONFLICT = 3 [(errors.code) = 422];
}