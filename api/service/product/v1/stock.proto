syntax = "proto3";

package api.service.product.v1;

option go_package = "cyi-app/api/service/product/v1;v1";
option java_multiple_files = true;
option java_package = "api.service.product.v1";

service Stock {
	rpc CreateStock (CreateStockRequest) returns (CreateStockReply);
	rpc UpdateStock (UpdateStockRequest) returns (UpdateStockReply);
	rpc ReserveStock (ReserveStockRequest) returns (ReserveStockReply);
	rpc DeductStock (DeductStockRequest) returns (DeductStockReply);
	rpc ReleaseStock (ReleaseStockRequest) returns (ReleaseStockReply);
	rpc AddStock (AddStockRequest) returns (AddStockReply);
	rpc DeleteStock (DeleteStockRequest) returns (DeleteStockReply);
	rpc GetStock (GetStockRequest) returns (GetStockReply);
	rpc ListStock (ListStockRequest) returns (ListStockReply);
}

message CreateStockRequest {}
message CreateStockReply {}

message UpdateStockRequest {
	int64 product_id = 1;   // 商品ID
	int32 total = 2;        // 总库存数量
}

message UpdateStockReply {
	bool success = 1;
}

message DeleteStockRequest {}
message DeleteStockReply {}

message GetStockRequest {
	int64 product_id = 1 [deprecated = true];   // 已废弃，改用 sku_id
	int64 sku_id = 2;                           // SKU ID
}

message GetStockReply {
	int64 product_id = 1;   // 商品ID
	int32 total = 2;        // 总库存
	int32 available = 3;    // 可用库存
	int32 reserved = 4;     // 预留库存
	int32 version = 5;      // 乐观锁版本号
}

message ReserveStockRequest {
	int64 product_id = 1 [deprecated = true];   // 已废弃，改用 sku_id
	int32 count = 2;                            // 预留数量
	int32 version = 3;                          // 乐观锁版本号
	int64 sku_id = 4;                           // SKU ID
}

message ReserveStockReply {
	bool success = 1;
	int32 new_version = 2;  // 新版本号
}

// 确认扣减库存（支付后实际扣减总数和预留）
message DeductStockRequest {
	int64 product_id = 1 [deprecated = true];   // 已废弃，改用 sku_id
	int32 count = 2;                            // 扣减数量
	int32 version = 3;                          // 乐观锁版本号
	int64 sku_id = 4;                           // SKU ID
}

message DeductStockReply {
	bool success = 1;
	int32 new_version = 2;  // 新版本号
}

// 释放预留库存（取消未支付订单时）
// reserved- , available+ , version++
// 条件: version 匹配 且 reserved >= count
message ReleaseStockRequest {
	int64 product_id = 1 [deprecated = true];   // 已废弃，改用 sku_id
	int32 count = 2;                            // 释放数量
	int32 version = 3;                          // 乐观锁版本号
	int64 sku_id = 4;                           // SKU ID
}

message ReleaseStockReply {
	bool success = 1;
	int32 new_version = 2;  // 新版本号
}

// 增加库存（退款或取消已支付订单时）
// total+ , available+ , version++
// 条件: version 匹配
message AddStockRequest {
	int64 product_id = 1 [deprecated = true];   // 已废弃，改用 sku_id
	int32 count = 2;                            // 增加数量
	int32 version = 3;                          // 乐观锁版本号
	int64 sku_id = 4;                           // SKU ID
}

message AddStockReply {
	bool success = 1;
	int32 new_version = 2;  // 新版本号
}

message ListStockRequest {}
message ListStockReply {}