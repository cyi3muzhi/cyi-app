syntax = "proto3";

package api.service.user.v1;

option go_package = "cyi-app/api/service/user/v1;v1";
import "errors/errors.proto";

enum UserServiceErrorReason {
	// 设置缺省错误码
	option (errors.default_code) = 500;

	USER_NOT_FOUND = 0 [(errors.code) = 500];

	CONTENT_MISSING = 1 [(errors.code) = 500];
	// 密码不一致
	PASSWORD_NOT_MATCH = 2 [(errors.code) = 500];
	// 用户已存在
	USER_ALREADY_EXIST = 3 [(errors.code) = 500];
	// 用户名或手机号不能为空
	USERNAME_OR_PHONE_EMPTY = 4 [(errors.code) = 500];
	// 密码错误
	PASSWORD_ERROR = 5 [(errors.code) = 500];
	// 密码加密失败
	PASSWORD_ENCRYPTION_FAILED = 6 [(errors.code) = 500];
	// 创建用户失败
	CREATE_USER_FAILED = 7 [(errors.code) = 500];
}