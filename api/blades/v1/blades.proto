syntax = "proto3";

package api.blades.v1;

option go_package = "cyi-app/api/blades/v1;v1";
option java_multiple_files = true;
option java_package = "api.blades.v1";
import "validate/validate.proto";

// Blades 服务 - AI 智能助手
// 提供 AI 聊天、知识库管理、文本生成等功能
// 仅供内部服务通过 gRPC 调用，不暴露 HTTP 接口
service Blades {
  // Chat 非流式聊天
  rpc Chat (ChatRequest) returns (ChatReply);
  // ChatStream 流式聊天（SSE 流式响应）
  rpc ChatStream (ChatStreamRequest) returns (stream ChatChunkReply);
  // GetChatHistory 获取聊天历史
  rpc GetChatHistory (GetChatHistoryRequest) returns (GetChatHistoryReply);
  // ClearChatHistory 清除聊天历史
  rpc ClearChatHistory (ClearChatHistoryRequest) returns (ClearChatHistoryReply);
  // UploadKnowledge 上传知识库文档（流式上传，支持大文件分片）
  rpc UploadKnowledge (stream UploadKnowledgeRequest) returns (UploadKnowledgeReply);
  // SearchKnowledge 搜索知识库
  rpc SearchKnowledge (SearchKnowledgeRequest) returns (SearchKnowledgeReply);
  // DeleteKnowledge 删除知识库文档
  rpc DeleteKnowledge (DeleteKnowledgeRequest) returns (DeleteKnowledgeReply);
  // ListKnowledge 列出知识库文档
  rpc ListKnowledge (ListKnowledgeRequest) returns (ListKnowledgeReply);
  // GenerateText 生成文本（不保存聊天历史），用于 AI 辅助编写等场景
  rpc GenerateText (GenerateTextRequest) returns (GenerateTextReply);
}

// GenerateTextRequest 文本生成请求
message GenerateTextRequest {
  // 提示词，长度 1-2000 字符
  string prompt = 1 [(validate.rules).string = {min_len: 1, max_len: 2000}];
}

// GenerateTextReply 文本生成响应
message GenerateTextReply {
  // 生成的文本内容
  string text = 1;
}

// ChatRequest 非流式聊天请求
message ChatRequest {
  // 用户 ID（必须大于 0）
  int64 user_id = 1 [(validate.rules).int64.gt = 0];
  // 来源：admin（管理后台）、user（用户端）、other（其他）
  string source = 2 [(validate.rules).string = {in: ["admin", "user", "other"]}];
  // 角色标识（如 admin、super_admin 等）
  string role = 3;
  // 用户消息，长度 1-2000 字符
  string message = 4 [(validate.rules).string = {min_len: 1, max_len: 2000}];
  // 是否启用 RAG 知识库检索
  bool enable_rag = 5;
}

// ChatReply 非流式聊天响应
message ChatReply {
  // AI 回复内容
  string message = 1;
}

// ChatStreamRequest 流式聊天请求
message ChatStreamRequest {
  // 用户 ID（必须大于 0）
  int64 user_id = 1 [(validate.rules).int64.gt = 0];
  // 来源：admin（管理后台）、user（用户端）、other（其他）
  string source = 2 [(validate.rules).string = {in: ["admin", "user", "other"]}];
  // 角色标识
  string role = 3;
  // 用户消息，长度 1-2000 字符
  string message = 4 [(validate.rules).string = {min_len: 1, max_len: 2000}];
  // 是否启用 RAG 知识库检索
  bool enable_rag = 5;
}

// ChatChunkReply 流式聊天响应块
message ChatChunkReply {
  // 当前块的文本片段
  string chunk = 1;
  // 是否已完成全部响应
  bool done = 2;
}

// GetChatHistoryRequest 获取聊天历史请求
message GetChatHistoryRequest {
  // 用户 ID（必须大于 0）
  int64 user_id = 1 [(validate.rules).int64.gt = 0];
  // 来源过滤
  string source = 2;
}

// HistoryMessage 聊天历史消息
message HistoryMessage {
  // 消息角色（user/assistant/system）
  string role = 1;
  // 消息内容
  string content = 2;
  // 消息时间戳
  int64 timestamp = 3;
}

// GetChatHistoryReply 获取聊天历史响应
message GetChatHistoryReply {
  // 历史消息列表
  repeated HistoryMessage messages = 1;
}

// ClearChatHistoryRequest 清除聊天历史请求
message ClearChatHistoryRequest {
  // 用户 ID（必须大于 0）
  int64 user_id = 1 [(validate.rules).int64.gt = 0];
  // 来源
  string source = 2;
}

// ClearChatHistoryReply 清除聊天历史响应
message ClearChatHistoryReply {
  // 是否清除成功
  bool success = 1;
}

// UploadKnowledgeRequest 上传知识库文档请求（流式）
message UploadKnowledgeRequest {
  // 上传数据类型：meta（文档元信息）或 content_chunk（文件内容分片）
  oneof data {
    // 文档元信息（第一个分片发送）
    KnowledgeMeta meta = 1;
    // 文件内容分片（后续分片发送）
    bytes content_chunk = 2;
  }
}

// KnowledgeMeta 知识库文档元信息
message KnowledgeMeta {
  // 文档唯一标识
  string doc_id = 1;
  // 来源：admin（管理后台）、user（用户端）、public（公开）
  string source = 2 [(validate.rules).string = {in: ["admin", "user", "public"]}];
  // 文档标题
  string title = 3;
  // 内容类型（如 pdf、docx、txt、markdown 等）
  string content_type = 4;
  // 自定义标签
  map<string, string> tags = 5;
}

// UploadKnowledgeReply 上传知识库文档响应
message UploadKnowledgeReply {
  // 文档唯一标识
  string doc_id = 1;
  // 分块数量
  int32 chunk_count = 2;
  // Token 数量
  int32 token_count = 3;
}

// SearchKnowledgeRequest 搜索知识库请求
message SearchKnowledgeRequest {
  // 来源过滤
  string source = 1;
  // 搜索关键词
  string query = 2 [(validate.rules).string = {min_len: 1}];
  // 返回结果数量上限
  int32 top_k = 3;
}

// KnowledgeChunk 知识库搜索结果片段
message KnowledgeChunk {
  // 所属文档 ID
  string doc_id = 1;
  // 文档标题
  string title = 2;
  // 匹配内容
  string content = 3;
  // 匹配得分
  float score = 4;
  // 自定义标签
  map<string, string> tags = 5;
}

// SearchKnowledgeReply 搜索知识库响应
message SearchKnowledgeReply {
  // 匹配的文档片段列表
  repeated KnowledgeChunk chunks = 1;
}

// DeleteKnowledgeRequest 删除知识库文档请求
message DeleteKnowledgeRequest {
  // 要删除的文档 ID
  string doc_id = 1;
  // 来源
  string source = 2;
}

// DeleteKnowledgeReply 删除知识库文档响应
message DeleteKnowledgeReply {
  // 是否删除成功
  bool success = 1;
}

// ListKnowledgeRequest 列出知识库文档请求
message ListKnowledgeRequest {
  // 来源过滤（空则全部）
  string source = 1;
}

// KnowledgeDocInfo 文档信息
message KnowledgeDocInfo {
  // 文档唯一标识
  string doc_id = 1;
  // 来源
  string source = 2;
  // 文档标题
  string title = 3;
  // 分块数量
  int32 chunk_count = 4;
  // 自定义标签
  map<string, string> tags = 5;
}

// ListKnowledgeReply 列出知识库文档响应
message ListKnowledgeReply {
  // 文档列表
  repeated KnowledgeDocInfo docs = 1;
}
