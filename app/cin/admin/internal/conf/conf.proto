syntax = "proto3";
package kratos.api;

option go_package = "cyi-app/app/cin/admin/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Auth auth = 3;
  Trace trace = 4;
  Log log = 5;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
    string password = 5;
  }
  Redis redis = 2;
}

message Registry {
    message Consul {
        string address = 1;
        string scheme = 2;
        string token = 3;
        string username = 4;
        string password = 5;
        bool enable_health_check = 8;
        int32 check_interval = 9;
    }
    Consul consul = 1;
}

message Auth {
    map<string, string> service_key = 1;
    string api_key = 2;
    repeated string white_list = 3;
}

message Trace {
    string endpoint = 1;
}

message Log {
    string level = 1;
    bool enable_console = 2;
    bool enable_file = 3;
    string log_dir = 4;
    string time_format = 5;
    bool enable_color = 6;
}
