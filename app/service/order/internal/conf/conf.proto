syntax = "proto3";

package cyi.app.service.order.conf;

import "google/protobuf/duration.proto";

option go_package = "cyi-app/app/service/order/internal/conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Auth auth = 3;
  Trace trace = 4;
  Log log = 5;
  Dtm dtm = 6;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
    string password = 5;
  }
  Database database = 1;
  // Redis 配置（task 子进程 asynq 队列使用）
  Redis redis = 2;
}

message Registry {
    message Consul {
        string address = 1; // 服务器地址，支持多个地址逗号分隔
        string scheme = 2; // http 或 https
        string token = 3; // ACL 令牌
        string username = 4; // 基本认证用户名
        string password = 5; // 基本认证密码
        bool enable_health_check = 8; // 是否启用健康检查
        int32 check_interval = 9; // 健康检查间隔(秒)
    }
    Consul consul = 1;
}

message Auth {
    string api_key = 1;
    // 服务名对应密钥
    map<string, string> service_key = 2;
}

message Trace {
    string endpoint = 1;
}

// DTM 分布式事务管理器配置
message Dtm {
    // DTM 服务地址（全局共享，如 http://dtm:36789/api/dtmsvr）
    string server = 1;
    // DTM 回调本服务分支的地址（Confirm/Cancel 由 DTM 服务回调，需 DTM 可达；
    // 本地开发 + DTM 容器时用 host.docker.internal:端口；全容器部署用 http://service-order:8003）
    string busi_url = 2;
    // 本服务进程访问自己分支的地址（Try 由本服务进程内发起，如 http://localhost:8003）
    string local_url = 3;
}

// 日志配置
message Log {
    string level = 1; // 日志级别
    bool enable_console = 2; // 是否启用控制台输出
    bool enable_file = 3; // 是否启用文件输出
    string log_dir = 4; // 日志目录
    string time_format = 5; // 时间格式
    bool enable_color = 6; // 是否启用颜色
}