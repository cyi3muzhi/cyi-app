syntax = "proto3";
package kratos.api;

option go_package = "cyi-app/app/service/user/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
    string password = 5;
  }
  Database database = 1;
  Redis redis = 2;
}

message Registry {
    message Consul {
        string address = 1;        // 服务器地址，支持多个地址逗号分隔
        string scheme = 2;         // http 或 https
        string token = 3;          // ACL 令牌
        string username = 4;       // 基本认证用户名
        string password = 5;       // 基本认证密码
        bool enable_health_check = 8; // 是否启用健康检查
        int32 check_interval = 9;  // 健康检查间隔(秒)
    }
    Consul consul = 1;
}