syntax = "proto3";
package kratos.api;

option go_package = "cyi-app/app/blades/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Auth auth = 3;
  Trace trace = 4;
  Log log = 5;
  Blades blades = 6;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
    string password = 5;
  }
  Redis redis = 2;
}

message Registry {
    message Consul {
        string address = 1; // 服务器地址，支持多个地址逗号分隔
        string scheme = 2; // http 或 https
        string token = 3; // ACL 令牌
        string username = 4; // 基本认证用户名
        string password = 5; // 基本认证密码
        bool enable_health_check = 8; // 是否启用健康检查
        int32 check_interval = 9; // 健康检查间隔(秒)
    }
    Consul consul = 1;
}

message Auth {
    map<string, string> service_key = 1; // 下游服务认证密钥
    string api_key = 2;
    repeated string white_list = 3; // 白名单
}

message Trace {
    string endpoint = 1;
}

// 日志配置
message Log {
    string level = 1; // 日志级别
    bool enable_console = 2; // 是否启用控制台输出
    bool enable_file = 3; // 是否启用文件输出
    string log_dir = 4; // 日志目录
    string time_format = 5; // 时间格式
    bool enable_color = 6; // 是否启用颜色
}

// Blades 配置
message Blades {
    string api_key = 1; // DeepSeek API 密钥
    string model = 2; // 模型名称，默认 deepseek-chat
    int32 max_tokens = 3; // 最大令牌数
    float temperature = 4; // 温度参数
    EmbeddingConfig embedding = 5; // Embedding 配置
    RAGConfig rag = 6; // RAG 配置
    KnowledgeConfig knowledge = 7; // 知识库配置
}

// Embedding 配置
message EmbeddingConfig {
    string model = 1; // 模型名称，默认 deepseek-embedding
    int32 dimension = 2; // 向量维度，默认 768
}

// RAG 配置
message RAGConfig {
    int32 top_k = 1; // 默认召回条数，默认 5
    int32 chunk_size = 2; // 分块大小（tokens），默认 800
    float chunk_overlap = 3; // 分块重叠比例，默认 0.15
    bool always_retrieve = 4; // 是否始终检索
}

// 知识库配置
message KnowledgeConfig {
    int32 max_docs_per_source = 1; // 每端知识库最大文档数，默认 1000
}